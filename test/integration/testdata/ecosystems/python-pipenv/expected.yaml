# A sealed scan of the python-pipenv scenario reports the one vulnerable dependency in the lockfile
# Pipenv generated, at the line of its own entry.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: python-pipenv
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2018-1000656
    location: Pipfile.lock:27
    package: pipenv flask 0.12.2
