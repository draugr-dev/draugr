# Two modules in one repository requiring the same dependency. The root module calls gjson's
# vulnerable Get and the tools module only calls Valid, so each finding carries its own module's
# verdict.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: go-nested
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    reachability: reachable
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: tools/go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    reachability: unreachable
