# Two modules in one repository requiring the same dependency. The root module calls gjson's
# vulnerable Get and the tools module only calls Valid, so each finding carries its own module's
# verdict.
init:
  controls: [sca, secrets, sast, iac]
  scanners: [sast.gosec]
  reachability: [govulncheck]
  components:
    - name: go-nested
      repositories: ["."]
  # --per-directory: a component for each directory with its own dependency file, carved
  # out of the root component.
  perDirectory:
    controls: [sca, secrets, sast, iac]
    scanners: [sast.gosec]
    reachability: [govulncheck]
    components:
      - name: go-nested
        repositories: ["."]
        ignore: [tools/]
      - name: tools
        repositories: ["."]
        paths: [tools]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    reachability: reachable
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: tools/go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    reachability: unreachable
