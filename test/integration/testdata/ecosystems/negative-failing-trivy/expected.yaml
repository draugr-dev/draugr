# Trivy exits 2 with a message. The control reports the exit status and the message rather than
# passing with no findings.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: negative-failing-trivy
      repositories: ["."]

sealed:
  failingTool: trivy

errors:
  - control: sca
    contains: "exit status 2: sealed fixture: this program failed on purpose"

# init enables iac as well, which Trivy also serves, and it reports the failure the same way.
initScan:
  errors:
    - control: sca
      contains: "exit status 2: sealed fixture: this program failed on purpose"
    - control: iac
      contains: "exit status 2: sealed fixture: this program failed on purpose"
