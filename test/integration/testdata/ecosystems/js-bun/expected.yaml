# A sealed scan of the js-bun scenario reports the one vulnerable dependency in the lockfile
# Bun generated, at the line of its own entry.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: js-bun
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2021-44906
    location: bun.lock:13
    package: bun minimist 1.2.5
