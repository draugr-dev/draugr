id: sealed-custom

info:
  name: Sealed fixture marker at /custom
  author: draugr
  severity: low
  description: The page carries the marker the sealed fixture plants at /custom.
  tags: sealed-custom

http:
  - method: GET
    path:
      - "{{BaseURL}}/custom"
    matchers:
      - type: word
        part: body
        words:
          - "sealed-custom-marker"
