# What a sealed scan of the Go scenario reports. SAST expectations are the ruleid: comments in
# repo/main.go. govulncheck reads the Go advisories from the local database the harness writes,
# and folds a verdict onto each of Trivy's findings rather than reporting its own.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: go
      repositories: ["."]

secrets:
  - file: deploy/aws.env
    rules: [aws-access-token]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2021-38561
    location: go.mod:5
    package: gomod golang.org/x/text v0.3.6
    reachability: reachable
  - control: sca
    tool: trivy
    rule: CVE-2022-32149
    location: go.mod:5
    package: gomod golang.org/x/text v0.3.6
    reachability: unreachable
