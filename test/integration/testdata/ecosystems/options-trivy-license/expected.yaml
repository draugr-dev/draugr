# The licenses control's deny and warn, trivyLicense's own deny and warn, and trivyLicense.full, one
# component each. default/ locks inherits (ISC), ms (MIT), sprintf-js (BSD-3-Clause) and tslib
# (0BSD), none of which the control reports without a policy, so default/ has no findings. Each
# policy component locks one of them and names its license, and so makes one finding: deny at level
# error and warn at level warning, which the goldens hold. default/ and full/ carry the same
# LGPL-3.0 LICENSE, which only full scanning reads.
#
# No component sets deny or warn under both the control and the scanner. licenses-warn-isc locks
# the same inherits as licenses-deny and flags ISC where licenses-deny denies it, so two components
# report license/ISC/inherits at two levels. SARIF holds one rule for that id, and the golden
# records it carrying neither verdict: each result's message states its own component's.
#
# trivyignore/ locks argparse (Python-2.0) and flags Python-2.0, and the repository's .trivyignore
# sets that license aside. Trivy drops it from its findings and lists it among what it excluded, so
# the one result arrives suppressed by the scanner. No other component locks a Python-2.0 package.
proves:
  - licenses.deny
  - licenses.warn
  - trivy-license.deny
  - trivy-license.warn
  - trivy-license.full

initScan:
  skip: the options proves names are the subject, and init writes none of them

init:
  controls: [iac, sast, sca, secrets]
  components:
    - name: options-trivy-license
      repositories: ["."]

findings:
  - {control: licenses, tool: trivy-license, rule: license/ISC/inherits, location: "licenses-deny/package-lock.json:15"}
  - {control: licenses, tool: trivy-license, rule: license/0BSD/tslib, location: "licenses-warn/package-lock.json:15"}
  - {control: licenses, tool: trivy-license, rule: license/ISC/inherits, location: "licenses-warn-isc/package-lock.json:15"}
  - {control: licenses, tool: trivy-license, rule: license/MIT/ms, location: "trivy-license-deny/package-lock.json:15"}
  - {control: licenses, tool: trivy-license, rule: license/BSD-3-Clause/sprintf-js, location: "trivy-license-warn/package-lock.json:15"}
  - {control: licenses, tool: trivy-license, rule: license/LGPL-3.0, location: "full/LICENSE"}
  - {control: licenses, tool: trivy-license, rule: license/Python-2.0/argparse, location: "trivyignore/package-lock.json:15", suppressed: scanner}
