# Two Go modules in one repository, each in its own directory and each a component scoped to that
# directory by paths:. Both require gjson v1.6.5. services/api calls the vulnerable Get and
# services/worker calls only Valid, so the same advisory is reachable in one and unreachable in the
# other. A verdict keyed on the repository, package and rule alone would carry one module's call
# path onto the other module's finding, and each finding here carries the verdict for its own code.
init:
  controls: [iac, sast, sca, secrets]
  scanners: [sast.gosec]
  reachability: [govulncheck]
  components:
    - name: monorepo-go-reachability
      repositories: ["."]
  perDirectory:
    controls: [iac, sast, sca, secrets]
    scanners: [sast.gosec]
    reachability: [govulncheck]
    components:
      - name: monorepo-go-reachability
        repositories: ["."]
        ignore: [services/api/, services/worker/]
      - name: api
        repositories: ["."]
        paths: [services/api]
      - name: worker
        repositories: ["."]
        paths: [services/worker]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: services/api/go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    component: api
    reachability: reachable
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: services/worker/go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    component: worker
    reachability: unreachable
