# An unchanged pull request compared with a base report the release before wrote. The repository
# holds the files a comparison records because each can set findings aside: .trivyignore,
# .gitleaksignore and .semgrepignore at the root, and src/.semgrepignore, which keeps
# src/generated.py out of the scan. SAST expectations are the ruleid: and ok: comments in
# repo/app.py and repo/src/generated.py.
#
# base/results.sarif is the release's scan of this repository, written with -write-sealed-base. A
# release that records one of these files where the one before did not reads, against that base, as
# a change that added it, and an unchanged pull request fails on the day its pipeline upgrades.
initScan:
  skip: the comparison with an earlier release's base is the subject

init:
  controls: [sca, secrets, sast]
  components:
    - name: diff-across-releases
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2018-1000656
    location: requirements.txt:2
    package: pip Flask 0.12.2

base:
  release: 0.189.3
  diff: 0
  scanBase: 0
  # 0.189.3 recorded no .semgrepignore below the root, so the comparison reads src/.semgrepignore at
  # the base's commit. A checkout without that commit cannot show the file was there.
  unread:
    diff: 1
    contains: "src/.semgrepignore is held as though this change added it"
