# trivyConfig.checks and trivyConfig.namespaces, on four components with the same Dockerfile, one
# that Trivy's built-in checks pass. workdir/checks holds DRAUGR-0001 in package user.draugr and
# DRAUGR-0002 in package acme.draugr. Where namespaces is set, a rule is reported only where checks
# loads it and namespaces names its package, so default/ has no findings and user/ and acme/ have
# one each. derived/ sets checks alone, so the namespaces come from the checks' package lines, user
# and acme, and both rules are reported there.
proves: [trivy-config.checks, trivy-config.namespaces]

initScan:
  skip: the options proves names are the subject, and init writes none of them

init:
  controls: [iac, sast, sca, secrets]
  components:
    - name: options-trivy-config
      repositories: ["."]

findings:
  - {control: iac, tool: Trivy, rule: DRAUGR-0001, location: "user/Dockerfile:1"}
  - {control: iac, tool: Trivy, rule: DRAUGR-0002, location: "acme/Dockerfile:1"}
  - {control: iac, tool: Trivy, rule: DRAUGR-0001, location: "derived/Dockerfile:1"}
  - {control: iac, tool: Trivy, rule: DRAUGR-0002, location: "derived/Dockerfile:1"}

# The repository's .trivyignore excludes DS-0002, and only trivyignore/Dockerfile runs as root.
# Trivy lists the exclusion under --show-suppressed, and the finding must arrive from there, set
# aside by the scanner.
  - {control: iac, tool: Trivy, rule: DS-0002, location: "trivyignore/Dockerfile:1", component: trivyignore, suppressed: scanner}
