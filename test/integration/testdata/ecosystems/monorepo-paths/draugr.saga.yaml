project: monorepo-paths
release:
  version: "1.0"
config:
  controls:
    sca:
      enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
      semgrep:
        config: ${{ DRAUGR_SEALED_SEMGREP_RULES }}
components:
  - name: api
    repositories:
      - url: ./monorepo-paths
        paths: [services/api]
  - name: web
    repositories:
      - url: ./monorepo-paths
        paths: [services/web]
