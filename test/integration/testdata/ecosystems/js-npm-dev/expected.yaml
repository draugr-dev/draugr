# sca.devDependencies: report counts minimist, a devDependency. Trivy reads development dependencies
# on every run, and under the default the finding stays in the report suppressed.
proves: [sca.devDependencies]

init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: js-npm-dev
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2021-44906
    location: package-lock.json:15
    package: npm minimist 1.2.5

# init leaves devDependencies at its default, so its descriptor reports the devDependency suppressed.
initScan:
  setAside: [CVE-2021-44906]
