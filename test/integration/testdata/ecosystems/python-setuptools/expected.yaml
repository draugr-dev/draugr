# A setup.py, which Trivy does not open and grype-fs does. The descriptor turns grype-fs on, as init
# does, and the finding is Grype's, matched against the sealed Grype database.
init:
  controls: [sca, secrets, sast, iac]
  scanners: [sca.grypeFs]
  components:
    - name: python-setuptools
      repositories: ["."]

findings:
  - control: sca
    tool: grype
    rule: CVE-2018-1000656-flask
    location: setup.py:1
    package: python flask 0.12.2
