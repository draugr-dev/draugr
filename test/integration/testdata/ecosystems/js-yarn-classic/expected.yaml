# A sealed scan of the js-yarn-classic scenario reports the one vulnerable dependency in the lockfile
# Yarn 1 generated, at the line of its own entry.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: js-yarn-classic
      repositories: ["."]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2021-44906
    location: yarn.lock:5
    package: yarn minimist 1.2.5
