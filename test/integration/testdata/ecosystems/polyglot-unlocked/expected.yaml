# Dependency files no scanner reads: manifests with no lockfile in five ecosystems, a requirements
# file with no pinned version, and a requirements-dev.txt Trivy's pip analyzer does not open. The
# golden report.json pins each under dependencyFiles with its reason; requirements.txt is the one
# file read.
init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: polyglot-unlocked
      repositories: ["."]
  # --per-directory: a component for each directory with its own dependency file, carved
  # out of the root component.
  perDirectory:
    controls: [sca, secrets, sast, iac]
    components:
      - name: polyglot-unlocked
        repositories: ["."]
        ignore: [api/, crate/, php/, rb/, svc/, tools/, web/]
      - name: api
        repositories: ["."]
        paths: [api]
      - name: crate
        repositories: ["."]
        paths: [crate]
      - name: php
        repositories: ["."]
        paths: [php]
      - name: rb
        repositories: ["."]
        paths: [rb]
      - name: svc
        repositories: ["."]
        paths: [svc]
      - name: tools
        repositories: ["."]
        paths: [tools]
      - name: web
        repositories: ["."]
        paths: [web]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2018-1000656
    location: requirements.txt:1
    package: pip flask 0.12.2
