project: python-pip
release:
  version: "1.0"
config:
  controls:
    sca:
      enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
      semgrep:
        config: ${{ DRAUGR_SEALED_SEMGREP_RULES }}
components:
  - name: python-pip
    repositories:
      - url: ./python-pip
