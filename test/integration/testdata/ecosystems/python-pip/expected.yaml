# What a sealed scan of the pip scenario reports. SAST expectations are the ruleid: and ok:
# comments in repo/app.py.
proves: [semgrep.config]

init:
  controls: [sca, secrets, sast, iac]
  components:
    - name: python-pip
      repositories: ["."]

secrets:
  - file: deploy/aws.env
    rules: [aws-access-token]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2018-1000656
    location: requirements.txt:2
    package: pip Flask 0.12.2
