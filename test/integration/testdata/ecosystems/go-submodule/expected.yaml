# A Go module below the repository root. gosec and govulncheck both analyze it; the gosec
# expectations are the ruleid: comments in repo/service/main.go.
init:
  controls: [sca, secrets, sast, iac]
  scanners: [sast.gosec]
  reachability: [govulncheck]
  components:
    - name: go-submodule
      repositories: ["."]
  # --per-directory: a component for each directory with its own dependency file, carved
  # out of the root component.
  perDirectory:
    controls: [sca, secrets, sast, iac]
    scanners: [sast.gosec]
    reachability: [govulncheck]
    components:
      - name: go-submodule
        repositories: ["."]
        ignore: [service/]
      - name: service
        repositories: ["."]
        paths: [service]

findings:
  - control: sca
    tool: trivy
    rule: CVE-2020-36067
    location: service/go.mod:5
    package: gomod github.com/tidwall/gjson v1.6.5
    reachability: reachable
