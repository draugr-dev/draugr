<svg viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="A secrets finding on a component declared internal and supporting is ranked at tier C1 instead of C4, so its band is P1 instead of P3, with its severity unchanged." xmlns="http://www.w3.org/2000/svg">
  <title>The context floor</title>
  <desc>A component named batch declares exposure internal and criticality supporting, tier C4. A leaked credential found on it has severity high, the secrets control's severity floor. The context floor ranks the finding at tier C1 instead of C4, marked floor, so its band is P1, C1 crossed with high, instead of P3, C4 crossed with high. The severity floor moves severity: a secrets finding is never below high, and it draws no mark. The context floor moves the tier: a secrets finding is ranked at C1, its severity unchanged, and it draws the floor mark. Both are always on, with no key, and apply as each secrets finding is ranked in run phase 2.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.b{font-weight:700}.c{text-anchor:middle}
      .box{fill:#12161B;stroke:#2F3841;stroke-width:1.5}
      .sev{fill:#12161B;stroke:#9AA4AE;stroke-width:1.5}
      .bfl{fill:#12161B;stroke:#E9635B;stroke-width:1.5;stroke-dasharray:2 4}
      .tier{fill:#12161B;stroke:#2F3841;stroke-width:1}
      .tu{fill:#E9635B}
    </style>
    <marker id="u" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E9635B"/></marker>
  </defs>
  <rect width="720" height="400" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">CONTEXT FLOOR · A TIER FOR THE CONTROL</text>

  <rect class="box" x="20" y="44" width="220" height="84" rx="8"/>
  <text class="m b" x="34" y="68">batch</text>
  <text class="m sm mu" x="34" y="90">exposure: internal</text>
  <text class="m sm mu" x="34" y="110">criticality: supporting</text>
  <rect class="box" x="20" y="142" width="220" height="46" rx="8"/>
  <text class="m sm" x="34" y="170">secrets finding</text>
  <rect class="sev" x="160" y="152" width="66" height="26" rx="5"/>
  <text class="m sm c" x="193" y="170">high</text>

  <rect class="bfl" x="270" y="44" width="60" height="30" rx="5" style="stroke-width:2"/><text class="m b c" x="300" y="64">C1</text>
  <rect class="tier" x="270" y="82" width="60" height="30" rx="5"/><text class="m c mu" x="300" y="102">C2</text>
  <rect class="tier" x="270" y="120" width="60" height="30" rx="5"/><text class="m c mu" x="300" y="140">C3</text>
  <rect class="box" x="270" y="158" width="60" height="30" rx="5" style="stroke:#9AA4AE"/><text class="m b c" x="300" y="178">C4</text>
  <text class="sm mu c" x="300" y="208">declared</text>
  <path d="M330 173C370 173 370 59 336 59" fill="none" stroke="#E9635B" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#u)"/>
  <text class="m b" x="374" y="121"><tspan class="tu">↑</tspan> floor</text>

  <rect x="470" y="44" width="44" height="30" rx="5" fill="#E5534B"/><text class="m b c" x="492" y="64" style="fill:#0B0E11">P1</text>
  <text x="526" y="64">C1 × high</text>
  <rect x="470" y="158" width="44" height="30" rx="5" fill="none" stroke="#7CA6B8" stroke-width="1.5" stroke-dasharray="4 3"/><text class="m b c" x="492" y="178" style="fill:#7CA6B8">P3</text>
  <text class="mu" x="526" y="178">C4 × high, without it</text>

  <rect class="box" x="20" y="236" width="330" height="80" rx="8"/>
  <text class="m b" x="34" y="260">severity floor</text>
  <text class="sm" x="34" y="282">secrets never below high</text>
  <text class="sm mu" x="34" y="302">moves severity · no mark</text>
  <rect class="bfl" x="370" y="236" width="330" height="80" rx="8"/>
  <text class="m b" x="384" y="260">context floor</text>
  <text class="sm" x="384" y="282">secrets ranked at C1, severity unchanged</text>
  <text class="sm mu" x="384" y="302">moves the tier · mark <tspan class="tu">↑</tspan> floor</text>

  <text class="e" x="20" y="352">WHEN</text>
  <text class="sm" x="84" y="352">Always on, with no key: applied as each secrets finding is ranked,</text>
  <text class="sm" x="84" y="372">in run phase 2.</text>
</svg>
