<svg viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="The ledger CVE under each signal on its own: four raise it from high to critical and P2 to P1, and unreachable lowers it to medium with the band held at P2." xmlns="http://www.w3.org/2000/svg">
  <title>Each signal on the ledger CVE</title>
  <desc>The ledger CVE is rated high on tier C2, P2, with no signal. KEV, turned on by config.exploitability.kev, raises it to critical, P1. EPSS with a score of 0.62 against the default threshold 0.5, config.exploitability.epss, raises it one level to critical, P1. Malicious, config.dependencyHealth.enabled, raises it to critical, P1. Deprecated, the same key, raises it one level to critical, P1. Unreachable, config.reachability.analyzers, lowers it one level to medium; C2 puts medium in P2, so the band holds. KEV and EPSS apply in run phase 2, as the finding is ranked; the others in phase 3, once every scanner has finished.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.k{font-size:12px}.h{font-size:13px}.b{font-weight:700}.c{text-anchor:middle}
      .sev{fill:#12161B;stroke:#9AA4AE;stroke-width:1.5}
      .up{stroke:#E9635B;stroke-width:2;fill:none}
      .dn{stroke:#7CA6B8;stroke-width:2;fill:none;stroke-dasharray:6 4}
      .g{stroke:#232A31;stroke-width:1}
      .tu{fill:#E9635B}.td{fill:#7CA6B8}
    </style>
    <symbol id="c1" viewBox="0 0 44 26" width="44" height="26"><rect width="44" height="26" rx="5" fill="#E5534B"/><text x="22" y="18" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 44 26" width="44" height="26"><rect width="44" height="26" rx="5" fill="#E8B84B"/><text x="22" y="18" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#16110A">P2</text></symbol>
    <marker id="u" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E9635B"/></marker>
    <marker id="d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7CA6B8"/></marker>
  </defs>
  <rect width="720" height="470" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">SIGNALS · EACH ONE ON THE LEDGER CVE</text>
  <text class="sm mu" x="20" y="60">signal · turned on by</text>
  <text class="sm mu" x="330" y="60">severity</text>
  <text class="sm mu" x="580" y="60">band on C2</text>
  <path class="g" d="M20 70H700"/>

  <text class="m b" x="20" y="96">none</text>
  <text class="sm mu" x="20" y="114">nothing configured</text>
  <rect class="sev" x="330" y="86" width="74" height="26" rx="5"/><text class="m h c" x="367" y="104">high</text>
  <use href="#c2" x="580" y="86"/>
  <path class="g" d="M20 128H700"/>

  <text class="m b" x="20" y="154"><tspan class="tu">↑</tspan> KEV</text>
  <text class="m k mu" x="20" y="172">config.exploitability.kev</text>
  <rect class="sev" x="330" y="144" width="74" height="26" rx="5"/><text class="m h c" x="367" y="162">high</text>
  <path class="up" d="M408 157H444" marker-end="url(#u)"/>
  <rect class="sev" x="450" y="144" width="84" height="26" rx="5" style="stroke:#E6E8EA;stroke-width:2"/><text class="m h b c" x="492" y="162">critical</text>
  <use href="#c1" x="580" y="144"/>
  <path class="g" d="M20 186H700"/>

  <text class="m b" x="20" y="212"><tspan class="tu">↑</tspan> EPSS 0.62</text>
  <text class="m k mu" x="20" y="230">config.exploitability.epss</text>
  <rect class="sev" x="330" y="202" width="74" height="26" rx="5"/><text class="m h c" x="367" y="220">high</text>
  <path class="up" d="M408 215H444" marker-end="url(#u)"/>
  <rect class="sev" x="450" y="202" width="84" height="26" rx="5" style="stroke:#E6E8EA;stroke-width:2"/><text class="m h b c" x="492" y="220">critical</text>
  <use href="#c1" x="580" y="202"/>
  <path class="g" d="M20 244H700"/>

  <text class="m b" x="20" y="270"><tspan class="tu">↑</tspan> malicious</text>
  <text class="m k mu" x="20" y="288">config.dependencyHealth.enabled</text>
  <rect class="sev" x="330" y="260" width="74" height="26" rx="5"/><text class="m h c" x="367" y="278">high</text>
  <path class="up" d="M408 273H444" marker-end="url(#u)"/>
  <rect class="sev" x="450" y="260" width="84" height="26" rx="5" style="stroke:#E6E8EA;stroke-width:2"/><text class="m h b c" x="492" y="278">critical</text>
  <use href="#c1" x="580" y="260"/>
  <path class="g" d="M20 302H700"/>

  <text class="m b" x="20" y="328"><tspan class="tu">↑</tspan> deprecated</text>
  <text class="m k mu" x="20" y="346">config.dependencyHealth.enabled</text>
  <rect class="sev" x="330" y="318" width="74" height="26" rx="5"/><text class="m h c" x="367" y="336">high</text>
  <path class="up" d="M408 331H444" marker-end="url(#u)"/>
  <rect class="sev" x="450" y="318" width="84" height="26" rx="5" style="stroke:#E6E8EA;stroke-width:2"/><text class="m h b c" x="492" y="336">critical</text>
  <use href="#c1" x="580" y="318"/>
  <path class="g" d="M20 360H700"/>

  <text class="m b" x="20" y="386"><tspan class="td">↓</tspan> unreachable</text>
  <text class="m k mu" x="20" y="404">config.reachability.analyzers</text>
  <rect class="sev" x="330" y="376" width="74" height="26" rx="5"/><text class="m h c" x="367" y="394">high</text>
  <path class="dn" d="M408 389H444" marker-end="url(#d)"/>
  <rect class="sev" x="450" y="376" width="84" height="26" rx="5"/><text class="m h c" x="492" y="394">medium</text>
  <use href="#c2" x="580" y="376"/>
  <text class="sm mu" x="634" y="394">holds</text>
  <path class="g" d="M20 418H700"/>
  <text class="sm mu" x="20" y="440">KEV and EPSS apply in phase 2, as it is ranked; the others in phase 3, after every</text>
  <text class="sm mu" x="20" y="458">scanner. Off the catalog, below 0.5 or unflagged, the CVE stays high, P2.</text>
</svg>
