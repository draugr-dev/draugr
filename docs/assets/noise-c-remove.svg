<svg viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="The ledger CVE under each removal lever: correlation makes two copies one row, an exclusion or a VEX statement marks it and keeps it, an action folds it into one upgrade, and an unreachable verdict keeps it in the count." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that remove, on the ledger CVE</title>
  <desc>Correlation, always on in run phase 4: the ledger CVE reported by trivy-fs and by grype-fs becomes one row naming grype-fs. config.exclude, phase 4: accepted with a reason and an expiry, it stays in the report marked accepted and leaves the count and the gate. VEX, phase 4: the module's supplier states it does not affect their product, and it stays marked VEX. Actions, at report time with --view actions: the ledger CVE and two more CVEs in the same module become one upgrade that clears three, at P2. Scanner exclusions and builtBy or operatedBy do not reach it: it carries no directive, and ledger is built by you. An unreachable verdict is not a removal: the ledger CVE stays in the count at P2, marked unreachable.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:11.5px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:10.5px}.t{font-size:12px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tag{fill:none;stroke:#7CA6B8;stroke-width:1.2;stroke-dasharray:4 3}
      .tg{fill:#7CA6B8}.td{fill:#7CA6B8}
    </style>
    <symbol id="c2" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E8B84B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#16110A">P2</text></symbol>
    <symbol id="c3" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#7CA6B8"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0A1116">P3</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="900" height="420" rx="12" fill="#0B0E11"/>
  <text class="e" x="24" y="32">LEVERS THAT REMOVE · THE LEDGER CVE, P2</text>

  <g transform="translate(16 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">correlation</text>
    <text class="m sm mu" x="12" y="38">always on · phase 4</text>
    <use href="#c2" x="12" y="66"/><text class="b" x="42" y="78">ledger CVE</text>
    <text class="sm mu" x="42" y="92">trivy-fs</text>
    <use href="#c2" x="12" y="102"/><text class="b" x="42" y="114">ledger CVE</text>
    <text class="sm mu" x="42" y="128">grype-fs</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c2" x="154" y="84"/><text class="b" x="184" y="96">ledger CVE</text>
    <text class="sm mu" x="184" y="110">also grype-fs</text>
    <text class="sm mu" x="12" y="160">One flaw, one row, naming the other scanner.</text>
  </g>

  <g transform="translate(310 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">config.exclude</text>
    <text class="m sm mu" x="12" y="38">reason · expiry · phase 4</text>
    <use href="#c2" x="12" y="92"/><text class="b" x="42" y="104">ledger CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c2" x="154" y="84"/><text class="b" x="184" y="96">ledger CVE</text></g>
    <rect class="tag" x="184" y="102" width="62" height="17" rx="4"/><text class="sm tg" x="191" y="114">accepted</text>
    <text class="sm mu" x="12" y="146">Kept and marked; out of counts and gate.</text>
    <text class="sm mu" x="12" y="160">The line's git history names who.</text>
  </g>

  <g transform="translate(604 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">VEX</text>
    <text class="m sm mu" x="12" y="38">config.vexSources · phase 4</text>
    <use href="#c2" x="12" y="92"/><text class="b" x="42" y="104">ledger CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c2" x="154" y="84"/><text class="b" x="184" y="96">ledger CVE</text></g>
    <rect class="tag" x="184" y="102" width="36" height="17" rx="4"/><text class="sm tg" x="191" y="114">VEX</text>
    <text class="sm mu" x="12" y="146">The module's supplier states it does not</text>
    <text class="sm mu" x="12" y="160">affect their product; the author can be asked.</text>
  </g>

  <g transform="translate(16 232)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">actions</text>
    <text class="m sm mu" x="12" y="38">--view actions · report</text>
    <use href="#c2" x="12" y="72"/><text class="b" x="42" y="84">ledger CVE</text>
    <use href="#c3" x="12" y="92"/><text x="42" y="104">module CVE</text>
    <use href="#c3" x="12" y="112"/><text x="42" y="124">module CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c2" x="154" y="84"/><text x="184" y="96">upgrade module</text>
    <text class="sm mu" x="184" y="110">clears 3</text>
    <text class="sm mu" x="12" y="146">One row per thing to do, at the highest</text>
    <text class="sm mu" x="12" y="160">band among what it clears.</text>
  </g>

  <g transform="translate(310 232)">
    <rect class="pan" width="280" height="172" rx="10" stroke-dasharray="4 4"/>
    <text class="m b t" x="12" y="22">not on the ledger CVE</text>
    <text class="m sm" x="12" y="50">scanner exclusions</text>
    <text class="sm mu" x="12" y="66">a directive in the code or a rule in the</text>
    <text class="sm mu" x="12" y="80">scanner's config; the CVE carries none</text>
    <text class="m sm" x="12" y="108">builtBy · operatedBy</text>
    <text class="sm mu" x="12" y="124">an image or cluster somebody else runs;</text>
    <text class="sm mu" x="12" y="138">ledger is built by you</text>
  </g>

  <g transform="translate(604 232)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">↓ unreachable is not removal</text>
    <text class="m sm mu" x="12" y="38">config.reachability · phase 3</text>
    <use href="#c2" x="12" y="92"/><text class="b" x="42" y="104">ledger CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c2" x="154" y="84"/><text class="b" x="184" y="96">ledger CVE</text>
    <text class="m sm" x="184" y="112"><tspan class="td">↓</tspan> unreachable</text>
    <text class="sm mu" x="12" y="146">Still counted, one severity lower; only a</text>
    <text class="sm mu" x="12" y="160">person's decision suppresses.</text>
  </g>
</svg>
