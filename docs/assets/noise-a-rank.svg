<svg viewBox="0 0 900 452" width="900" height="452" role="img" aria-label="Four levers that act on the band, each shown as a list of five findings before and after it is pulled." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that rank, before and after</title>
  <desc>One list of five findings: the ledger CVE, a leaked token, a web XSS, an admin SAST finding and a reports CVE. Declaring exposure and criticality: before, every component reads as public and critical, so the list is P1 ledger CVE, P1 leaked token, P2 web XSS, P2 admin SAST, P3 reports CVE; after, it is P1 leaked token marked floor, P2 ledger CVE, P2 web XSS, P3 admin SAST, P4 reports CVE. Turning on KEV with config.exploitability.kev: the ledger CVE is on the catalog and rises from P2 to P1, marked KEV. --min-priority P2: the listing keeps the three findings at P1 and P2 and leaves out the other two, and the counts still describe all five. --fail-on: at the default P1 the two P1 findings fail the run; at P2 the web XSS fails it too.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:12px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:11px}.t{font-size:12.5px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tu{fill:#E9635B}
      .cut{stroke:#E6E8EA;stroke-width:2}
    </style>
    <symbol id="c1" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E5534B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E8B84B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#16110A">P2</text></symbol>
    <symbol id="c3" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#7CA6B8"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0A1116">P3</text></symbol>
    <symbol id="c4" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#6B7680"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#FFFFFF">P4</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="900" height="452" rx="12" fill="#0B0E11"/>
  <text class="e" x="24" y="32">LEVERS THAT RANK · THE SAME FIVE FINDINGS</text>

  <g transform="translate(16 48)">
    <rect class="pan" width="426" height="190" rx="10"/>
    <text class="m b t" x="14" y="24">declare exposure and criticality</text>
    <text class="m sm mu" x="14" y="41">components[].exposure · .criticality</text>
    <text class="sm mu" x="14" y="64">unclassified</text><text class="sm mu" x="232" y="64">declared</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">ledger CVE</text>
    <use href="#c1" x="14" y="92"/><text x="46" y="104">leaked token</text>
    <use href="#c2" x="14" y="112"/><text x="46" y="124">web XSS</text>
    <use href="#c2" x="14" y="132"/><text x="46" y="144">admin SAST</text>
    <use href="#c3" x="14" y="152"/><text x="46" y="164">reports CVE</text>
    <path class="ar" d="M190 120H220" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token <tspan class="m sm"><tspan class="tu">↑</tspan> floor</tspan></text>
    <use href="#c2" x="232" y="92"/><text x="264" y="104">ledger CVE</text>
    <use href="#c2" x="232" y="112"/><text x="264" y="124">web XSS</text>
    <use href="#c3" x="232" y="132"/><text x="264" y="144">admin SAST</text>
    <use href="#c4" x="232" y="152"/><text x="264" y="164">reports CVE</text>
    <text class="sm mu" x="14" y="182">Unclassified reads as public and critical, tier C1. Applied at ranking.</text>
  </g>

  <g transform="translate(458 48)">
    <rect class="pan" width="426" height="190" rx="10"/>
    <text class="m b t" x="14" y="24">turn on a signal</text>
    <text class="m sm mu" x="14" y="41">config.exploitability.kev</text>
    <text class="sm mu" x="14" y="64">off</text><text class="sm mu" x="232" y="64">on, the ledger CVE listed</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">leaked token</text>
    <use href="#c2" x="14" y="92"/><text x="46" y="104">ledger CVE</text>
    <use href="#c2" x="14" y="112"/><text x="46" y="124">web XSS</text>
    <use href="#c3" x="14" y="132"/><text x="46" y="144">admin SAST</text>
    <use href="#c4" x="14" y="152"/><text x="46" y="164">reports CVE</text>
    <path class="ar" d="M190 120H220" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token</text>
    <use href="#c1" x="232" y="92"/><text x="264" y="104">ledger CVE <tspan class="m sm"><tspan class="tu">↑</tspan> KEV</tspan></text>
    <use href="#c2" x="232" y="112"/><text x="264" y="124">web XSS</text>
    <use href="#c3" x="232" y="132"/><text x="264" y="144">admin SAST</text>
    <use href="#c4" x="232" y="152"/><text x="264" y="164">reports CVE</text>
    <text class="sm mu" x="14" y="182">Feeds read at the start of the run; the raise lands as the finding is ranked.</text>
  </g>

  <g transform="translate(16 250)">
    <rect class="pan" width="426" height="190" rx="10"/>
    <text class="m b t" x="14" y="24">--min-priority P2</text>
    <text class="m sm mu" x="14" y="41">scan flag · the run is unchanged</text>
    <text class="sm mu" x="14" y="64">every band</text><text class="sm mu" x="232" y="64">P2 and above</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">leaked token</text>
    <use href="#c1" x="14" y="92"/><text x="46" y="104">ledger CVE</text>
    <use href="#c2" x="14" y="112"/><text x="46" y="124">web XSS</text>
    <use href="#c3" x="14" y="132"/><text x="46" y="144">admin SAST</text>
    <use href="#c4" x="14" y="152"/><text x="46" y="164">reports CVE</text>
    <path class="ar" d="M190 120H220" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token</text>
    <use href="#c1" x="232" y="92"/><text x="264" y="104">ledger CVE</text>
    <use href="#c2" x="232" y="112"/><text x="264" y="124">web XSS</text>
    <text class="sm mu" x="232" y="144">2 not listed</text>
    <text class="sm mu" x="14" y="182">Narrows the listing at report time. Counts and the gate still read all five.</text>
  </g>

  <g transform="translate(458 250)">
    <rect class="pan" width="426" height="190" rx="10"/>
    <text class="m b t" x="14" y="24">--fail-on</text>
    <text class="m sm mu" x="14" y="41">config.gate.failOn · default P1</text>
    <text class="sm mu" x="14" y="64">P1</text><text class="sm mu" x="232" y="64">P2</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">leaked token</text>
    <use href="#c1" x="14" y="92"/><text x="46" y="104">ledger CVE</text>
    <path class="cut" d="M14 110.5H102"/><text class="m sm" x="107" y="114">fails above</text>
    <use href="#c2" x="14" y="114"/><text x="46" y="126">web XSS</text>
    <use href="#c3" x="14" y="134"/><text x="46" y="146">admin SAST</text>
    <use href="#c4" x="14" y="154"/><text x="46" y="166">reports CVE</text>
    <path class="ar" d="M190 120H220" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token</text>
    <use href="#c1" x="232" y="92"/><text x="264" y="104">ledger CVE</text>
    <use href="#c2" x="232" y="112"/><text x="264" y="124">web XSS</text>
    <path class="cut" d="M232 130.5H312"/><text class="m sm" x="317" y="134">fails above</text>
    <use href="#c3" x="232" y="134"/><text x="264" y="146">admin SAST</text>
    <use href="#c4" x="232" y="154"/><text x="264" y="166">reports CVE</text>
    <text class="sm mu" x="14" y="182">Read after ranking, before the report. Everything above the line fails the run.</text>
  </g>
</svg>
