<svg viewBox="0 0 720 770" width="720" height="770" role="img" aria-label="Four levers that act on the band, each shown as a list of five findings before and after it is pulled, with the state of KEV labeled on every list." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that rank, before and after</title>
  <desc>One list of five findings: the ledger CVE, a leaked token, a web XSS, an admin SAST finding and a reports CVE. Declaring exposure and criticality, KEV off: before, every component reads as public and critical, so the list is P1 ledger CVE, P1 leaked token, P2 web XSS, P2 admin SAST, P3 reports CVE; after, it is P1 leaked token marked floor, P2 ledger CVE, P2 web XSS, P3 admin SAST, P4 reports CVE. Turning on KEV with config.exploitability.kev: the ledger CVE is on the catalog and rises from P2 to P1, marked KEV. With KEV on, --min-priority P2 lists the three findings at P1 and P2 and leaves out two, and the counts still describe all five. With KEV on, --fail-on P1 fails the run on the leaked token and the ledger CVE; --fail-on P2 also fails it on the web XSS.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.k{font-size:12px}.t{font-size:14px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tu{fill:#E9635B}
      .cut{stroke:#E6E8EA;stroke-width:2}
    </style>
    <symbol id="c1" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E5534B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E8B84B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#16110A">P2</text></symbol>
    <symbol id="c3" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#7CA6B8"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#0A1116">P3</text></symbol>
    <symbol id="c4" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#6B7680"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#FFFFFF">P4</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="720" height="770" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">LEVERS THAT RANK · THE SAME FIVE FINDINGS</text>

  <g transform="translate(12 44)">
    <rect class="pan" width="696" height="170" rx="10"/>
    <text class="m b t" x="14" y="28">declare</text>
    <text class="m k mu" x="14" y="48">exposure, criticality</text>
    <text class="sm mu" x="14" y="78">Unclassified reads as</text>
    <text class="sm mu" x="14" y="96">public and critical, C1.</text>
    <text class="sm mu" x="14" y="114">Applied at ranking.</text>
    <text class="sm mu" x="228" y="24">unclassified, KEV off</text><text class="sm mu" x="448" y="24">declared, KEV off</text>
    <use href="#c1" x="228" y="34"/><text x="268" y="48">ledger CVE</text>
    <use href="#c1" x="228" y="58"/><text x="268" y="72">leaked token</text>
    <use href="#c2" x="228" y="82"/><text x="268" y="96">web XSS</text>
    <use href="#c2" x="228" y="106"/><text x="268" y="120">admin SAST</text>
    <use href="#c3" x="228" y="130"/><text x="268" y="144">reports CVE</text>
    <path class="ar" d="M404 90H436" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="34"/><text x="488" y="48">leaked token <tspan class="m sm"><tspan class="tu">↑</tspan> floor</tspan></text>
    <use href="#c2" x="448" y="58"/><text x="488" y="72">ledger CVE</text>
    <use href="#c2" x="448" y="82"/><text x="488" y="96">web XSS</text>
    <use href="#c3" x="448" y="106"/><text x="488" y="120">admin SAST</text>
    <use href="#c4" x="448" y="130"/><text x="488" y="144">reports CVE</text>
  </g>

  <g transform="translate(12 224)">
    <rect class="pan" width="696" height="170" rx="10"/>
    <text class="m b t" x="14" y="28">turn on a signal</text>
    <text class="m k mu" x="14" y="48">exploitability.kev</text>
    <text class="sm mu" x="14" y="78">The ledger CVE is on the</text>
    <text class="sm mu" x="14" y="96">catalog. The feed loads</text>
    <text class="sm mu" x="14" y="114">at the start; the raise</text>
    <text class="sm mu" x="14" y="132">lands at ranking.</text>
    <text class="sm mu" x="228" y="24">KEV off</text><text class="sm mu" x="448" y="24">KEV on</text>
    <use href="#c1" x="228" y="34"/><text x="268" y="48">leaked token</text>
    <use href="#c2" x="228" y="58"/><text x="268" y="72">ledger CVE</text>
    <use href="#c2" x="228" y="82"/><text x="268" y="96">web XSS</text>
    <use href="#c3" x="228" y="106"/><text x="268" y="120">admin SAST</text>
    <use href="#c4" x="228" y="130"/><text x="268" y="144">reports CVE</text>
    <path class="ar" d="M404 90H436" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="34"/><text x="488" y="48">leaked token</text>
    <use href="#c1" x="448" y="58"/><text x="488" y="72">ledger CVE <tspan class="m sm"><tspan class="tu">↑</tspan> KEV</tspan></text>
    <use href="#c2" x="448" y="82"/><text x="488" y="96">web XSS</text>
    <use href="#c3" x="448" y="106"/><text x="488" y="120">admin SAST</text>
    <use href="#c4" x="448" y="130"/><text x="488" y="144">reports CVE</text>
  </g>

  <g transform="translate(12 404)">
    <rect class="pan" width="696" height="170" rx="10"/>
    <text class="m b t" x="14" y="28">--min-priority P2</text>
    <text class="m k mu" x="14" y="48">scan flag</text>
    <text class="sm mu" x="14" y="78">Narrows the listing at</text>
    <text class="sm mu" x="14" y="96">report time. Counts and</text>
    <text class="sm mu" x="14" y="114">the gate still read all</text>
    <text class="sm mu" x="14" y="132">five findings.</text>
    <text class="sm mu" x="228" y="24">KEV on, every band</text><text class="sm mu" x="448" y="24">KEV on, P2 and above</text>
    <use href="#c1" x="228" y="34"/><text x="268" y="48">leaked token</text>
    <use href="#c1" x="228" y="58"/><text x="268" y="72">ledger CVE</text>
    <use href="#c2" x="228" y="82"/><text x="268" y="96">web XSS</text>
    <use href="#c3" x="228" y="106"/><text x="268" y="120">admin SAST</text>
    <use href="#c4" x="228" y="130"/><text x="268" y="144">reports CVE</text>
    <path class="ar" d="M404 90H436" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="34"/><text x="488" y="48">leaked token</text>
    <use href="#c1" x="448" y="58"/><text x="488" y="72">ledger CVE</text>
    <use href="#c2" x="448" y="82"/><text x="488" y="96">web XSS</text>
    <text class="sm mu" x="448" y="120">2 not listed</text>
  </g>

  <g transform="translate(12 584)">
    <rect class="pan" width="696" height="174" rx="10"/>
    <text class="m b t" x="14" y="28">--fail-on</text>
    <text class="m k mu" x="14" y="48">config.gate.failOn</text>
    <text class="sm mu" x="14" y="78">Read after ranking.</text>
    <text class="sm mu" x="14" y="96">Rows above the line</text>
    <text class="sm mu" x="14" y="114">fail the run. P1 is the</text>
    <text class="sm mu" x="14" y="132">default.</text>
    <text class="sm mu" x="228" y="24">KEV on, P1</text><text class="sm mu" x="448" y="24">KEV on, P2</text>
    <use href="#c1" x="228" y="34"/><text x="268" y="48">leaked token</text>
    <use href="#c1" x="228" y="58"/><text x="268" y="72">ledger CVE</text>
    <path class="cut" d="M228 87H356"/><text class="m sm" x="362" y="91">fail ↑</text>
    <use href="#c2" x="228" y="96"/><text x="268" y="110">web XSS</text>
    <use href="#c3" x="228" y="120"/><text x="268" y="134">admin SAST</text>
    <use href="#c4" x="228" y="144"/><text x="268" y="158">reports CVE</text>
    <path class="ar" d="M404 134H436" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="34"/><text x="488" y="48">leaked token</text>
    <use href="#c1" x="448" y="58"/><text x="488" y="72">ledger CVE</text>
    <use href="#c2" x="448" y="82"/><text x="488" y="96">web XSS</text>
    <path class="cut" d="M448 111H576"/><text class="m sm" x="582" y="115">fail ↑</text>
    <use href="#c3" x="448" y="120"/><text x="488" y="134">admin SAST</text>
    <use href="#c4" x="448" y="144"/><text x="488" y="158">reports CVE</text>
  </g>
</svg>
