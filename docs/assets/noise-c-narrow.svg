<svg viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="The ledger CVE under four narrowing levers: --top 2 still lists it, --view compact puts it on one line, --components ledger keeps it, and draugr diff leaves it out because it is not new." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that narrow, on the ledger CVE</title>
  <desc>Three findings: a leaked token and the ledger CVE on ledger, and a web XSS on web, with the ledger CVE outlined. --top 2, at report time: the leaked token and the ledger CVE are listed and one finding is not. --view compact: the ledger CVE takes one line instead of two. --components ledger, at the start of the run: only ledger is scanned, so the leaked token and the ledger CVE are found and web is not scanned. draugr diff against the report from before a change: the ledger CVE was already there, so only the new api CVE is shown.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:12px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:11px}.xs{font-size:10px}.t{font-size:12.5px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .hl{fill:none;stroke:#E6E8EA;stroke-width:1.2}
      .tag{fill:none;stroke:#E8B84B;stroke-width:1.2}
      .tg{fill:#E8B84B}
    </style>
    <symbol id="c1" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E5534B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E8B84B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#16110A">P2</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="900" height="380" rx="12" fill="#0B0E11"/>
  <text class="e" x="24" y="32">LEVERS THAT NARROW · THE LEDGER CVE OUTLINED</text>

  <g transform="translate(16 48)">
    <rect class="pan" width="426" height="152" rx="10"/>
    <text class="m b t" x="14" y="24">--top 2</text>
    <text class="m sm mu" x="14" y="41">scan flag · default 10 · report</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">leaked token</text>
    <rect class="hl" x="8" y="89" width="160" height="21" rx="4"/>
    <use href="#c2" x="14" y="92"/><text class="b" x="46" y="104">ledger CVE</text>
    <use href="#c2" x="14" y="112"/><text x="46" y="124">web XSS</text>
    <path class="ar" d="M184 100H218" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token</text>
    <rect class="hl" x="226" y="89" width="160" height="21" rx="4"/>
    <use href="#c2" x="232" y="92"/><text class="b" x="264" y="104">ledger CVE</text>
    <text class="sm mu" x="232" y="124">1 not listed</text>
    <text class="sm mu" x="14" y="144">The first rows in band order. --top 0 lists every row.</text>
  </g>

  <g transform="translate(458 48)">
    <rect class="pan" width="426" height="152" rx="10"/>
    <text class="m b t" x="14" y="24">--view compact</text>
    <text class="m sm mu" x="14" y="41">scan flag · report</text>
    <rect class="hl" x="8" y="68" width="170" height="36" rx="4"/>
    <use href="#c2" x="14" y="72"/><text class="b" x="46" y="84">ledger CVE</text>
    <text class="xs mu" x="46" y="98">scanner · location · fix</text>
    <use href="#c2" x="14" y="110"/><text x="46" y="122">web XSS</text>
    <text class="xs mu" x="46" y="136">scanner · location · fix</text>
    <path class="ar" d="M184 100H218" marker-end="url(#h)"/>
    <rect class="hl" x="226" y="83" width="160" height="21" rx="4"/>
    <use href="#c2" x="232" y="86"/><text class="b" x="264" y="98">ledger CVE</text>
    <use href="#c2" x="232" y="108"/><text x="264" y="120">web XSS</text>
    <text class="sm mu" x="226" y="144">One line each.</text>
  </g>

  <g transform="translate(16 212)">
    <rect class="pan" width="426" height="152" rx="10"/>
    <text class="m b t" x="14" y="24">--components ledger</text>
    <text class="m sm mu" x="14" y="41">also --controls · --exposure · --labels · start</text>
    <use href="#c1" x="14" y="72"/><text x="46" y="84">leaked token</text><text class="xs mu" x="140" y="84">ledger</text>
    <rect class="hl" x="8" y="89" width="174" height="21" rx="4"/>
    <use href="#c2" x="14" y="92"/><text class="b" x="46" y="104">ledger CVE</text><text class="xs mu" x="140" y="104">ledger</text>
    <use href="#c2" x="14" y="112"/><text x="46" y="124">web XSS</text><text class="xs mu" x="140" y="124">web</text>
    <path class="ar" d="M190 100H220" marker-end="url(#h)"/>
    <use href="#c1" x="232" y="72"/><text x="264" y="84">leaked token</text>
    <rect class="hl" x="226" y="89" width="160" height="21" rx="4"/>
    <use href="#c2" x="232" y="92"/><text class="b" x="264" y="104">ledger CVE</text>
    <text class="sm mu" x="232" y="124">web not scanned</text>
    <text class="sm mu" x="14" y="144">Scans one part of the application; the rest is not run.</text>
  </g>

  <g transform="translate(458 212)">
    <rect class="pan" width="426" height="152" rx="10"/>
    <text class="m b t" x="14" y="24">draugr diff</text>
    <text class="m sm mu" x="14" y="41">against the report from before a change</text>
    <use href="#c1" x="14" y="64"/><text x="46" y="76">leaked token</text>
    <rect class="hl" x="8" y="81" width="160" height="21" rx="4"/>
    <use href="#c2" x="14" y="84"/><text class="b" x="46" y="96">ledger CVE</text>
    <use href="#c2" x="14" y="104"/><text x="46" y="116">web XSS</text>
    <use href="#c2" x="14" y="124"/><text x="46" y="136">api CVE</text>
    <rect class="tag" x="102" y="124" width="32" height="15" rx="3"/><text class="xs tg" x="108" y="135">new</text>
    <path class="ar" d="M184 100H218" marker-end="url(#h)"/>
    <use href="#c2" x="232" y="92"/><text x="264" y="104">api CVE</text>
    <rect class="tag" x="320" y="92" width="32" height="15" rx="3"/><text class="xs tg" x="326" y="103">new</text>
    <text class="sm mu" x="232" y="124">ledger CVE not listed: not new</text>
  </g>
</svg>
