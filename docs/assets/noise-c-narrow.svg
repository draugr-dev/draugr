<svg viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="The ledger CVE under four narrowing levers: --top 2 still lists it, --view compact puts it on one line, --components ledger keeps it, and draugr diff leaves it out because it is not new." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that narrow, on the ledger CVE</title>
  <desc>KEV off in every list. Three findings: a leaked token and the ledger CVE on ledger, and a web XSS on web, with the ledger CVE outlined. --top 2, at report time: the leaked token and the ledger CVE are listed and one finding is not. --view compact: the ledger CVE takes one line instead of two. --components ledger, at the start of the run: only ledger is scanned, so the leaked token and the ledger CVE are found and web is not scanned. draugr diff against the report from before a change: the ledger CVE was already there, so only the new api CVE is shown.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.k{font-size:12px}.t{font-size:14px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .hl{fill:none;stroke:#E6E8EA;stroke-width:1.2}
      .tag{fill:none;stroke:#E8B84B;stroke-width:1.2}
      .tg{fill:#E8B84B}
    </style>
    <symbol id="c1" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E5534B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E8B84B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#16110A">P2</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="720" height="620" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">LEVERS THAT NARROW · THE LEDGER CVE OUTLINED, KEV OFF</text>

  <g transform="translate(12 44)">
    <rect class="pan" width="696" height="128" rx="10"/>
    <text class="m b t" x="14" y="28">--top 2</text>
    <text class="m k mu" x="14" y="48">default 10 · report</text>
    <text class="sm mu" x="14" y="78">The first rows in band</text>
    <text class="sm mu" x="14" y="96">order; --top 0 lists all.</text>
    <text class="sm mu" x="228" y="24">every row</text><text class="sm mu" x="448" y="24">first 2</text>
    <use href="#c1" x="228" y="38"/><text x="268" y="52">leaked token</text>
    <rect class="hl" x="222" y="59" width="150" height="25" rx="4"/>
    <use href="#c2" x="228" y="62"/><text class="b" x="268" y="76">ledger CVE</text>
    <use href="#c2" x="228" y="88"/><text x="268" y="102">web XSS</text>
    <path class="ar" d="M396 72H432" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="38"/><text x="488" y="52">leaked token</text>
    <rect class="hl" x="442" y="59" width="150" height="25" rx="4"/>
    <use href="#c2" x="448" y="62"/><text class="b" x="488" y="76">ledger CVE</text>
    <text class="sm mu" x="448" y="102">1 not listed</text>
  </g>

  <g transform="translate(12 182)">
    <rect class="pan" width="696" height="128" rx="10"/>
    <text class="m b t" x="14" y="28">--view compact</text>
    <text class="m k mu" x="14" y="48">report</text>
    <text class="sm mu" x="14" y="78">One line each.</text>
    <text class="sm mu" x="228" y="24">findings view</text><text class="sm mu" x="448" y="24">compact</text>
    <rect class="hl" x="222" y="35" width="176" height="44" rx="4"/>
    <use href="#c2" x="228" y="40"/><text class="b" x="268" y="54">ledger CVE</text>
    <text class="sm mu" x="268" y="72">scanner · location · fix</text>
    <use href="#c2" x="228" y="88"/><text x="268" y="102">web XSS</text>
    <text class="sm mu" x="268" y="120">scanner · location · fix</text>
    <path class="ar" d="M406 72H432" marker-end="url(#h)"/>
    <rect class="hl" x="442" y="49" width="150" height="25" rx="4"/>
    <use href="#c2" x="448" y="52"/><text class="b" x="488" y="66">ledger CVE</text>
    <use href="#c2" x="448" y="78"/><text x="488" y="92">web XSS</text>
  </g>

  <g transform="translate(12 320)">
    <rect class="pan" width="696" height="128" rx="10"/>
    <text class="m b t" x="14" y="28">--components</text>
    <text class="m k mu" x="14" y="48">also --controls, --labels</text>
    <text class="sm mu" x="14" y="78">Applied at the start; the</text>
    <text class="sm mu" x="14" y="96">rest is not run.</text>
    <text class="sm mu" x="228" y="24">ledger and web</text><text class="sm mu" x="448" y="24">--components ledger</text>
    <use href="#c1" x="228" y="38"/><text x="268" y="52">leaked token</text>
    <rect class="hl" x="222" y="59" width="150" height="25" rx="4"/>
    <use href="#c2" x="228" y="62"/><text class="b" x="268" y="76">ledger CVE</text>
    <use href="#c2" x="228" y="88"/><text x="268" y="102">web XSS</text>
    <path class="ar" d="M396 72H432" marker-end="url(#h)"/>
    <use href="#c1" x="448" y="38"/><text x="488" y="52">leaked token</text>
    <rect class="hl" x="442" y="59" width="150" height="25" rx="4"/>
    <use href="#c2" x="448" y="62"/><text class="b" x="488" y="76">ledger CVE</text>
    <text class="sm mu" x="448" y="102">web not scanned</text>
  </g>

  <g transform="translate(12 458)">
    <rect class="pan" width="696" height="150" rx="10"/>
    <text class="m b t" x="14" y="28">draugr diff</text>
    <text class="m k mu" x="14" y="48">after the run</text>
    <text class="sm mu" x="14" y="78">Against the report from</text>
    <text class="sm mu" x="14" y="96">before a change.</text>
    <text class="sm mu" x="228" y="24">this run</text><text class="sm mu" x="448" y="24">new since the earlier report</text>
    <use href="#c1" x="228" y="38"/><text x="268" y="52">leaked token</text>
    <rect class="hl" x="222" y="59" width="150" height="25" rx="4"/>
    <use href="#c2" x="228" y="62"/><text class="b" x="268" y="76">ledger CVE</text>
    <use href="#c2" x="228" y="88"/><text x="268" y="102">web XSS</text>
    <use href="#c2" x="228" y="114"/><text x="268" y="128">api CVE</text>
    <rect class="tag" x="332" y="114" width="38" height="19" rx="3"/><text class="m k tg" x="338" y="128">new</text>
    <path class="ar" d="M396 100H432" marker-end="url(#h)"/>
    <use href="#c2" x="448" y="62"/><text x="488" y="76">api CVE</text>
    <rect class="tag" x="552" y="62" width="38" height="19" rx="3"/><text class="m k tg" x="558" y="76">new</text>
    <text class="sm mu" x="448" y="102">the ledger CVE is not new</text>
  </g>
</svg>
