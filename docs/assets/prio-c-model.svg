<svg viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="The ledger CVE in four steps: the scanner rates it high, KEV raises it to critical, ledger's declaration gives tier C2, and C2 crossed with critical is P1." xmlns="http://www.w3.org/2000/svg">
  <title>The model, carried by one finding</title>
  <desc>The ledger CVE is a CVSS 7.5 flaw in a Go module the ledger component depends on. Step 1, rating: trivy-fs rates it high, in run phase 2. Step 2, signals: with config.exploitability.kev set and the CVE on the catalog, KEV raises it to critical, marked KEV, as it is ranked. Step 3, tier: ledger declares exposure internal and criticality critical, which step 1 of the matrices reads as tier C2. Step 4, band: step 2 of the matrices crosses C2 with critical into P1, which fails the default --fail-on P1 gate. The report shows P1, critical and the KEV mark; report.json keeps the scanner's rating, high, as escalation.from.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:13px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:11px}.b{font-weight:700}.c{text-anchor:middle}.big{font-size:16px}
      .scr{fill:#E9635B}.shi{fill:#E8B84B}
      .card{fill:#12161B;stroke:#2F3841;stroke-width:1.5}
      .cup{fill:#12161B;stroke:#E9635B;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tu{fill:#E9635B}
    </style>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="900" height="290" rx="12" fill="#0B0E11"/>
  <text class="e" x="24" y="30">THE LEDGER CVE · FROM RATING TO BAND</text>
  <text class="sm mu" x="24" y="50">CVSS 7.5 in a Go module · component ledger · exposure: internal · criticality: critical</text>

  <rect class="card" x="24" y="68" width="190" height="150" rx="10"/>
  <text class="e" x="40" y="92">1 · RATING</text>
  <rect x="40" y="106" width="96" height="34" rx="6" fill="#12161B" stroke="#E8B84B" stroke-width="2"/>
  <text class="m b c shi big" x="88" y="129">high</text>
  <text class="sm" x="40" y="164">CVSS 7.5, from trivy-fs</text>
  <text class="sm mu" x="40" y="184">phase 2 · scan</text>
  <text class="m sm mu" x="40" y="202">config.controls.sca</text>
  <path class="ar" d="M214 143H240" marker-end="url(#h)"/>

  <rect class="cup" x="244" y="68" width="190" height="150" rx="10"/>
  <text class="e" x="260" y="92">2 · SIGNALS</text>
  <rect x="260" y="106" width="96" height="34" rx="6" fill="#12161B" stroke="#E9635B" stroke-width="2"/>
  <text class="m b c scr big" x="308" y="129">critical</text>
  <text class="m b" x="366" y="129"><tspan class="tu">↑</tspan> KEV</text>
  <text class="sm" x="260" y="164">the CVE is on the catalog</text>
  <text class="sm mu" x="260" y="184">phase 2 · as it is ranked</text>
  <text class="m sm mu" x="260" y="202">config.exploitability.kev</text>
  <path class="ar" d="M434 143H460" marker-end="url(#h)"/>

  <rect class="card" x="464" y="68" width="190" height="150" rx="10"/>
  <text class="e" x="480" y="92">3 · TIER</text>
  <rect x="480" y="106" width="96" height="34" rx="6" fill="#2A333C"/>
  <text class="m b c big" x="528" y="129">C2</text>
  <text class="sm" x="480" y="164">internal × critical</text>
  <text class="sm mu" x="480" y="184">step 1 matrix · always</text>
  <text class="m sm mu" x="480" y="202">components[]</text>
  <path class="ar" d="M654 143H680" marker-end="url(#h)"/>

  <rect class="card" x="684" y="68" width="190" height="150" rx="10"/>
  <text class="e" x="700" y="92">4 · BAND</text>
  <rect x="700" y="106" width="96" height="34" rx="6" fill="#E5534B"/>
  <text class="m b c big" x="748" y="129" style="fill:#0B0E11">P1</text>
  <text class="sm" x="700" y="164">C2 × critical</text>
  <text class="sm mu" x="700" y="184">step 2 matrix · always</text>
  <text class="m sm mu" x="700" y="202">--fail-on P1: fails</text>

  <path d="M24 238H876" stroke="#232A31" stroke-width="1"/>
  <text class="e" x="24" y="266">KEPT</text>
  <text class="sm" x="90" y="266">The report shows P1, critical and the ↑ KEV mark. report.json keeps the scanner's rating, high, as escalation.from.</text>
</svg>
