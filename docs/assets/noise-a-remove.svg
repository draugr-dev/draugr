<svg viewBox="0 0 720 620" width="720" height="620" role="img" aria-label="Six levers that make the count smaller, each shown as findings before and after, with every removed finding kept and labeled." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that remove, before and after</title>
  <desc>Correlation, always on in run phase 4: the ledger CVE found by trivy-fs and by grype-fs is one row naming the other scanner. config.exclude, phase 4: the admin SAST finding, accepted with a reason and an expiry, stays in the report marked accepted and leaves the count and the gate. VEX, phase 4, from components[].vex or config.vexSources: the reports CVE, which the supplier states does not affect its product, stays marked VEX. Scanner exclusions arrive in phase 2: a finding the scanner set aside from a directive in the code or its own configuration is counted apart. Actions, at report time with --view actions: three CVEs in one module are one upgrade that clears three. builtBy: upstream on an image: its vulnerabilities become one action, take a newer image.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.k{font-size:12px}.t{font-size:14px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tag{fill:none;stroke:#7CA6B8;stroke-width:1.2;stroke-dasharray:4 3}
      .tg{fill:#7CA6B8}
    </style>
    <symbol id="c1" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E5534B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#E8B84B"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#16110A">P2</text></symbol>
    <symbol id="c3" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#7CA6B8"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#0A1116">P3</text></symbol>
    <symbol id="c4" viewBox="0 0 32 19" width="32" height="19"><rect width="32" height="19" rx="3" fill="#6B7680"/><text x="16" y="14" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="12" font-weight="700" fill="#FFFFFF">P4</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="720" height="620" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">LEVERS THAT REMOVE · NOTHING IS DELETED</text>

  <g transform="translate(12 44)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">correlation</text>
    <text class="m k mu" x="14" y="46">always on · phase 4</text>
    <use href="#c2" x="14" y="62"/><text x="54" y="76">ledger CVE</text>
    <text class="sm mu" x="54" y="94">trivy-fs</text>
    <use href="#c2" x="14" y="104"/><text x="54" y="118">ledger CVE</text>
    <text class="sm mu" x="54" y="136">grype-fs</text>
    <path class="ar" d="M144 100H170" marker-end="url(#h)"/>
    <use href="#c2" x="178" y="84"/><text x="218" y="98">ledger CVE</text>
    <text class="sm mu" x="218" y="116">also grype-fs</text>
    <text class="sm mu" x="14" y="164">One flaw, one row, naming the other scanner.</text>
  </g>

  <g transform="translate(368 44)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">config.exclude</text>
    <text class="m k mu" x="14" y="46">reason · expiry · phase 4</text>
    <use href="#c3" x="14" y="88"/><text x="54" y="102">admin SAST</text>
    <path class="ar" d="M144 98H170" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c3" x="178" y="78"/><text x="218" y="92">admin SAST</text></g>
    <rect class="tag" x="218" y="100" width="72" height="20" rx="4"/><text class="m k tg" x="226" y="115">accepted</text>
    <text class="sm mu" x="14" y="146">Kept and marked; out of counts and the gate.</text>
    <text class="sm mu" x="14" y="164">The line's git history names who.</text>
  </g>

  <g transform="translate(12 234)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">VEX</text>
    <text class="m k mu" x="14" y="46">components[].vex · phase 4</text>
    <use href="#c4" x="14" y="88"/><text x="54" y="102">reports CVE</text>
    <path class="ar" d="M144 98H170" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c4" x="178" y="78"/><text x="218" y="92">reports CVE</text></g>
    <rect class="tag" x="218" y="100" width="40" height="20" rx="4"/><text class="m k tg" x="226" y="115">VEX</text>
    <text class="sm mu" x="14" y="146">The supplier states it does not affect their</text>
    <text class="sm mu" x="14" y="164">product; its author can be asked.</text>
  </g>

  <g transform="translate(368 234)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">scanner exclusions</text>
    <text class="m k mu" x="14" y="46">directive or scanner config · phase 2</text>
    <use href="#c3" x="14" y="88"/><text x="54" y="102">sast finding</text>
    <path class="ar" d="M144 98H170" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c3" x="178" y="78"/><text x="218" y="92">sast finding</text></g>
    <rect class="tag" x="218" y="100" width="94" height="20" rx="4"/><text class="m k tg" x="226" y="115">by scanner</text>
    <text class="sm mu" x="14" y="146">Set aside before Draugr saw it; no author,</text>
    <text class="sm mu" x="14" y="164">no date. Counted apart.</text>
  </g>

  <g transform="translate(12 424)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">actions</text>
    <text class="m k mu" x="14" y="46">--view actions · report</text>
    <use href="#c1" x="14" y="62"/><text x="54" y="76">ledger CVE</text>
    <use href="#c2" x="14" y="86"/><text x="54" y="100">module CVE</text>
    <use href="#c3" x="14" y="110"/><text x="54" y="124">module CVE</text>
    <path class="ar" d="M144 96H170" marker-end="url(#h)"/>
    <use href="#c1" x="178" y="84"/><text x="218" y="98">upgrade module</text>
    <text class="sm mu" x="218" y="116">clears 3</text>
    <text class="sm mu" x="14" y="152">One row per thing to do, at the highest band</text>
    <text class="sm mu" x="14" y="170">among what it clears.</text>
  </g>

  <g transform="translate(368 424)">
    <rect class="pan" width="340" height="180" rx="10"/>
    <text class="m b t" x="14" y="26">builtBy: upstream</text>
    <text class="m k mu" x="14" y="46">images[].builtBy · report</text>
    <use href="#c2" x="14" y="62"/><text x="54" y="76">redis lib CVE</text>
    <use href="#c3" x="14" y="86"/><text x="54" y="100">redis lib CVE</text>
    <use href="#c3" x="14" y="110"/><text x="54" y="124">redis lib CVE</text>
    <path class="ar" d="M156 96H176" marker-end="url(#h)"/>
    <use href="#c2" x="184" y="84"/><text x="224" y="98">newer image</text>
    <text class="sm mu" x="224" y="116">clears 3</text>
    <text class="sm mu" x="14" y="152">An image somebody else builds is one action;</text>
    <text class="sm mu" x="14" y="170">operatedBy does this for clusters.</text>
  </g>
</svg>
