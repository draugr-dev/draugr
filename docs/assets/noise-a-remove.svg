<svg viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Six levers that make the count smaller, each shown as findings before and after, with every removed finding kept and labeled." xmlns="http://www.w3.org/2000/svg">
  <title>Levers that remove, before and after</title>
  <desc>Correlation, always on in run phase 4: the ledger CVE found by trivy-fs and by grype-fs is one row naming the other scanner. config.exclude, phase 4: the admin SAST finding, accepted with a reason and an expiry, stays in the report marked accepted and leaves the count and the gate. VEX, phase 4, from components[].vex or config.vexSources: the reports CVE, which the supplier states does not affect its product, stays marked VEX. Scanner exclusions arrive in phase 2: a finding the scanner set aside from a directive in the code or its own configuration is counted apart. Actions, at report time with --view actions: three CVEs in one module are one upgrade that clears three. builtBy: upstream on an image: its vulnerabilities become one action, take a newer image.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:11.5px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:10.5px}.t{font-size:12px}.b{font-weight:700}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .tag{fill:none;stroke:#7CA6B8;stroke-width:1.2;stroke-dasharray:4 3}
      .tg{fill:#7CA6B8}
    </style>
    <symbol id="c1" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E5534B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#E8B84B"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#16110A">P2</text></symbol>
    <symbol id="c3" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#7CA6B8"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#0A1116">P3</text></symbol>
    <symbol id="c4" viewBox="0 0 26 15" width="26" height="15"><rect width="26" height="15" rx="3" fill="#6B7680"/><text x="13" y="11.5" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="10" font-weight="700" fill="#FFFFFF">P4</text></symbol>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="900" height="420" rx="12" fill="#0B0E11"/>
  <text class="e" x="24" y="32">LEVERS THAT REMOVE · NOTHING IS DELETED</text>

  <g transform="translate(16 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">correlation</text>
    <text class="m sm mu" x="12" y="38">always on · phase 4</text>
    <use href="#c2" x="12" y="66"/><text x="42" y="78">ledger CVE</text>
    <text class="sm mu" x="42" y="92">trivy-fs</text>
    <use href="#c2" x="12" y="102"/><text x="42" y="114">ledger CVE</text>
    <text class="sm mu" x="42" y="128">grype-fs</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c2" x="154" y="84"/><text x="184" y="96">ledger CVE</text>
    <text class="sm mu" x="184" y="110">also grype-fs</text>
    <text class="sm mu" x="12" y="160">One flaw, one row, naming the others.</text>
  </g>

  <g transform="translate(310 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">config.exclude</text>
    <text class="m sm mu" x="12" y="38">reason · expiry · phase 4</text>
    <use href="#c3" x="12" y="92"/><text x="42" y="104">admin SAST</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c3" x="154" y="84"/><text x="184" y="96">admin SAST</text></g>
    <rect class="tag" x="184" y="102" width="62" height="17" rx="4"/><text class="sm tg" x="191" y="114">accepted</text>
    <text class="sm mu" x="12" y="146">Kept and marked; out of counts and gate.</text>
    <text class="sm mu" x="12" y="160">The line's git history names who.</text>
  </g>

  <g transform="translate(604 48)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">VEX</text>
    <text class="m sm mu" x="12" y="38">components[].vex · phase 4</text>
    <use href="#c4" x="12" y="92"/><text x="42" y="104">reports CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c4" x="154" y="84"/><text x="184" y="96">reports CVE</text></g>
    <rect class="tag" x="184" y="102" width="36" height="17" rx="4"/><text class="sm tg" x="191" y="114">VEX</text>
    <text class="sm mu" x="12" y="146">The supplier states it does not affect</text>
    <text class="sm mu" x="12" y="160">their product; its author can be asked.</text>
  </g>

  <g transform="translate(16 232)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">scanner exclusions</text>
    <text class="m sm mu" x="12" y="38">directive or scanner config · phase 2</text>
    <use href="#c3" x="12" y="92"/><text x="42" y="104">sast finding</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <g opacity=".5"><use href="#c3" x="154" y="84"/><text x="184" y="96">sast finding</text></g>
    <rect class="tag" x="184" y="102" width="66" height="17" rx="4"/><text class="sm tg" x="191" y="114">by scanner</text>
    <text class="sm mu" x="12" y="146">Set aside before Draugr saw it; no author,</text>
    <text class="sm mu" x="12" y="160">no date. Counted apart from the other two.</text>
  </g>

  <g transform="translate(310 232)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">actions</text>
    <text class="m sm mu" x="12" y="38">--view actions · report</text>
    <use href="#c1" x="12" y="72"/><text x="42" y="84">ledger CVE</text>
    <use href="#c2" x="12" y="92"/><text x="42" y="104">module CVE</text>
    <use href="#c3" x="12" y="112"/><text x="42" y="124">module CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c1" x="154" y="84"/><text x="184" y="96">upgrade module</text>
    <text class="sm mu" x="184" y="110">clears 3</text>
    <text class="sm mu" x="12" y="146">One row per thing to do, at the highest</text>
    <text class="sm mu" x="12" y="160">band among what it clears.</text>
  </g>

  <g transform="translate(604 232)">
    <rect class="pan" width="280" height="172" rx="10"/>
    <text class="m b t" x="12" y="22">builtBy: upstream</text>
    <text class="m sm mu" x="12" y="38">images[].builtBy · report</text>
    <use href="#c2" x="12" y="72"/><text x="42" y="84">redis lib CVE</text>
    <use href="#c3" x="12" y="92"/><text x="42" y="104">redis lib CVE</text>
    <use href="#c3" x="12" y="112"/><text x="42" y="124">redis lib CVE</text>
    <path class="ar" d="M120 100H146" marker-end="url(#h)"/>
    <use href="#c2" x="154" y="84"/><text x="184" y="96">newer image</text>
    <text class="sm mu" x="184" y="110">clears 3</text>
    <text class="sm mu" x="12" y="146">An image somebody else builds is one</text>
    <text class="sm mu" x="12" y="160">action; operatedBy does this for clusters.</text>
  </g>
</svg>
