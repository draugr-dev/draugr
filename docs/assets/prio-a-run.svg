<svg viewBox="0 0 720 476" width="720" height="476" role="img" aria-label="The phases of a run, from start to a later diff, with each lever placed at the phase where Draugr applies it." xmlns="http://www.w3.org/2000/svg">
  <title>When each lever applies in a run</title>
  <desc>Seven phases of a run, each with the levers that act there. Start: the feeds named in config.exploitability are read, and the scope flags --components, --controls and --labels choose what runs. Scan: each finding is ranked as it arrives, with the KEV, EPSS and floor raises; govulncheck runs when config.reachability names it; scanner exclusions arrive already set aside. Enrich: once every scanner has finished, the malicious and deprecated raises from config.dependencyHealth and the unreachable lowering rank findings again. Decide: config.exclude, a supplier's VEX and correlation set findings aside. Gate: --fail-on or config.gate decides what fails the run. Report: --min-priority, --top and --view narrow what is shown, and actions and builtBy or operatedBy group and assign what is left. Later: draugr diff compares against an earlier report. Each lever is drawn as one of four kinds: ranks, removes, narrows, gates.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
      .l{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;font-weight:700}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.b{font-weight:700}
      .kr{fill:#12161B;stroke:#E8B84B;stroke-width:1.5}
      .kx{fill:#12161B;stroke:#7CA6B8;stroke-width:1.5;stroke-dasharray:6 4}
      .kn{fill:#12161B;stroke:#9AA4AE;stroke-width:1.5;stroke-dasharray:2 3}
      .kg{fill:#12161B;stroke:#E6E8EA;stroke-width:2.5}
      .tu{fill:#E9635B}.td{fill:#7CA6B8}
      .sep{stroke:#232A31;stroke-width:1}
    </style>
  </defs>
  <rect width="720" height="476" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">A RUN · WHEN EACH LEVER APPLIES</text>
  <rect class="kr" x="170" y="40" width="70" height="26" rx="5"/><text class="sm" x="182" y="58">ranks</text>
  <rect class="kx" x="248" y="40" width="84" height="26" rx="5"/><text class="sm" x="260" y="58">removes</text>
  <rect class="kn" x="340" y="40" width="80" height="26" rx="5"/><text class="sm" x="352" y="58">narrows</text>
  <rect class="kg" x="428" y="40" width="66" height="26" rx="5"/><text class="sm" x="440" y="58">gates</text>
  <path d="M150 100V436" stroke="#2F3841" stroke-width="2"/>

  <path class="sep" d="M20 76H700"/>
  <circle cx="150" cy="101" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="98">1 start</text>
  <text class="mu sm" x="20" y="116">feeds load</text>
  <rect class="kr" x="170" y="87" width="178" height="28" rx="6"/><text class="m" x="180" y="106">config.exploitability</text>
  <rect class="kn" x="356" y="87" width="260" height="28" rx="6"/><text class="m" x="366" y="106">--components --controls --labels</text>

  <path class="sep" d="M20 126H700"/>
  <circle cx="150" cy="151" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="148">2 scan</text>
  <text class="mu sm" x="20" y="166">ranked on arrival</text>
  <rect class="kr" x="170" y="137" width="170" height="28" rx="6"/><text class="m b" x="180" y="156"><tspan class="tu">↑</tspan> KEV <tspan class="tu">↑</tspan> EPSS <tspan class="tu">↑</tspan> floor</text>
  <rect class="kr" x="348" y="137" width="253" height="28" rx="6"/><text class="m" x="358" y="156"><tspan class="b">govulncheck</tspan><tspan class="mu"> config.reachability</tspan></text>
  <rect class="kx" x="170" y="171" width="155" height="28" rx="6"/><text class="m" x="180" y="190">scanner exclusions</text>

  <path class="sep" d="M20 210H700"/>
  <circle cx="150" cy="235" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="232">3 enrich</text>
  <text class="mu sm" x="20" y="250">ranked again</text>
  <rect class="kr" x="170" y="221" width="373" height="28" rx="6"/><text class="m" x="180" y="240"><tspan class="b"><tspan class="tu">↑</tspan> malicious <tspan class="tu">↑</tspan> deprecated</tspan><tspan class="mu"> config.dependencyHealth</tspan></text>
  <rect class="kr" x="551" y="221" width="118" height="28" rx="6"/><text class="m b" x="561" y="240"><tspan class="td">↓</tspan> unreachable</text>

  <path class="sep" d="M20 260H700"/>
  <circle cx="150" cy="285" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="282">4 decide</text>
  <text class="mu sm" x="20" y="300">set aside</text>
  <rect class="kx" x="170" y="271" width="125" height="28" rx="6"/><text class="m" x="180" y="290">config.exclude</text>
  <rect class="kx" x="303" y="271" width="170" height="28" rx="6"/><text class="m" x="313" y="290"><tspan class="b">VEX</tspan><tspan class="mu"> components[].vex</tspan></text>
  <rect class="kx" x="481" y="271" width="103" height="28" rx="6"/><text class="m" x="491" y="290">correlation</text>

  <path class="sep" d="M20 310H700"/>
  <circle cx="150" cy="335" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="332">5 gate</text>
  <text class="mu sm" x="20" y="350">fails the run</text>
  <rect class="kg" x="170" y="321" width="178" height="28" rx="6"/><text class="m" x="180" y="340"><tspan class="b">--fail-on</tspan><tspan class="mu"> config.gate</tspan></text>

  <path class="sep" d="M20 360H700"/>
  <circle cx="150" cy="385" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="382">6 report</text>
  <text class="mu sm" x="20" y="400">what is shown</text>
  <rect class="kn" x="170" y="371" width="125" height="28" rx="6"/><text class="m" x="180" y="390">--min-priority</text>
  <rect class="kn" x="303" y="371" width="58" height="28" rx="6"/><text class="m" x="313" y="390">--top</text>
  <rect class="kn" x="369" y="371" width="65" height="28" rx="6"/><text class="m" x="379" y="390">--view</text>
  <rect class="kx" x="442" y="371" width="73" height="28" rx="6"/><text class="m" x="452" y="390">actions</text>
  <rect class="kx" x="523" y="371" width="170" height="28" rx="6"/><text class="m" x="533" y="390">builtBy · operatedBy</text>

  <path class="sep" d="M20 410H700"/>
  <circle cx="150" cy="435" r="4" fill="#7CA6B8"/>
  <text class="l" x="20" y="432">7 later</text>
  <text class="mu sm" x="20" y="450">a later diff</text>
  <rect class="kn" x="170" y="421" width="103" height="28" rx="6"/><text class="m" x="180" y="440">draugr diff</text>
  <path class="sep" d="M20 460H700"/>
</svg>
