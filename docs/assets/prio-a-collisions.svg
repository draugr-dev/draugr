<svg viewBox="0 0 720 520" width="720" height="520" role="img" aria-label="Two rules for two signals on one finding: between two raises the higher severity wins, and against an unreachable verdict KEV, EPSS and malicious overrule while deprecated yields." xmlns="http://www.w3.org/2000/svg">
  <title>When two signals hit one finding</title>
  <desc>Two raises. A medium finding that EPSS raises to high and a malicious package raises to critical ends at critical, marked malicious, because the higher resulting severity wins. A high finding that EPSS and deprecated both raise to critical is a tie, and a tie goes to exploitability, so it is marked EPSS. A raise against an unreachable verdict on a high finding: KEV overrules and the finding is critical; EPSS overrules, critical; malicious overrules, critical; deprecated yields, and the finding is lowered to medium, marked unreachable. A KEV listing on a finding already critical raised nothing and still overrules, so the finding stays critical with no mark. Both rules are settled in run phase 3, once every scanner has finished.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.h{font-size:13px}.b{font-weight:700}.c{text-anchor:middle}
      .sev{fill:#12161B;stroke:#9AA4AE;stroke-width:1.5}
      .lose{fill:#12161B;stroke:#5A646E;stroke-width:1.5;stroke-dasharray:4 3}
      .win{fill:#12161B;stroke:#E6E8EA;stroke-width:2.5}
      .up{stroke:#E9635B;stroke-width:1.8;fill:none}
      .ar{stroke:#9AA4AE;stroke-width:1.5;fill:none}
      .pan{fill:none;stroke:#232A31;stroke-width:1.5}
      .g{stroke:#232A31;stroke-width:1}
      .tu{fill:#E9635B}.td{fill:#7CA6B8}
    </style>
    <marker id="u" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E9635B"/></marker>
    <marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#9AA4AE"/></marker>
  </defs>
  <rect width="720" height="520" rx="12" fill="#0B0E11"/>

  <rect class="pan" x="12" y="12" width="696" height="214" rx="10"/>
  <text class="e" x="30" y="38">TWO RAISES · THE HIGHER SEVERITY WINS</text>

  <g transform="translate(30 60)">
    <rect class="sev" x="0" y="50" width="72" height="28" rx="5"/><text class="m h c" x="36" y="69">medium</text>
    <path class="up" d="M72 58L124 24" marker-end="url(#u)"/>
    <path class="up" d="M72 70L124 104" marker-end="url(#u)"/>
    <text class="m sm" x="0" y="36"><tspan class="tu">↑</tspan> EPSS</text>
    <text class="m sm" x="0" y="100"><tspan class="tu">↑</tspan> malicious</text>
    <rect class="lose" x="128" y="8" width="78" height="28" rx="5"/><text class="m h c mu" x="167" y="27">high</text>
    <rect class="sev" x="128" y="92" width="78" height="28" rx="5"/><text class="m h c" x="167" y="111">critical</text>
    <path class="ar" d="M206 104L232 74" marker-end="url(#h)"/>
    <rect class="win" x="236" y="50" width="84" height="28" rx="5"/><text class="m h b c" x="278" y="69">critical</text>
    <text class="m sm c" x="278" y="100"><tspan class="tu">↑</tspan> malicious</text>
    <text class="sm mu c" x="278" y="118">higher wins</text>
  </g>

  <path class="g" d="M360 56V210"/>
  <g transform="translate(380 60)">
    <rect class="sev" x="0" y="50" width="72" height="28" rx="5"/><text class="m h c" x="36" y="69">high</text>
    <path class="up" d="M72 58L124 24" marker-end="url(#u)"/>
    <path class="up" d="M72 70L124 104" marker-end="url(#u)"/>
    <text class="m sm" x="0" y="36"><tspan class="tu">↑</tspan> EPSS</text>
    <text class="m sm" x="0" y="100"><tspan class="tu">↑</tspan> deprecated</text>
    <rect class="sev" x="128" y="8" width="78" height="28" rx="5"/><text class="m h c" x="167" y="27">critical</text>
    <rect class="lose" x="128" y="92" width="78" height="28" rx="5"/><text class="m h c mu" x="167" y="111">critical</text>
    <path class="ar" d="M206 24L232 54" marker-end="url(#h)"/>
    <rect class="win" x="236" y="50" width="84" height="28" rx="5"/><text class="m h b c" x="278" y="69">critical</text>
    <text class="m sm c" x="278" y="100"><tspan class="tu">↑</tspan> EPSS</text>
    <text class="sm mu c" x="278" y="118">tie goes to</text>
    <text class="sm mu c" x="278" y="134">exploitability</text>
  </g>

  <rect class="pan" x="12" y="240" width="696" height="226" rx="10"/>
  <text class="e" x="30" y="266">A RAISE AGAINST ↓ UNREACHABLE · A HIGH FINDING</text>
  <text class="sm mu" x="30" y="292">signal</text>
  <text class="sm mu" x="250" y="292">verdict</text>
  <text class="sm mu" x="430" y="292">ranked at</text>
  <path class="g" d="M30 300H690"/>
  <text class="m b" x="30" y="324"><tspan class="tu">↑</tspan> KEV</text>
  <text class="m" x="250" y="324"><tspan class="tu">↑</tspan> overrules</text>
  <rect class="sev" x="430" y="308" width="84" height="24" rx="5"/><text class="m h c" x="472" y="325">critical</text>
  <text class="m b" x="30" y="356"><tspan class="tu">↑</tspan> EPSS</text>
  <text class="m" x="250" y="356"><tspan class="tu">↑</tspan> overrules</text>
  <rect class="sev" x="430" y="340" width="84" height="24" rx="5"/><text class="m h c" x="472" y="357">critical</text>
  <text class="m b" x="30" y="388"><tspan class="tu">↑</tspan> malicious</text>
  <text class="m" x="250" y="388"><tspan class="tu">↑</tspan> overrules</text>
  <rect class="sev" x="430" y="372" width="84" height="24" rx="5"/><text class="m h c" x="472" y="389">critical</text>
  <text class="m b" x="30" y="420"><tspan class="tu">↑</tspan> deprecated</text>
  <text class="m" x="250" y="420"><tspan class="td">↓</tspan> yields</text>
  <rect class="sev" x="430" y="404" width="84" height="24" rx="5"/><text class="m h c" x="472" y="421">medium</text>
  <text class="m sm" x="526" y="421"><tspan class="td">↓</tspan> unreachable</text>
  <path class="g" d="M30 434H690"/>
  <text class="m b" x="30" y="456">KEV, already critical</text>
  <text class="m" x="250" y="456"><tspan class="tu">↑</tspan> overrules</text>
  <rect class="sev" x="430" y="440" width="84" height="24" rx="5"/><text class="m h c" x="472" y="457">critical</text>
  <text class="sm mu" x="526" y="457">no mark: raised nothing</text>

  <text class="e" x="20" y="500">WHEN</text>
  <text class="sm" x="84" y="500">Both rules are settled in run phase 3, once every scanner has finished.</text>
</svg>
