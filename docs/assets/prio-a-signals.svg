<svg viewBox="0 0 720 450" width="720" height="450" role="img" aria-label="Each signal drawn as a move along the severity ladder from low to critical, with the condition that triggers it and the key that turns it on." xmlns="http://www.w3.org/2000/svg">
  <title>What each signal does to severity</title>
  <desc>The severity ladder runs low, medium, high, critical. KEV moves a finding to critical from any level when its CVE is on CISA's Known Exploited Vulnerabilities catalog; turned on by config.exploitability.kev; applied in run phase 2, scan. EPSS moves it up one level when the score is at or above epssThreshold, default 0.5; config.exploitability.epss; phase 2. Malicious moves it to critical when the package is in the OSSF Malicious Packages Project; config.dependencyHealth.enabled; phase 3, enrich. Deprecated moves it up one level when the publisher has deprecated the version; config.dependencyHealth.enabled; phase 3. Unreachable moves it down one level when govulncheck finds no call path to the vulnerable code, Go only; config.reachability.analyzers; phase 3. A CVE missing from KEV, a low EPSS score and an unflagged package move nothing.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.k{font-size:12px}.b{font-weight:700}.c{text-anchor:middle}
      .up{stroke:#E9635B;stroke-width:2.5;fill:none}
      .dn{stroke:#7CA6B8;stroke-width:2.5;fill:none;stroke-dasharray:7 5}
      .g{stroke:#232A31;stroke-width:1}
      .tu{fill:#E9635B}.td{fill:#7CA6B8}
    </style>
    <marker id="u" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E9635B"/></marker>
    <marker id="d" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#7CA6B8"/></marker>
  </defs>
  <rect width="720" height="450" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">SIGNALS · WHAT MOVES SEVERITY</text>
  <text class="m sm c" x="205" y="58">low</text>
  <text class="m sm c" x="275" y="58">medium</text>
  <text class="m sm c" x="345" y="58">high</text>
  <text class="m sm c" x="415" y="58">critical</text>
  <path class="g" d="M205 68V378M275 68V378M345 68V378M415 68V378"/>
  <path class="g" d="M20 70H700"/>

  <text class="m b" x="20" y="98"><tspan class="tu">↑</tspan> KEV</text>
  <text class="sm mu" x="20" y="117">phase 2 · scan</text>
  <circle cx="205" cy="106" r="4" fill="#E9635B"/>
  <path class="up" d="M209 106H408" marker-end="url(#u)"/>
  <text class="sm c" x="310" y="96">from any level to critical</text>
  <text class="sm" x="470" y="100">CVE on CISA's KEV catalog</text>
  <text class="m k mu" x="470" y="118">config.exploitability.kev</text>

  <path class="g" d="M20 132H700"/>
  <text class="m b" x="20" y="160"><tspan class="tu">↑</tspan> EPSS</text>
  <text class="sm mu" x="20" y="179">phase 2 · scan</text>
  <circle cx="275" cy="168" r="4" fill="#E9635B"/>
  <path class="up" d="M279 168H338" marker-end="url(#u)"/>
  <text class="sm c" x="310" y="158">one level</text>
  <text class="sm" x="470" y="162">score ≥ epssThreshold, 0.5</text>
  <text class="m k mu" x="470" y="180">config.exploitability.epss</text>

  <path class="g" d="M20 194H700"/>
  <text class="m b" x="20" y="222"><tspan class="tu">↑</tspan> malicious</text>
  <text class="sm mu" x="20" y="241">phase 3 · enrich</text>
  <circle cx="205" cy="230" r="4" fill="#E9635B"/>
  <path class="up" d="M209 230H408" marker-end="url(#u)"/>
  <text class="sm c" x="310" y="220">from any level to critical</text>
  <text class="sm" x="470" y="224">in OSSF Malicious Packages</text>
  <text class="m k mu" x="470" y="242">config.dependencyHealth.enabled</text>

  <path class="g" d="M20 256H700"/>
  <text class="m b" x="20" y="284"><tspan class="tu">↑</tspan> deprecated</text>
  <text class="sm mu" x="20" y="303">phase 3 · enrich</text>
  <circle cx="275" cy="292" r="4" fill="#E9635B"/>
  <path class="up" d="M279 292H338" marker-end="url(#u)"/>
  <text class="sm c" x="310" y="282">one level</text>
  <text class="sm" x="470" y="286">publisher deprecated the version</text>
  <text class="m k mu" x="470" y="304">config.dependencyHealth.enabled</text>

  <path class="g" d="M20 318H700"/>
  <text class="m b" x="20" y="346"><tspan class="td">↓</tspan> unreachable</text>
  <text class="sm mu" x="20" y="365">phase 3 · enrich</text>
  <circle cx="345" cy="354" r="4" fill="#7CA6B8"/>
  <path class="dn" d="M341 354H282" marker-end="url(#d)"/>
  <text class="sm c" x="310" y="344">one level down</text>
  <text class="sm" x="470" y="348">no call path found; Go only</text>
  <text class="m k mu" x="470" y="366">config.reachability.analyzers</text>
  <path class="g" d="M20 380H700"/>

  <text class="e" x="20" y="408">ABSENT</text>
  <text class="sm" x="96" y="408">A CVE missing from KEV, a low EPSS score and an unflagged package</text>
  <text class="sm" x="96" y="428">move nothing. Only unreachable lowers.</text>
</svg>
