<svg viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="On the ledger component, the ledger CVE ranks at its declared tier C2 and lands in P2, while a leaked token there ranks at C1 under the context floor and lands in P1." xmlns="http://www.w3.org/2000/svg">
  <title>The context floor beside the ledger CVE</title>
  <desc>Two findings on the ledger component, which declares exposure internal and criticality critical, tier C2. The ledger CVE, from the sca control, is rated high and ranked at C2, P2; no floor applies to it. A leaked token, from the secrets control, is held at high by the severity floor and ranked at C1 by the context floor, marked floor, so it lands in P1 with its severity unchanged. The severity floor moves severity and draws no mark; the context floor moves the tier and draws the floor mark. Both are always on, with no key, and apply as each secrets finding is ranked in run phase 2.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:14px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.h{font-size:13px}.b{font-weight:700}.c{text-anchor:middle}
      .sev{fill:none;stroke-width:1}.s1{stroke:#E5534B}.s2{stroke:#E8B84B}.s3{stroke:#7CA6B8}.s4{stroke:#6B7680}
      .tier{fill:#2A333C}
      .box{fill:#12161B;stroke:#2F3841;stroke-width:1.5}
      .bfl{fill:#12161B;stroke:#E9635B;stroke-width:1.5;stroke-dasharray:2 4}
      .g{stroke:#232A31;stroke-width:1}
      .tu{fill:#E9635B}
    </style>
    <symbol id="c1" viewBox="0 0 44 26" width="44" height="26"><rect width="44" height="26" rx="5" fill="#E5534B"/><text x="22" y="18" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 44 26" width="44" height="26"><rect width="44" height="26" rx="5" fill="#E8B84B"/><text x="22" y="18" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#16110A">P2</text></symbol>
    <marker id="u" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#E9635B"/></marker>
  </defs>
  <rect width="720" height="400" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">CONTEXT FLOOR · TWO FINDINGS ON LEDGER</text>
  <text class="sm mu" x="20" y="50">ledger declares internal, critical: tier C2</text>
  <text class="sm mu" x="20" y="84">finding</text>
  <text class="sm mu" x="180" y="84">severity</text>
  <text class="sm mu" x="290" y="84">tier</text>
  <text class="sm mu" x="520" y="84">band</text>
  <path class="g" d="M20 94H700"/>

  <text class="m b" x="20" y="124">ledger CVE</text>
  <text class="sm mu" x="20" y="142">sca</text>
  <rect class="sev s2" x="180" y="108" width="74" height="26" rx="5"/><text class="m h c" x="217" y="126">high</text>
  <rect class="tier" x="290" y="108" width="52" height="26" rx="5"/><text class="m b c" x="316" y="126">C2</text>
  <text class="sm mu" x="354" y="126">declared</text>
  <use href="#c2" x="520" y="108"/>
  <path class="g" d="M20 156H700"/>

  <text class="m b" x="20" y="186">leaked token</text>
  <text class="sm mu" x="20" y="204">secrets</text>
  <rect class="sev s2" x="180" y="170" width="74" height="26" rx="5"/><text class="m h c" x="217" y="188">high</text>
  <text class="sm mu" x="180" y="214">severity floor</text>
  <rect class="tier" x="290" y="170" width="52" height="26" rx="5" opacity=".5"/><text class="m c mu" x="316" y="188">C2</text>
  <path d="M346 183H392" stroke="#E9635B" stroke-width="2" stroke-dasharray="2 4" fill="none" marker-end="url(#u)"/>
  <rect x="398" y="170" width="52" height="26" rx="5" fill="#3A4550" stroke="#E9635B" stroke-width="1.5" stroke-dasharray="2 3"/><text class="m b c" x="424" y="188">C1</text>
  <text class="m sm" x="346" y="214"><tspan class="tu">↑</tspan> floor</text>
  <use href="#c1" x="520" y="170"/>
  <path class="g" d="M20 228H700"/>

  <rect class="box" x="20" y="244" width="330" height="80" rx="8"/>
  <text class="m b" x="34" y="268">severity floor</text>
  <text class="sm" x="34" y="290">secrets never below high</text>
  <text class="sm mu" x="34" y="310">moves severity · no mark</text>
  <rect class="bfl" x="370" y="244" width="330" height="80" rx="8"/>
  <text class="m b" x="384" y="268">context floor</text>
  <text class="sm" x="384" y="290">secrets ranked at C1, severity unchanged</text>
  <text class="sm mu" x="384" y="310">moves the tier · mark <tspan class="tu">↑</tspan> floor</text>

  <text class="e" x="20" y="356">WHEN</text>
  <text class="sm" x="84" y="356">Always on, with no key: applied as each secrets finding is ranked, in</text>
  <text class="sm" x="84" y="376">run phase 2. The ledger CVE keeps C2: a dependency CVE is bounded by its component.</text>
</svg>
