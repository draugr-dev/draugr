<svg viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="The ledger CVE with two signals at once: ties between raises go to exploitability, KEV, EPSS and malicious overrule unreachable, and deprecated yields to it." xmlns="http://www.w3.org/2000/svg">
  <title>Two signals on the ledger CVE</title>
  <desc>The ledger CVE is rated high on tier C2. EPSS 0.62 and deprecated both raise it to critical, a tie that goes to exploitability: critical, P1, marked EPSS 0.62. KEV and malicious both raise it to critical, a tie that goes to KEV: P1, marked KEV. KEV against unreachable: KEV overrules, critical, P1, marked KEV. EPSS against unreachable: EPSS overrules, P1. Malicious against unreachable: malicious overrules, P1. Deprecated against unreachable: deprecated yields, so the finding is lowered one level to medium, P2, marked unreachable. A medium finding in the same module that EPSS raises to high and malicious raises to critical ends at critical, P1, marked malicious, because the higher result wins. Both rules are settled in run phase 3.</desc>
  <defs>
    <style>
      text{font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#E6E8EA;font-size:13.5px}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .e{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;letter-spacing:1px;fill:#7CA6B8}
      .mu{fill:#9AA4AE}.sm{font-size:12.5px}.h{font-size:13px}.b{font-weight:700}.c{text-anchor:middle}
      .sev{fill:none;stroke-width:1}.s1{stroke:#E5534B}.s2{stroke:#E8B84B}.s3{stroke:#7CA6B8}.s4{stroke:#6B7680}
      .g{stroke:#232A31;stroke-width:1}
      .tu{fill:#E9635B}.td{fill:#7CA6B8}
    </style>
    <symbol id="c1" viewBox="0 0 40 24" width="40" height="24"><rect width="40" height="24" rx="5" fill="#E5534B"/><text x="20" y="17" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#0B0E11">P1</text></symbol>
    <symbol id="c2" viewBox="0 0 40 24" width="40" height="24"><rect width="40" height="24" rx="5" fill="#E8B84B"/><text x="20" y="17" text-anchor="middle" font-family="'JetBrains Mono',ui-monospace,monospace" font-size="13" font-weight="700" fill="#16110A">P2</text></symbol>
  </defs>
  <rect width="720" height="470" rx="12" fill="#0B0E11"/>
  <text class="e" x="20" y="28">COLLISIONS · TWO SIGNALS ON THE LEDGER CVE, RATED HIGH</text>
  <text class="sm mu" x="20" y="58">signals</text>
  <text class="sm mu" x="258" y="58">rule</text>
  <text class="sm mu" x="464" y="58">ranked at</text>
  <text class="sm mu" x="550" y="58">band</text>
  <text class="sm mu" x="600" y="58">mark</text>
  <path class="g" d="M20 68H700"/>

  <text class="e" x="20" y="92">TWO RAISES</text>
  <text class="m h" x="20" y="120"><tspan class="tu">↑</tspan> EPSS 0.62 + <tspan class="tu">↑</tspan> deprecated</text>
  <text x="258" y="120">tie: exploitability takes it</text>
  <rect class="sev s1" x="464" y="103" width="76" height="24" rx="5"/><text class="m h c" x="502" y="120">critical</text>
  <use href="#c1" x="550" y="103"/>
  <text class="m sm" x="600" y="120"><tspan class="tu">↑</tspan> EPSS 0.62</text>
  <text class="m h" x="20" y="154"><tspan class="tu">↑</tspan> KEV + <tspan class="tu">↑</tspan> malicious</text>
  <text x="258" y="154">tie: exploitability takes it</text>
  <rect class="sev s1" x="464" y="137" width="76" height="24" rx="5"/><text class="m h c" x="502" y="154">critical</text>
  <use href="#c1" x="550" y="137"/>
  <text class="m sm" x="600" y="154"><tspan class="tu">↑</tspan> KEV</text>
  <path class="g" d="M20 172H700"/>

  <text class="e" x="20" y="196">A RAISE AGAINST ↓ UNREACHABLE</text>
  <text class="m h" x="20" y="224"><tspan class="tu">↑</tspan> KEV + <tspan class="td">↓</tspan> unreachable</text>
  <text x="258" y="224"><tspan class="tu">↑</tspan> KEV overrules</text>
  <rect class="sev s1" x="464" y="207" width="76" height="24" rx="5"/><text class="m h c" x="502" y="224">critical</text>
  <use href="#c1" x="550" y="207"/>
  <text class="m sm" x="600" y="224"><tspan class="tu">↑</tspan> KEV</text>
  <text class="m h" x="20" y="258"><tspan class="tu">↑</tspan> EPSS 0.62 + <tspan class="td">↓</tspan> unreachable</text>
  <text x="258" y="258"><tspan class="tu">↑</tspan> EPSS overrules</text>
  <rect class="sev s1" x="464" y="241" width="76" height="24" rx="5"/><text class="m h c" x="502" y="258">critical</text>
  <use href="#c1" x="550" y="241"/>
  <text class="m sm" x="600" y="258"><tspan class="tu">↑</tspan> EPSS 0.62</text>
  <text class="m h" x="20" y="292"><tspan class="tu">↑</tspan> malicious + <tspan class="td">↓</tspan> unreachable</text>
  <text x="258" y="292"><tspan class="tu">↑</tspan> malicious overrules</text>
  <rect class="sev s1" x="464" y="275" width="76" height="24" rx="5"/><text class="m h c" x="502" y="292">critical</text>
  <use href="#c1" x="550" y="275"/>
  <text class="m sm" x="600" y="292"><tspan class="tu">↑</tspan> malicious</text>
  <text class="m h" x="20" y="326"><tspan class="tu">↑</tspan> deprecated + <tspan class="td">↓</tspan> unreachable</text>
  <text x="258" y="326"><tspan class="td">↓</tspan> deprecated yields</text>
  <rect class="sev s3" x="464" y="309" width="76" height="24" rx="5"/><text class="m h c" x="502" y="326">medium</text>
  <use href="#c2" x="550" y="309"/>
  <text class="m sm" x="600" y="326"><tspan class="td">↓</tspan> unreachable</text>
  <path class="g" d="M20 344H700"/>

  <text class="e" x="20" y="368">A MEDIUM FINDING IN THE SAME MODULE</text>
  <text class="m h" x="20" y="396"><tspan class="tu">↑</tspan> EPSS + <tspan class="tu">↑</tspan> malicious</text>
  <text x="258" y="396">the higher result wins</text>
  <rect class="sev s1" x="464" y="379" width="76" height="24" rx="5"/><text class="m h c" x="502" y="396">critical</text>
  <use href="#c1" x="550" y="379"/>
  <text class="m sm" x="600" y="396"><tspan class="tu">↑</tspan> malicious</text>
  <path class="g" d="M20 414H700"/>
  <text class="sm mu" x="20" y="440">Settled in run phase 3, once every scanner has finished and the finding is ranked again.</text>
</svg>
