version: "2"

run:
  timeout: 5m
  # Every build tag this repository uses. A file behind a tag nobody names is a file the linter
  # opens and then reports success for, which reads exactly like a file with nothing wrong in it.
  # Nothing else covers them either: `go vet ./...` and `go test ./...` use the default tag set,
  # so a tagged file that does not compile passes both.
  #
  # Add a new tag here in the same change that introduces it — and to `go vet` in scripts/gate.sh,
  # which needs its own copy.
  build-tags:
    - integration

linters:
  enable:
    # Security
    - gosec
    # Correctness / quality (beyond the defaults: errcheck, govet, ineffassign,
    # staticcheck, unused)
    - bodyclose
    - misspell
    - revive

  settings:
    misspell:
      # American spelling, so the vocabulary is one choice rather than whichever the author grew
      # up with. Without a locale, misspell catches outright typos and accepts either variant of
      # a word that has two — which lets one spelling sit beside the other, each correct alone
      # and inconsistent together. Prose here is read far more often than it is written, and much
      # of it is quoted into the docs and onto a public site.
      #
      # Go files only: golangci-lint does not read Markdown. `make gate` runs the same check over
      # docs and the CHANGELOG separately — see scripts/check-spelling.sh.
      locale: US

formatters:
  enable:
    - gofmt
    - goimports
