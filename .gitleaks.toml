# Gitleaks configuration for scanning *this* repository.
#
# Extends the default ruleset rather than replacing it, so every upstream rule still applies —
# this file only records the one deliberate exception below. It has no effect on scans Draugr
# runs for you.

[extend]
useDefault = true

[[allowlists]]
description = """
The integration test writes a throwaway RSA key into a temporary repo so it has a real secret to
find — a test asserting that `secrets` detects nothing would assert nothing. The key material is
fake (it reads EXAMPLEfakekeymaterialnotreal) and was never valid anywhere.

Allowlisted by path rather than by fingerprint: a fingerprint pins the commit and the line number,
so it would silently stop matching the next time the file is touched, and the finding would
reappear with no one having decided anything.
"""
# Unanchored at the front on purpose: gitleaks matches against the path of the checkout it was
# handed, which is a temp clone, so a leading ^ would never match.
paths = ['''test/integration/repo_scan_test\.go$''']
