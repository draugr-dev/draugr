# Draugr for GitLab CI — the counterpart of the GitHub Action and the Azure Pipelines template.
#
# GitLab has no first-party Draugr component, so this template is the equivalent. Include it and
# override any variable:
#
#   include:
#     - remote: 'https://raw.githubusercontent.com/draugr-dev/draugr/v0.86.2/gitlab-ci/draugr.yml'
#
# `remote:` and not `project:` — `include: project:` resolves against your own GitLab instance, and
# Draugr is not on it. Pin the tag: the URL is fetched at pipeline time, so `main` would change
# under a pipeline that had not changed.
#
#   draugr:
#     variables:
#       DRAUGR_SAGA: services/api/draugr.saga.yaml
#       DRAUGR_FAIL_ON_NEW_PRIORITY: P1
#
# On a merge request it scans the head and the merge base and reports the delta as a sticky
# comment, gated on what the change introduces. On the default branch it scans and gates the whole
# descriptor. Both publish GitLab's own reports as artifacts.
#
# ONE THING TO SET UP: add a masked CI/CD variable named GITLAB_TOKEN holding a project or group
# access token with `api` scope. The CI_JOB_TOKEN GitLab puts in every job is read-only on the
# notes API — it can list comments and not write one — so the sticky comment cannot be posted with
# the credential that is already there. Without it Draugr names the fix and the job carries on.

variables:
  DRAUGR_SAGA: draugr.saga.yaml
  # Empty installs the latest release. Pin it for a pipeline that has to be reproducible.
  DRAUGR_VERSION: ""
  # Gate a merge request on what it introduces rather than on the backlog it inherited. Empty
  # disables the differential gate; the descriptor's own gate still applies on the default branch.
  DRAUGR_FAIL_ON_NEW_PRIORITY: P1
  # Provision the scanners Draugr distributes. Turn off on a runner whose image already has them.
  DRAUGR_TOOLS: "true"
  # Semgrep backs the `sast` control and Draugr does not distribute it. Turn off if your descriptor
  # does not enable `sast`, or if your image already carries it — installing it costs about a minute.
  DRAUGR_SEMGREP: "true"

draugr:
  stage: test
  # Debian-based and carrying pip, for two reasons the alpine equivalent does not survive: the
  # scanners Draugr provisions are built against glibc, and Semgrep ships manylinux wheels that do
  # not install on musl.
  image: python:3.13-slim
  variables:
    # A diff needs the merge base, and GitLab clones 20 commits deep by default — so the commit to
    # compare against is usually absent. The job fetches that one commit, which is far cheaper than
    # a full history. Set GIT_DEPTH: 0 instead if your instance refuses to serve a bare SHA.
    GIT_DEPTH: 20
    DRAUGR_BASE_WORKTREE: /tmp/draugr-base
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl git ca-certificates >/dev/null
    # A runner clones as one user and may run the job as another; git then refuses to read the
    # repository, and a scanner that shells out to it reports nothing rather than an error.
    - git config --global --add safe.directory '*'
    - |
      set -euo pipefail
      if [ -n "${DRAUGR_VERSION:-}" ]; then
        curl -fsSL https://draugr.dev/install.sh | DRAUGR_VERSION="$DRAUGR_VERSION" sh
      else
        curl -fsSL https://draugr.dev/install.sh | sh
      fi
      # Two directories: install.sh writes Draugr to the first, and Draugr writes the scanners it
      # provisions to the second. Neither is on a runner's PATH.
      export PATH="$HOME/.local/bin:$HOME/.draugr/bin:$PATH"
      if [ "${DRAUGR_TOOLS}" = "true" ]; then
        draugr tools install -y --saga "${DRAUGR_SAGA}"
        # Draugr distributes only the scanners it can verify, and Semgrep is not one of them. A
        # descriptor enabling `sast` needs it on PATH, so the template installs it here rather than
        # letting the control report that it quietly found nothing.
        if [ "${DRAUGR_SEMGREP}" = "true" ]; then
          pip install --quiet --no-cache-dir semgrep
        fi
      fi
      # Names anything still missing, and the source to get it from. Non-fatal: the scan below
      # reports a control that could not run, which is the error worth failing on.
      draugr doctor "${DRAUGR_SAGA}" || true
  script:
    - |
      set -euo pipefail
      export PATH="$HOME/.local/bin:$HOME/.draugr/bin:$PATH"

      # One scan renders every report. --report *replaces* the default json,sarif rather than
      # adding to it, so sarif is named explicitly: the merge-request path below diffs two
      # results.sarif files, and a scan that did not write one fails on a missing file rather than
      # on anything that points at the report list.
      reports="json,sarif,gitlab-sast,gitlab-secret-detection,gitlab-codequality"

      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        # A branch pipeline: the whole descriptor, gated by its own policy.
        draugr scan "${DRAUGR_SAGA}" -o draugr-out --report "${reports}"
        exit $?
      fi

      # A merge request: the head, then the merge base, then the delta between them.
      base="${CI_MERGE_REQUEST_DIFF_BASE_SHA}"
      echo "diffing against the merge base ${base}"
      git fetch --no-tags --depth 1 origin "${base}"

      # --no-gate on both scans: the descriptor's own verdict is about the branch as a whole, and
      # the question a merge request asks is what *this change* added. `draugr diff` is the gate.
      draugr scan "${DRAUGR_SAGA}" -o draugr-out --report "${reports}" --no-publish --no-gate

      git worktree add --detach "${DRAUGR_BASE_WORKTREE}" "${base}"
      # Scanned from inside the worktree, not by pointing at the descriptor in it. A component's
      # `url: .` resolves against the working directory, so naming the base's descriptor while
      # standing in the head checkout scans the head twice — and a diff of a tree against itself
      # reports no change and passes every gate. -o is absolute for the same reason.
      ( cd "${DRAUGR_BASE_WORKTREE}" && draugr scan "${DRAUGR_SAGA}" \
          -o "${CI_PROJECT_DIR}/draugr-base-out" --no-publish --no-gate )

      gate=""
      if [ -n "${DRAUGR_FAIL_ON_NEW_PRIORITY:-}" ]; then
        gate="--fail-on-new-priority ${DRAUGR_FAIL_ON_NEW_PRIORITY}"
      fi
      # --publish selects gitlab-mr-comment from the runner's own environment, and no-ops with an
      # explanation rather than an error when GITLAB_TOKEN is not set.
      draugr diff "${CI_PROJECT_DIR}/draugr-base-out/results.sarif" draugr-out/results.sarif --publish ${gate}
  artifacts:
    # A blocked merge request is exactly when a reviewer needs to see why, and reports produced
    # only on success are reports nobody reads.
    when: always
    paths:
      - draugr-out/
    reports:
      # sast and secret_detection feed the Vulnerability Report and the merge-request security
      # widget, which are Ultimate. codequality shows in the merge request's Reports tab on every
      # tier, which is why it carries every finding rather than a typed subset.
      sast: draugr-out/gl-sast-report.json
      secret_detection: draugr-out/gl-secret-detection-report.json
      codequality: draugr-out/gl-code-quality-report.json
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
