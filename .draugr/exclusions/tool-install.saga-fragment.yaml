# `draugr tools install` running an interpreter or toolchain whose path it discovers. Each
# exclusion states what reaches exec and why none of it comes from a descriptor, a scanned
# repository or the network.
config:
  exclude:
    - paths:
        - "internal/tools/python.go"
      rules:
        - "go.lang.security.audit.dangerous-exec-command.dangerous-exec-command"
      reason: >-
        Installing a tool that ships as a Python package means running an interpreter, and the
        interpreter's path is discovered rather than written down — that is the finding, and it is
        the job. What reaches exec is Draugr's own: a python3 resolved from a fixed candidate list
        by exec.LookPath, then the pip inside the virtual environment Draugr just created, with a
        requirements file embedded in this binary. None of it is reachable from a descriptor, a
        scanned repository or the network. Rewriting it to satisfy the rule would mean hardcoding
        an interpreter path, which is wrong on every machine that keeps Python somewhere else.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "internal/tools/node.go"
      rules:
        - "go.lang.security.audit.dangerous-exec-command.dangerous-exec-command"
      reason: >-
        The npm form of the exclusion above, and the same argument. Installing a tool that ships as
        an npm package means running npm, and npm's path is discovered rather than written down —
        that is the finding, and it is the job. What reaches exec is Draugr's own: an npm resolved
        by exec.LookPath, a node resolved the same way to read its version, and a manifest and
        lockfile embedded in this binary. None of it is reachable from a descriptor, a scanned
        repository or the network, and the install runs with --ignore-scripts so nothing in the
        package tree executes either. Hardcoding an interpreter path to satisfy the rule would be
        wrong on every machine that keeps Node somewhere else.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "internal/tools/gotool.go"
      rules:
        - "go.lang.security.audit.dangerous-exec-command.dangerous-exec-command"
      reason: >-
        The Go form of the two exclusions above, and the same argument. A tool that publishes no
        release binary has to be built to be obtained, building it means running the Go toolchain,
        and the toolchain's path is discovered rather than written down — that is the finding, and
        it is the job. What reaches exec is Draugr's own: a go resolved by exec.LookPath, a package
        path and version that are constants in this binary, and an environment this code sets
        rather than inherits. None of it is reachable from a descriptor, a scanned repository or
        the network. Hardcoding a toolchain path to satisfy the rule would be wrong on every
        machine that keeps Go somewhere else.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"
