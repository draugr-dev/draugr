# Draugr scanning itself — dogfooding (see issue #64). Run: draugr scan .draugr/self.saga.yaml
# Only controls that apply to this Go repo are enabled today. "url: ." scans the current
# checkout (git clone of the working directory), so CI scans the pushed commit.
#
# The `github` publisher uploads the SARIF to code scanning in CI. It no-ops outside GitHub
# Actions, so this file still runs cleanly locally.
release:
  name: draugr
  version: dev
config:
  controllers:
    sca:
      enabled: true
    secrets:
      enabled: true
    sast:
      enabled: true
      # Draugr's own Go source, through Draugr's own sast control. Semgrep already runs here; the
      # point of adding gosec is that a Go security tool that does not run a Go analyser on itself
      # is asking users to take on faith something it will not do.
      #
      # It also scans differently from the gosec inside golangci-lint, which is what the lint job
      # runs. That one honours `//nolint:gosec`; standalone gosec reads `#nosec` and nothing else.
      # Every annotation in this tree is in golangci's dialect, so the findings below are cases
      # somebody already reviewed, in a syntax this scanner cannot see. They are excluded here
      # instead, which keeps one reason per exemption rather than two that can drift.
      gosec:
        enabled: true
    iac:
      enabled: true
    # Draugr is Apache-2.0 and distributed as a binary, so a copyleft dependency would be a real
    # problem for us rather than a hypothetical one. It reports nothing today — every dependency
    # in the tree is permissive — which is exactly the state worth having a gate protect.
    licenses:
      enabled: true
  # Rank our own findings by what is actually being exploited, not only by CVSS. `cache` reads
  # what `draugr feeds update` left and never touches the network during the scan, so the gate
  # stays reproducible — the CI job fetches the feeds as its own step, where an outage fails
  # visibly instead of quietly un-escalating everything.
  exploitability:
    kev: cache
    epss: cache

  # Replaces a .semgrepignore and a .gitleaks.toml: two files, two syntaxes, two discovery
  # rules. Worth knowing why that matters — a .semgrepignore *replaces* Semgrep's built-in
  # ignore list rather than extending it, so any file using one has to restate the defaults or
  # quietly un-ignore every _test.go. One place, one syntax, and the reason travels with the
  # rule.
  exclude:
    # gosec, run standalone rather than through golangci-lint. Scoped by rule *and* path in every
    # case but one, so a new instance in a file nobody has reviewed still fails the gate — the
    # value of running it at all is the finding nobody has seen yet.
    - rules:
        - "G204"
      reason: >-
        Subprocess launched with a variable. Every one of these is Draugr running a scanner:
        exec'ing third-party tools rather than linking or bundling them is a stated design
        principle, so the argv is assembled from a descriptor by construction. The argv itself is
        never shell-interpreted — os/exec takes a slice, not a string — and each call site already
        carries a reviewed annotation in golangci's dialect. Unscoped by path because a new
        subprocess launch in a new scanner is the same reviewed shape, and a rule that has to be
        edited for every scanner added is a rule that gets edited without being read.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "internal/cli/"
        - "internal/feeds/"
        - "internal/git/"
        - "internal/mcp/"
        - "internal/scanners/trivy_license.go"
        - "internal/schemagen/gen/"
        - "internal/tools/install.go"
        - "pkg/config/"
        - "pkg/saga/"
      rules:
        - "G304"
        - "G703"
      reason: >-
        Reading a file whose path came from a variable, where the variable is a path the operator
        named: the descriptor, the cache directory, a feed file, a report to diff against. A CLI
        that only opened compile-time constants would not be a CLI. Each of these call sites
        already carries a reviewed annotation, and the ones that resolve a path against a base
        check containment first. Scoped to the packages that read operator input, so the same
        rule firing anywhere else — a scanner reading a path it derived rather than was given —
        is a finding rather than a repeat.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "pkg/report/htmldata.go"
      rules:
        - "G203"
      reason: >-
        One call, wrapping a data: URI in template.URL to bypass contextual escaping that would
        otherwise reject it. Nothing from the scan reaches the markup: the scheme and MIME type
        are constants in that file, and the payload is base64, whose alphabet cannot terminate an
        HTML attribute. The argument is written out beside the code it defends.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "examples/"
        - "contrib/starter-workflow/"
      rules:
        - "yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag"
      reason: >-
        Workflow templates people copy. Pinning a starter workflow to a commit SHA makes it
        unreadable and stale on the next action release, and GitHub's own starter workflows use
        major tags for the same reason. Our real workflows, under .github/workflows/, are
        SHA-pinned and still scanned. Scoped to this one rule so a genuine problem in an example
        still surfaces.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "internal/scanners/mend_sca_test.go"
      rules:
        - "generic-api-key"
      reason: >-
        A parser test whose fixture is a verbatim block of Mend Unified Agent output, including
        the `Request Token:` line the parser has to find. The token is a made-up UUID, and it is
        a correlation id rather than a credential — it authenticates nothing and is worthless to
        anyone holding it. Trimming it out of the fixture would leave the test asserting that the
        parser handles output the agent does not produce.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "test/integration/repo_scan_test.go"
      rules:
        - "private-key"
      reason: >-
        The integration test writes a throwaway RSA key into a temporary repo so the secrets
        control has something real to find; a test asserting it finds nothing asserts nothing.
        The key material is fake and was never valid anywhere.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "pkg/publish/azure_pr_comment_test.go"
      rules:
        - "generic-api-key"
      reason: >-
        Table-driven fixtures for the test that proves a pipeline token goes in as a bearer and a
        personal access token as basic auth — sending one as the other is a 401 with nothing to
        explain it. One value is a structurally valid JWT whose payload is the empty object, the
        other is sixteen hex digits; both are literals in the table, neither was ever issued by
        anything. A credential-shaped string is what the test is about, so there is no version of
        it that does not look like this to a scanner.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

    - paths:
        - "pkg/report/htmldata.go"
      rules:
        - "go.lang.security.audit.net.unescaped-data-in-url.unescaped-data-in-url"
        - "go.lang.security.audit.xss.template-html-does-not-escape.unsafe-template-type"
      reason: >-
        Both flag the same line: dataURI returns template.URL, which tells html/template to emit
        the value verbatim. That is deliberate — contextual escaping rejects a data: URI outright,
        which is the right default because `data:text/html` in an href is a script-injection
        vector, and it is also what makes the HTML report's self-contained download links
        impossible any other way.

        It is safe because nothing that reaches the markup comes from the scan. Both callers pass
        a string literal for the MIME type, and the payload is base64 — an alphabet of letters,
        digits, '+', '/' and '=' — so it cannot contain a quote or an angle bracket to end the
        attribute. Whatever a scanner put in a finding is inside the encoded blob.

        The equivalent gosec rule (G203) is suppressed inline at the same line for the same
        reason. Scoped to this file and these two rules, so the same pattern anywhere else still
        fails the gate.
      acceptedBy: "Wilson Santos <wilson@draugr.dev>"

  reports:
    - format: sarif
  publishers:
    - kind: github        # repo/commit/ref/token from the GitHub Actions environment
components:
  # Classified rather than left to the fallback. An unclassified component is already treated as
  # public/critical so that findings surface rather than hide, so these values change no priority
  # today — which is the point of writing them down. A default we merely benefit from is one that
  # can be re-tuned underneath us, and the gate would weaken without a line changing here.
  #
  # public: the binary is downloadable and runnable by anyone, no sign-in, and what it reads is
  # not ours either — repositories it clones, scanner output it parses, threat-feed responses.
  #
  # critical: it runs inside other people's pipelines holding their credentials, and its whole
  # job is to be believed. A wrong PASS means somebody shipped thinking they had been checked,
  # which is a worse failure than the scan not running at all.
  - name: draugr
    exposure: public
    criticality: critical
    repositories:
      - url: .
