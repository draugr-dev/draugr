# The fields no example writes as a live key, each written once so the parity test changes it.
#
# Not an example: the values are placeholders, and several override what a CI environment would
# supply. TestEveryFieldIsHeldToBothReaders requires every descriptor field to appear live in the
# examples or here, because TestTheEditorAndDraugrAgreeOnEveryField can only change a field some
# document writes.
project: parity
components:
  - name: web
    exposure: public
    criticality: critical
    labels:
      team: payments
    images:
      - image: ghcr.io/acme/web:1.0
        signedBy: our-ci
    hosts:
      - name: api
        type: api
        url: https://api.example.com
        auth:
          type: header
          header: X-API-Key
          tokenEnv: API_KEY
    # Every format beside a source, in one list, so each key one of them reads is copied onto the
    # others and both readers judge it there. TestEveryVariantIsInTheCorpus requires each value.
    imports:
      - control: sast
        file: reports/tool.sarif
        format: sarif
        suppressions: count
      - control: sca
        file: reports/govulncheck.json
        format: govulncheck-json
        commit: 0123abc
      - control: sca
        file: reports/grype.json
        format: grype-json
      - control: sca
        file: reports/osv.json
        format: osv-scanner-json
      - control: sast
        file: reports/veracode.json
        format: veracode-pipeline-json
        commit: 0123abc
      - control: sast
        file: reports/gl-sast-report.json
        format: gitlab-sast
        commit: 0123abc
      - control: sca
        file: reports/gl-dependency-scanning-report.json
        format: gitlab-dependency-scanning
        commit: 0123abc
      - control: sca
        file: reports/jfrog-audit.json
        format: jfrog-simple-json
        commit: 0123abc
      - control: secrets
        file: reports/jfrog-audit.json
        format: jfrog-simple-json
        commit: 0123abc
      - control: iac
        file: reports/cx-results.json
        format: checkmarx-one-json
        suppressions: count
        commit: 0123abc
      - control: sca
        file: reports/mend-dep.json
        format: mend-json
        commit: 0123abc
      - control: images
        file: reports/twistcli.json
        format: twistcli-json
        commit: 0123abc
      - control: images
        file: reports/aqua.json
        format: aqua-json
        commit: 0123abc
      - control: sast
        file: reports/semgrep.json
        format: semgrep-json
        commit: 0123abc
      - control: sca
        file: reports/semgrep.json
        format: semgrep-json
        commit: 0123abc
      - control: sast
        source: github-code-scanning
        tokenEnv: CI_GITHUB_TOKEN
        repository: acme/web
      - control: sast
        source: sonarqube
        project: acme_web
        tokenEnv: CI_SONAR_TOKEN
        repository: acme/web
config:
  controls:
    provenance:
      signers:
        - name: our-ci
          images: ["ghcr.io/acme/*"]
          github:
            repository: acme/web
            workflow: .github/workflows/release.yml
            ref: refs/heads/main
  publishers:
    - kind: github
      repo: acme/web
      commit: 0123456789abcdef0123456789abcdef01234567
      ref: refs/heads/main
      tokenEnv: CI_GITHUB_TOKEN
    - kind: azure-pr-comment
      org: https://dev.azure.com/acme/
      project: shop
      repo: web
      pr: 12
      marker: "<!-- draugr report -->"
    - kind: gitlab-mr-comment
      # A numeric GitLab project id is text to both readers when quoted. Unquoted, YAML reads it as
      # a number, which the schema refuses and draugr validate warns about.
      repo: "4242"
    - kind: draugr-api
      url: https://draugr.acme.example
    - kind: github-issue
      branches: [main]
      split: none
      children: none
      select:
        components: [web]
        labels: { team: payments }
    # A split and a children apart, so each is copied onto the other's entry.
    - kind: gitlab-issue
      label: draugr-gitlab
      children: controls
    - kind: azure-work-item
      label: draugr-azure
      split: control
