# Example Saga, the declarative account of your app's security surface.
# Run it with:  draugr scan examples/draugr.saga.yaml
# (Requires Trivy on your PATH for the images control.)

project: my-app

release:
  version: "1.0"

# Global controller configuration. A controller only runs when it is enabled here
# (or enabled on a component below). Run `draugr controls` for the full list.
config:
  # What a scanner may do beyond reading a target. A scanner that would do more than read
  # declares it, and Draugr refuses to run it unless the effect is listed here, so nothing
  # below needs this line, and it is commented out.
  #
  # Two kinds require consent. `mutate` creates or changes something that outlives the scan:
  # kube-bench runs a short-lived Job in your cluster and deletes it, and the Mend connectors
  # create a project in your Mend account. `privilege` means a scanner needs more access than a
  # reader, the same kube-bench Job mounts host paths read-only to read a node's configuration.
  #
  # It applies to everything this descriptor points at. A scan that may do different things to
  # different targets is a second descriptor.
  # allowEffects: [mutate, privilege]

  # What fails the build.
  gate:
    # A run has one gate and it asks one of two questions.
    #
    # A priority band is the band a finding lands in for the component it was found in, which
    # folds in the exposure and criticality declared below. That is the ranking Draugr computes,
    # it is what the rest of this file exists to feed, and it is the default: leave this block out
    # and the gate is `failOn: P1`. It is written here anyway, because a gate nobody has seen
    # written is one people do not know they can move.
    #
    # A severity asks the other question, what the scanner called the flaw on its own terms, with
    # nothing about where it was found. Write `failOn: high` for that instead. Setting both is
    # refused rather than combined, because a verdict with two possible reasons cannot be read
    # back to the rule that produced it.
    failOn: P1               # P1 | P2 | P3 | P4, or critical | high | medium | low
    controls:
      licenses: P2           # one control, judged on a stricter band, refining failOn above
      # One threshold cannot serve every control: license policy is owned by legal and
      # vulnerability policy by security, and "fail on a forbidden license but only warn on a
      # medium CVE" is a reasonable position a single global threshold makes unsayable.
      #
      # The same vocabulary as `failOn` above, for the same reason. A severity here under a band
      # gate is refused rather than quietly compared against something it does not measure.

  # An inventory of what you ship, rendered alongside the findings.
  sbom:
    enabled: true            # one document per repository and image
    format: cyclonedx-json   # cyclonedx-json | cyclonedx-xml | spdx-json
    scope: both              # component (default) | project | both
    # `component` is one document per target, which is what a consumer asking about one image
    # wants. `project` is a single document covering everything this descriptor names, which is
    # what an auditor asking what the product is made of wants. They answer different questions,
    # so `both` renders each.

  controls:
    images:
      enabled: true          # container images (Trivy)
      # grype:
      #   enabled: true      # a second matcher beside Trivy, see sca.grypeFs below for the trade
    sca:
      enabled: true          # dependencies (Trivy fs)
      # retirejs:
      #   enabled: true      # retire.js, for JavaScript that never reaches a lockfile, a library
      #                      # pulled from a CDN, a vendored .js under static/, bundled output
      #                      # shipped without its manifest. A repository serving a five-year-old
      #                      # jQuery scans clean without it. Needs `npm install -g retire`
      # grypeFs:
      #   enabled: true      # Anchore Grype, beside Trivy rather than instead of it. Both sets of
      #                      # findings arrive in one report, and where two matchers disagree that
      #                      # is a statement about coverage neither makes alone.
      #                      # Two things to expect. Counts rise: a flaw both find is reported
      #                      # twice, once under each tool's rule id. And an exclusion needs a
      #                      # trailing `*` to cover both, Grype names the package in its rule id
      #                      # (CVE-2020-14343-pyyaml) where Trivy does not, so
      #                      # rules: ["CVE-2020-14343"] suppresses one and leaves the other
      # trivyFs:
      #   pkgTypes: [library]                        # skip the OS layer when a platform team owns it
      #   dbRepository: [registry.internal/trivy-db:2]   # an internal mirror, for runners with no
      #                                                  # route to a public registry
    secrets:
      enabled: true          # committed credentials (Gitleaks)
      # gitleaks:
      #   config: security/gitleaks.toml   # a ruleset shared across repositories; a
      #                                    # .gitleaks.toml committed in a repo is used anyway
      #   history: true      # also scan commit history, a secret removed from the tip is still
      #                      # fetchable, so it is still compromised. Needs a full clone, so it
      #                      # suits a nightly sweep more than a per-pull-request gate
    licenses:
      enabled: true          # license terms in the dependency tree (Trivy), in repositories AND
                             # in images, the question has no target kind in it, and an obligation
                             # inside an image you only run is still yours if you ship or serve it
      deny: ["AGPL-3.0-only", "SSPL-1.0"]   # fail the gate
      warn: ["GPL-3.0-only", "MPL-2.0"]     # report, do not fail
      # trivyLicense:
      #   full: true         # also read LICENSE files and source headers, not just package
      #                      # metadata. Finds licenses no manifest declares, vendored code, a
      #                      # pasted snippet, and walks every file to do it, so it suits a
      #                      # release or a diligence pass more than a per-pull-request gate
    sast:
      enabled: true          # first-party source (Semgrep)
      # gosec:
      #   enabled: true      # opt-in extra Go analyzer
      #   exclude: [G104]    # rules that do not apply here, for a finding you have judged,
      #                      # use config.exclude, which keeps it in the report as suppressed
      # semgrep:
      #   config: p/owasp-top-ten   # point Semgrep at your own ruleset
    iac:
      enabled: true          # Infrastructure-as-Code (Trivy config)
      # trivyConfig:
      #   checks: [security/checks]  # your own Rego, alongside Trivy's built-in checks
      #   namespaces: [user]         # the namespaces those checks declare
    headers:
      enabled: true          # HTTP security headers on hosts (native)
    tls:
      enabled: true          # TLS config + certificates on hosts (native)
    infrastructure:
      enabled: true          # Kubernetes cluster posture (native policies; kube-bench is opt-in).
                             # nightly-etl declares one below, and a surface no control looks at
                             # is a component that passes without being examined,
                             # `draugr doctor` reports that, and --fail-on-uncovered enforces it
    # threats:
    #   enabled: true        # whether a component's hosts appear on public lists of known-hostile
    #                        # addresses (URLhaus). It asks about the endpoints declared below
    #                        # rather than about the code, so it is the one control here that can
    #                        # fail on a repository nobody changed. Needs URLHAUS_AUTH_KEY, free
    #                        # from https://auth.abuse.ch/, which is why it is not enabled above
    #   virustotal:
    #     enabled: true      # a second opinion on the same hosts. Needs VIRUSTOTAL_API_KEY, and
    #                        # the free tier is licensed for non-commercial use only, so read the
    #                        # terms before enabling it in a company's pipeline
    # dast:
    #   enabled: true        # runtime probing of hosts (Nuclei), which sends real requests to a
    #                        # live endpoint. Commented because that is a thing to opt into
    #                        # deliberately, against a staging host, rather than something a
    #                        # descriptor turns on for everyone who copies it

  # What to render, and where to send it. Both lists are needed: a destination that cannot use
  # anything you render is refused when the descriptor loads.
  #
  # This is the shortest useful pair. `examples/reporting.saga.yaml` has every format, and every
  # publisher, with what each one needs.
  reports:
    - format: sarif          # the evidence, for code scanning and for `draugr diff`
    - format: markdown       # the same run as a document, for a pull-request comment
  publishers:
    - kind: file             # → ./.draugr/out/{results.sarif,report.md}
      dir: ./.draugr/out
    # - kind: github         # upload the SARIF to code scanning. Needs the `sarif` report above,
    #                        # and no-ops outside GitHub Actions, so it is safe to leave enabled

components:
  # A public web app: source, the image it builds, and the endpoint it serves.
  # exposure + criticality are what turn severities into P1–P4, see the prioritization docs.
  - name: web
    exposure: public         # public | authenticated | internal | restricted
    criticality: critical    # critical | important | supporting
    labels:
      team: platform         # free-form metadata, yours to use
    repositories:
      - url: https://github.com/acme/web.git
        revision: main       # branch, tag, or commit
        paths:               # optional: scan only these directories
          - services/web     #   root files (go.mod, Dockerfile, .trivyignore) come too
        ignore:              # optional: remove these, applied after paths
          - "**/testdata/**"
    images:
      - image: registry.example.com/acme/web:1.4.0
        digest: sha256:3f8e4a1c9d2b5e7a0c6f8b1d4e7a9c2f5b8e1d4a7c0f3b6e9d2a5c8f1b4e7a0c
        # builtBy: self is the default and does not need writing.
      - image: docker.io/library/nginx:1.27-alpine
        builtBy: upstream    # self (default) | upstream
        # An image this component runs and somebody else publishes. It decides what the report
        # tells you to do about a vulnerable package inside it: nobody can upgrade a library in an
        # image they do not build, so the fix is a newer image or a wait for whoever ships it.
        # Advice you cannot take, at the top of a list called "fix first", teaches you the list is
        # not worth reading, so declare this on every base and sidecar image you did not build.
    hosts:
      - name: web-ui-staging
        url: https://staging.app.example.com
        type: browser        # full browser security-header suite (default)
      - name: web-ui
        url: https://app.example.com
        type: browser

  # An internal API: no image here, and its endpoint is typed `api` so browser-only
  # header checks don't fire.
  # A component built from more than one repository, the shared client lives on its own, and
  # both are scanned. Every control runs once per repository, and the findings merge into one
  # component's result.
  - name: api
    exposure: internal
    criticality: important
    repositories:
      - url: https://github.com/acme/api.git
      - url: https://github.com/acme/api-client.git
    hosts:
      - name: api
        url: https://api.internal.example.com
        type: api            # skips browser-only headers
        auth:                # how to authenticate the probe; omit to probe anonymously
          type: bearer       # bearer (Authorization: Bearer <token>) | header
          tokenEnv: API_TOKEN   # the environment variable holding it, never the token itself
          # type: header
          # header: X-API-Key
        spec:                # drive the scan from an OpenAPI document instead of crawling
          path: api/openapi.yaml       # relative to where Draugr runs
          methods: [GET, HEAD, POST]   # empty means GET and HEAD only
          # A specification lists POST, PUT and DELETE too, and a scanner handed one will
          # exercise them. A scan of a staging API that deletes its own fixtures is a scan
          # nobody runs twice, so a write method is listed here or it is not exercised.

  # A component that is entirely somebody else's software: a vendor console we run and do not
  # maintain. `builtBy` on the component covers every target under it, so a repository or image
  # added later does not silently default back to being ours.
  #
  # It changes what the report tells you to do and nothing else, the findings keep their severity
  # and their band, are still counted, and still reach the gate. A denied license in the dependency
  # tree of a repository we do not publish is not a license we chose and not one we can swap out:
  # the answers are to stop using the console or to record an exception, and "change the code" is
  # neither.
  - name: analytics-console
    exposure: internal
    criticality: supporting
    builtBy: upstream        # self (default) | upstream, for every target below
    repositories:
      - url: https://github.com/vendor/console.git
      - url: https://github.com/acme/console-config.git
        builtBy: self        # …except this one, which we do publish
    images:
      - image: ghcr.io/vendor/console:4.2

  # A batch job: source only, and one control turned off just for this component.
  - name: nightly-etl
    exposure: restricted
    criticality: supporting
    repositories:
      - url: https://github.com/acme/etl.git
    controls:             # per-component overrides win over config.controllers
      tls:
        enabled: false       # no endpoint to probe
    infrastructure:
      - kind: kubernetes
        ref: prod-cluster
        namespaces: [etl]        # the namespaces this component owns; empty means the whole cluster
        operatedBy: provider     # self (default) | provider, for a managed service
        # It states a fact rather than a judgement: on a managed cluster the provider runs the
        # control plane, the API server and etcd. RBAC, Pod Security and network policy stay
        # yours, and those are usually the findings that matter, so this narrows what it
        # excuses rather than marking the whole cluster somebody else's problem.

# Links to human-performed controls, recorded alongside the automated ones.
references:
  - type: ThreatModel
    link: https://wiki.example.com/threat-models/acme

# Tip: string values support environment-variable substitution, e.g.
#   version: "${{ RELEASE_VERSION }}"
#   image: registry.example.com/acme/web:${{ IMAGE_TAG }}
# Referenced variables must be set in the environment (tokens in comments are ignored).
