# Example Saga — writing down why a rule is there.
# Run it with:  draugr validate examples/policy-with-reasons.saga.yaml
#
# Every value below is a decision, and the decision outlives whoever took it. A threshold, a
# priority band, a component's exposure — each of them changes what a scan reports and what fails
# a build, and none of them says why anybody wanted it. The person who meets the consequence six
# months later is rarely the one who chose it.
#
# So a rule is written as a value with a place for its reason:
#
#     failOnPriority:
#       value: P1
#       reason: >-                       # optional
#         …
#
# One shape whether or not anybody had something to say, so an editor can complete it, a reviewer
# knows where to look, and nobody has to learn that this field is written two ways.
#
# A comment cannot do this. Draugr merges a descriptor with its fragments and re-serializes the
# result before publishing it, and comments do not survive that — which is why the reasons in this
# header are decoration and the ones in the file below are evidence.
#
# What to expect:
#
#   * The scan behaves identically either way. A reason changes nothing about detection, ranking
#     or the verdict; what it changes is that whoever reads the report can see the argument for
#     the rule that produced a finding.
#
#   * The reason is optional. A rule with nothing to say is written without one and is complete.
#
#   * A misspelled key inside a rule is refused by name, because a rule somebody believes is in
#     force and is not is exactly what this is guarding against.

project: policy-with-reasons
release:
  version: "1.0"

config:
  gate:
    failOnPriority:
      value: P1
      reason: >-
        Severity rates a flaw in the abstract. Priority folds in what this descriptor says about
        the component it was found in, which is what a team that has classified its components
        wants to gate on.
    controls:
      licenses:
        value: critical
        reason: >-
          License policy is owned by legal and vulnerability policy by security. A denied license
          is a decision somebody has to take during working hours, not a build to stop at three
          in the morning.

  controllers:
    sca:
      enabled: true
    licenses:
      enabled: true
      # Per entry, because two licenses are rarely refused for the same reason — and an entry
      # with nothing to add is still an entry.
      deny:
        - id: AGPL-3.0-only
          reason: >-
            We ship binaries to customers. A network-copyleft dependency would put obligations on
            them that nobody has agreed to.
        - id: SSPL-1.0
      warn:
        - id: MPL-2.0
          reason: >-
            File-level copyleft, which is usually fine for what we do and occasionally is not.
            Worth somebody looking rather than a refusal.

components:
  # Two components, classified differently and for stated reasons — which is the case that shows
  # what priority is for. The same vulnerability in these two is not the same problem.
  - name: api
    exposure:
      value: public
      reason: >-
        Reachable from the internet with no sign-in, and it reads request bodies from anyone who
        sends one.
    criticality:
      value: critical
      reason: >-
        It holds the payment path. An outage stops revenue and a breach reaches cardholder data.
    repositories:
      - url: https://github.com/example/api.git

  - name: docs
    exposure:
      value: public
    criticality:
      value: supporting
      reason: >-
        A static site with no data of its own. The worst outage anybody gets is a stale page.
    repositories:
      - url: https://github.com/example/docs.git
