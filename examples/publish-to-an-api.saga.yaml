# Example Saga — sending runs somewhere they can be compared.
# Run it with:  draugr scan examples/publish-to-an-api.saga.yaml
#
# The terminal shows one scan. A server that keeps them shows the same findings across an
# organization and over time: which are new since last week, which have been there for months,
# which somebody accepted and who. That is the part a screenshot cannot show.
#
# Two environment variables and nothing in this file:
#
#   export DRAUGR_API_URL=https://draugr.acme.example
#   export DRAUGR_API_TOKEN=drgr_ci_…     # write-only, scoped to one project
#
# The token is deliberately not a descriptor field. A Saga is a file people commit, and a
# credential in one is a credential in their git history.
#
# The publisher is named for the protocol rather than for a product. Draugr Cloud implements it —
# hosted, or installed where you want it — and so can anything else: the three calls are in
# docs/guides/reports-and-publishers.md, and this publisher does not know which it is talking to.

project: my-app

release:
  version: "1.0"

config:
  controllers:
    sca:
      enabled: true
    secrets:
      enabled: true

  reports:
    # Both are required, and they travel differently.
    #
    # `json` is the run — the release, the verdict, the controls, the counts. Small, always, and it
    # goes in the request.
    #
    # `sarif` is the evidence, and it never goes through the API at all: the server answers with a
    # URL and Draugr uploads it straight there. At roughly 2.5 KB per finding, a descriptor
    # covering twenty images is around 20 MB before anything unusual happens, and a request body is
    # the wrong place for that.
    - format: json
    - format: sarif

  publishers:
    # Keep the file publisher alongside it. The server is where the history lives; the local files
    # are what a developer opens when a build fails.
    - kind: file
      dir: ./.draugr/out
    - kind: draugr-api
      # url: https://draugr.acme.example   # or $DRAUGR_API_URL, which is the usual way

components:
  - name: api
    exposure:
      value: public
    criticality:
      value: important
    repositories:
      - url: https://github.com/draugr-dev/draugr-demo
        revision: main
