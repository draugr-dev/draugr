# Applying a supplier's own exploitability analysis to your findings.
#
# Two components on purpose. A supplier's claim is an assertion about one artifact, and the
# failure worth designing against is one vendor's assurance quietly excusing a finding somewhere
# else — so `payments-api` sees Acme's document and `worker` does not, while the platform team's
# project-wide document reaches both.
project: payments

release:
  version: 2.4.0

config:
  controllers:
    sca:
      enabled: true
    images:
      enabled: true
  # One document covering everything an internal team ships, said once rather than repeated on
  # every component. Statements are still matched by package identifier, so this widens which
  # findings are considered — it does not let a statement claim more than it says.
  vexSources:
    - url: https://platform.internal/vex/current.openvex.json

components:
  - name: payments-api
    exposure: public
    criticality: critical
    repositories:
      - url: https://github.com/example/payments-api
    images:
      - image: registry.example.com/acme/api:1.4.0
    vex:
      # A document committed next to this descriptor. Resolved relative to where Draugr runs —
      # not to this file — which is the same rule every other path in a descriptor follows.
      - path: vendor/acme-api.openvex.json
      # A document the supplier publishes in their own repository. Cloned with whatever
      # credentials git already has on the machine; Draugr stores none, so no token goes here.
      # The ref is pinned because this claim is gated on: a branch moves, and a supplier revising
      # their analysis would change what the gate accepts with nothing here having changed.
      - repository:
          url: https://github.com/acme/security
          ref: v2026.08
          path: vex/api.openvex.json

  - name: worker
    exposure: internal
    criticality: supporting
    repositories:
      - url: https://github.com/example/worker
    # No `vex:` of its own. It still gets config.vexSources above, and none of Acme's claims.
