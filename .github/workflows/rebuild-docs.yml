name: Rebuild docs site

# Rebuild the docs site (Cloudflare Pages Deploy Hook) so its `next` docs match `main`.
#
# This runs automatically whenever `docs/` changes on `main`. It has to: the site's `next`
# version is *built from* `main`, but Cloudflare only rebuilds when something tells it to, and
# until this trigger existed the only things that did were a release and a human. That made
# `next` silently identical to `latest` — a docs page could sit merged and unpublished for as
# long as it took to cut the next release, which is exactly the staleness the versioned docs
# were meant to prevent. `latest` still comes from the newest release tag (see release.yml).
#
# workflow_dispatch stays for recovering a missed or failed build.
#
# Setup: create a Deploy Hook in the Cloudflare Pages project and add its URL as the
# CLOUDFLARE_PAGES_DEPLOY_HOOK repo secret. Unlike the release step (which no-ops when unset),
# this fails loudly if the secret is missing, since a rebuild was explicitly requested.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      # The reference docs are generated from the CLI's own flags and the Saga schema, so a
      # change to either dates the published page even when docs/ is untouched.
      - "internal/cli/**"
      - "pkg/saga/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger docs site rebuild
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK" && echo "docs rebuild triggered"
