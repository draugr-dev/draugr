name: Scorecard

# OpenSSF Scorecard: score Draugr's own repo against supply-chain security best practices,
# publish the results to code scanning, and (publish_results) to the OpenSSF API that backs the
# README badge. On-brand for a security tool — we hold ourselves to what we check (#116).

on:
  branch_protection_rule:
  schedule:
    - cron: "37 4 * * 1" # weekly, Monday 04:37 UTC
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF result to code scanning
      id-token: write # publish results to the OpenSSF API (badge)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Optional: a fine-grained PAT (Administration: read) lets Scorecard evaluate the
          # Branch-Protection check, which the default token can't read. Falls back to the
          # default token when the SCORECARD_TOKEN secret isn't set. See SECURITY/CONTRIBUTING.
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: scorecard
