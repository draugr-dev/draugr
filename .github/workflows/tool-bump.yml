# Propose a pinned scanner upgrade, once it has been shown to still work.
#
# A pin is not a version somebody forgot to update. It is the build Draugr checksum-verified and
# ran a scan with, so it moves when a bump has been tested rather than when one appears. Everything
# below exists to make "has been tested" mean something more than "the hashes matched".
#
# Proven one tool at a time, proposed together. Each tool gets a job of its own, so a release
# that breaks something is named by the job that failed and left out, and every tool that passed
# goes into one pull request. Its checks then run the integration suite with every new pin
# installed at once, which a pull request per tool never would.
#
# Nothing here merges anything. A scanner writing to somebody's machine at a new version is a
# decision a person makes.
name: Tool bump

on:
  schedule:
    # Weekly rather than daily. A scanner release is not an emergency, and a pull request nobody
    # has time to read is one people learn to close unread, which is worse than not opening it.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tool:
        description: "One tool, instead of everything that is behind"
        required: false
        type: string

# The patch ci.yml pins, for the reason given there.
env:
  GO_VERSION: "1.26.10"

permissions:
  contents: read

jobs:
  # What is behind, asked by Draugr itself rather than by a script written here. `tools outdated`
  # is the same code a person runs, so the answer a pull request is opened on is the answer they
  # would have got, and there is no second implementation of release-API handling to keep true.
  behind:
    name: What is behind
    runs-on: ubuntu-latest
    outputs:
      tools: ${{ steps.pick.outputs.tools }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Ask Draugr what is behind
        id: pick
        env:
          ONLY: ${{ inputs.tool }}
          # The listings are public and unauthenticated requests are rate-limited per runner IP,
          # which is shared. The job's own token lifts that and reaches nothing else.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          go run ./cmd/draugr tools outdated --json > /tmp/outdated.json
          if [ -n "$ONLY" ]; then
            list=$(jq -c --arg t "$ONLY" '[.[] | select(.tool == $t) | .tool]' /tmp/outdated.json)
          else
            list=$(jq -c '[.[] | select(.behind) | .tool]' /tmp/outdated.json)
          fi
          echo "tools=$list" >> "$GITHUB_OUTPUT"
          echo "any=$(jq -r 'length > 0' <<<"$list")" >> "$GITHUB_OUTPUT"
          jq -r '.[] | select(.error) | "could not ask \(.tool): \(.error)"' /tmp/outdated.json

  # One tool, bumped and then made to prove itself. `fail-fast: false` because these are
  # independent proposals and one bad release should not withdraw the others.
  propose:
    name: ${{ matrix.tool }}
    needs: behind
    if: needs.behind.outputs.any == 'true'
    runs-on: ubuntu-latest
    # Proves one tool and pushes nothing. What it proved goes to `assemble` as an artifact, so this
    # job holds no write access to the repository it is running a new third-party build in.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        tool: ${{ fromJSON(needs.behind.outputs.tools) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The sandbox the scan runs against, and the thing every measurement below is taken over.
      - name: Check out the demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: draugr-dev/draugr-demo
          path: demo
          # Read-only and public, and moved below, so there is nothing for the post step to clean.
          persist-credentials: false

      # Out of the working tree before anything else runs. Left inside it, the demo's markdown is
      # read by the repository's own tests, which check every pasted console block they find, and
      # `make gate` fails on a document that is not this repository's.
      - name: Move the demo out of the tree
        run: mv demo "$RUNNER_TEMP/demo"

      # What the current pins report, before anything moves. A bump that changes what a scanner
      # finds is the failure worth catching: a tool that silently stops reporting passes every
      # check that only asks whether it ran.
      - name: Measure the scan on the pinned versions
        id: before
        env:
          BASE: ${{ github.workspace }}
          TOOL: ${{ matrix.tool }}
        run: |
          set -euo pipefail
          go build -o /tmp/draugr-before ./cmd/draugr
          # From inside the demo, so its descriptor decides what is installed. At the repository
          # root `tools install` finds no descriptor and installs the zero-config set.
          cd "$RUNNER_TEMP/demo"
          # Whether the demo runs the tool at all. A tool its descriptor never reaches is not
          # tested by any scan below, and the pull request has to say so rather than imply it was.
          /tmp/draugr-before tools install --dry-run > /tmp/plan.txt
          if grep -E "^  $TOOL +" /tmp/plan.txt > /dev/null; then
            echo "exercised=true" >> "$GITHUB_OUTPUT"
          else
            echo "exercised=false" >> "$GITHUB_OUTPUT"
            echo "::warning::the demo's descriptor does not run $TOOL, so no scan here tests the new build"
          fi
          /tmp/draugr-before tools install -y
          /tmp/draugr-before feeds update
          # `-o` names a directory of reports, so the JSON is taken from stdout. `--no-gate`
          # because the demo fails its gate by design, and that verdict is not what is measured.
          /tmp/draugr-before scan --format json --no-gate --allow-scan-errors --no-publish > /tmp/before.json
          jq -S '[.controls[] | {control: .name, n: .total}] | sort_by(.control)' \
            /tmp/before.json > /tmp/before-shape.json
          # Every control that could not run, with its reasons, so the after-scans can be held to
          # more than "the same controls erred".
          jq -S '[.controls[] | select((.scanErrors // []) | length > 0) | {control: .name, errors: .scanErrors}]' \
            /tmp/before.json > /tmp/before-errors.json
          cat /tmp/before-shape.json /tmp/before-errors.json

      - name: Move the pin
        id: bump
        env:
          TOOL: ${{ matrix.tool }}
          # For the release listings `tools outdated` reads, as in `behind`.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          from=$(go run ./cmd/draugr tools outdated --json \
            | jq -r --arg t "$TOOL" '.[] | select(.tool == $t) | .pinned')
          echo "from=$from" >> "$GITHUB_OUTPUT"
          go run ./internal/tools/cmd/pinbump "$TOOL" | tee /tmp/bump.txt
          # The command goldens print the pins, so they move with one. Regenerated here, and the
          # pull request's diff shows exactly which rows changed.
          go test ./internal/cli -run TestCommandGolden -update >/dev/null
          version=$(go run ./cmd/draugr tools outdated --json \
            | jq -r --arg t "$TOOL" '.[] | select(.tool == $t) | .pinned')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A tool named by hand is often one that is already current, and a run that scans for
          # twenty minutes and then fails on an empty commit says nothing about why. Answered
          # here, where the answer is one line and costs nothing.
          if git diff --quiet; then
            echo "moved=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$TOOL is already at $version; nothing to propose"
            exit 0
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          # The entry belongs to the change, so it is written with it. A bump that reaches a
          # release with nothing in the notes is one users find by reading a diff.
          ./scripts/changelog.sh add changed <<EOF
          - **\`draugr tools install\` fetches $TOOL $version**, which was pinned at $from.
          EOF

      - name: Unit tests and the repository's own gate
        if: steps.bump.outputs.moved == 'true'
        # The spelling check fails rather than skips without misspell, so it is installed the way
        # ci.yml installs it.
        run: |
          go install github.com/client9/misspell/cmd/misspell@v0.3.4
          MISSPELL="$(go env GOPATH)/bin/misspell" make gate

      # The half a hash cannot tell you. Every tool installed for real at the new pin, then a full
      # scan of every control, three times against a cold cache.
      #
      # Cold and repeated deliberately. The failure this is built for was intermittent and only
      # appeared with several scanners racing for one cache directory on a machine that had never
      # run them: hashes correct, unit tests green, and one control erroring in roughly one run in
      # three. A single warm run proves none of that.
      - name: Install the new pin and scan, three times, cold
        if: steps.bump.outputs.moved == 'true'
        id: after
        env:
          TOOL: ${{ matrix.tool }}
          VERSION: ${{ steps.bump.outputs.version }}
          EXERCISED: ${{ steps.before.outputs.exercised }}
        run: |
          set -euo pipefail
          go build -o /tmp/draugr-after ./cmd/draugr
          cd "$RUNNER_TEMP/demo"
          /tmp/draugr-after tools install -y --force
          /tmp/draugr-after feeds update
          for run in 1 2 3; do
            rm -rf "$HOME/.cache/trivy" "$HOME/.cache/grype" "$HOME/nuclei-templates"
            echo "::group::cold run $run"
            out="/tmp/after-$run.json"
            /tmp/draugr-after scan --format json --no-gate --allow-scan-errors --no-publish > "$out"
            # A control that could not run has found nothing, and a bump that leaves one erroring
            # is not a bump to propose however clean the rest of the report is. Measured against
            # the pinned run, because some of the demo's controls cannot run on a hosted runner at
            # any version, and those say nothing about the bump.
            new=$(jq -c --slurpfile b /tmp/before-errors.json \
              '[.controls[] | select((.scanErrors // []) | length > 0) | .name] - [$b[0][].control]' "$out")
            if [ "$new" != "[]" ]; then
              echo "::error::a control errored on cold run $run with the new pin and not before it: $new"
              jq -r --argjson new "$new" '.controls[] | select(.name as $n | $new | index($n))
                | "\(.name): \(.scanErrors | join("; "))"' "$out"
              exit 1
            fi
            # A control that already erred for another reason must not hide the new build breaking
            # it too, so an error naming the bumped tool fails the run unless that control's errors
            # named it before the bump as well.
            named=$(jq -c --arg t "$TOOL" --slurpfile b /tmp/before-errors.json '
              ($b[0] | map({(.control): (.errors | any(test($t; "i")))}) | add // {}) as $was
              | [.controls[] | select(((.scanErrors // []) | any(test($t; "i"))) and (($was[.name] // false) | not)) | .name]' "$out")
            if [ "$named" != "[]" ]; then
              echo "::error::cold run $run: an error names $TOOL on a control where none did before: $named"
              jq -r --argjson n "$named" '.controls[] | select(.name as $c | $n | index($c))
                | "\(.name): \(.scanErrors | join("; "))"' "$out"
              exit 1
            fi
            # Where the report states a version for the tool, it has to be the new one. Otherwise
            # the scans ran some other build and the comparison below is between two old ones.
            if [ "$EXERCISED" = "true" ]; then
              stale=$(jq -c --arg t "$TOOL" --arg v "$VERSION" '[.scanners[]
                | select((.name | startswith($t)) or ((.version // "") | contains($t + "@")))
                | select(.version != null and (.version | contains($v) | not))
                | "\(.name) \(.version)"]' "$out")
              if [ "$stale" != "[]" ]; then
                echo "::error::cold run $run did not run $TOOL $VERSION: $stale"
                exit 1
              fi
            fi
            echo "::endgroup::"
          done
          jq -S '[.controls[] | {control: .name, n: .total}] | sort_by(.control)' \
            /tmp/after-1.json > /tmp/after-shape.json
          # What could not run, before and after, for the pull request to state rather than claim
          # that nothing erred.
          jq -r -s '
            def cell: (. // "ran") | gsub("\n"; " ") | gsub("\\|"; "\\|") | .[0:140];
            (.[0] | map({(.control): .errors[0]}) | add // {}) as $b
            | ([.[1].controls[] | select((.scanErrors // []) | length > 0) | {(.name): .scanErrors[0]}] | add // {}) as $a
            | (($b | keys) + ($a | keys) | unique) as $k
            | if ($k | length) == 0 then "Every control ran, before the bump and in each cold scan after it."
              else ("| control | before | after |", "|---|---|---|",
                    ($k[] | "| \(.) | \($b[.] | cell) | \($a[.] | cell) |"))
              end
          ' /tmp/before-errors.json /tmp/after-1.json > /tmp/errors.md
          cat /tmp/errors.md

      # A tool that finds nothing where it used to find plenty has broken in the way that looks
      # like success. Reported rather than enforced: a scanner release genuinely changes what it
      # reports, and a threshold that fails on every real improvement is one people route around.
      - name: What the bump changed about the findings
        if: steps.bump.outputs.moved == 'true'
        id: diff
        run: |
          set -euo pipefail
          echo "| control | before | after |" > /tmp/shape.md
          echo "|---|---|---|" >> /tmp/shape.md
          jq -r -s '
            (.[0] | map({(.control): .n}) | add // {}) as $b |
            (.[1] | map({(.control): .n}) | add // {}) as $a |
            (($b | keys) + ($a | keys) | unique)[] |
            "| \(.) | \($b[.] // 0) | \($a[.] // 0) |"
          ' /tmp/before-shape.json /tmp/after-shape.json >> /tmp/shape.md
          cat /tmp/shape.md
          # Loud where a control stopped reporting entirely, which is the one shape that is always
          # a defect rather than a difference of opinion between two scanner releases.
          silenced=$(jq -r -s '
            (.[0] | map({(.control): .n}) | add // {}) as $b |
            (.[1] | map({(.control): .n}) | add // {}) as $a |
            [($b | keys)[] | select(($b[.] > 0) and (($a[.] // 0) == 0))] | join(" ")
          ' /tmp/before-shape.json /tmp/after-shape.json)
          if [ -n "$silenced" ]; then
            echo "::error::a control reported findings before the bump and none after"
            exit 1
          fi

      # The proof, handed on. `assemble` re-applies the version named here rather than this job's
      # diff, because every bump regenerates the same goldens and two such diffs do not stack.
      - name: Hand the proof to the assembly
        if: steps.bump.outputs.moved == 'true'
        env:
          TOOL: ${{ matrix.tool }}
          FROM: ${{ steps.bump.outputs.from }}
          VERSION: ${{ steps.bump.outputs.version }}
          EXERCISED: ${{ steps.before.outputs.exercised }}
        run: |
          set -euo pipefail
          dir="/tmp/proof/$TOOL"
          mkdir -p "$dir"
          # The pin alone, for `stage` to put on a branch the integration suite can check out. It
          # applies cleanly there because it is the only change on that branch.
          git add internal/tools internal/cli/testdata/golden changelog.d
          git diff --cached --binary > "$dir/pin.patch"
          jq -n --arg tool "$TOOL" --arg from "$FROM" --arg to "$VERSION" --arg exercised "$EXERCISED" \
            '{tool: $tool, from: $from, to: $to, exercised: ($exercised == "true")}' > "$dir/meta.json"
          {
            echo "### \`$TOOL\` $FROM → $VERSION"
            echo
            if [ "$EXERCISED" = "true" ]; then
              echo "The demo's descriptor runs \`$TOOL\`, and three cold scans ran it at $VERSION."
            else
              echo "**Not run by the demo.** Its descriptor does not use \`$TOOL\`, so no scan here"
              echo "tested the new build. This pull request's integration suite is what does."
            fi
            echo
            # Only the rows that moved. Every tool in a batch scanned the same demo, so the full
            # table repeats for each one, and the rows that did not move hide the ones that did.
            if [ "$EXERCISED" = "true" ]; then
              changed=$(awk -F' *[|] *' 'NR > 2 && $3 != $4' /tmp/shape.md)
              if [ -n "$changed" ]; then
                echo "Findings that changed, by control:"
                echo
                head -n 2 /tmp/shape.md
                echo "$changed"
              else
                echo "No control's finding count changed."
              fi
              echo
            fi
            echo "Controls that could not run:"
            echo
            cat /tmp/errors.md
          } > "$dir/section.md"
          cat "$dir/section.md"

      - name: Upload the proof
        if: steps.bump.outputs.moved == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proof-${{ matrix.tool }}
          path: /tmp/proof/${{ matrix.tool }}
          retention-days: 7

  # A branch per proven tool, holding that tool's pin and nothing else, for the integration suite
  # to check out. One job rather than a matrix, so its output is the list of tools that have one.
  #
  # Pushed with GITHUB_TOKEN, which starts no workflow, so the branches cost nothing until
  # `integrate` asks for them, and `assemble` deletes them.
  stage:
    name: A branch for each proven pin
    needs: [behind, propose]
    if: always() && needs.behind.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tools: ${{ steps.push.outputs.tools }}
      any: ${{ steps.push.outputs.any }}
    steps:
      - name: Collect the proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-*
          path: /tmp/proof
        continue-on-error: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Push one branch per proof
        id: push
        run: |
          set -euo pipefail
          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          base=$(git rev-parse HEAD)
          staged=()
          for meta in /tmp/proof/*/meta.json; do
            [ -f "$meta" ] || continue
            tool=$(jq -r .tool "$meta")
            to=$(jq -r .to "$meta")
            git checkout --quiet --detach "$base"
            git apply --index "$(dirname "$meta")/pin.patch"
            git commit --quiet -m "Proof: $tool at $to"
            git push --quiet origin "HEAD:refs/heads/tool-bump/proof/$tool-$GITHUB_RUN_ID"
            staged+=("$tool")
          done
          list=$(printf '%s\n' "${staged[@]}" | jq -R . | jq -cs 'map(select(. != ""))')
          echo "tools=$list" >> "$GITHUB_OUTPUT"
          echo "any=$(jq -r 'length > 0' <<<"$list")" >> "$GITHUB_OUTPUT"
          echo "staged: $list"

  # The integration suite against each tool's branch, the two jobs every pull request runs. A tool
  # that fails here is left out of the pull request like one that failed its proof, rather than
  # turning the whole batch red, and the demo cannot stand in for this: its descriptor does not run
  # every tool, and this suite runs each one.
  integrate:
    name: integrate ${{ matrix.tool }}
    needs: stage
    if: always() && needs.stage.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.stage.outputs.tools) }}
    uses: ./.github/workflows/integration.yml
    with:
      ref: tool-bump/proof/${{ matrix.tool }}-${{ github.run_id }}
      suite: pull-request
      label: ${{ matrix.tool }}
    # What any job in the called workflow asks for, whether or not it runs: a called workflow that
    # asks for more than its caller grants fails at startup with no job and no message.
    permissions:
      contents: read
      issues: write
      id-token: write

  # One pull request for every tool that passed its proof and its integration run. Each was
  # proven alone above, so a failure still names its tool; together here, so the integration suite
  # on the pull request installs every new pin at once and catches two releases that do not work
  # beside each other. A tool that failed is left out and has its issue.
  assemble:
    name: One pull request for every proven bump
    needs: [behind, propose, stage, integrate]
    if: always() && needs.behind.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Collect the proofs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: proof-*
          path: /tmp/proof
        continue-on-error: true

      # A tool counts only when both of its integration jobs passed. Read from the run's jobs,
      # because a matrix of called workflows reports one result for all of them.
      - name: Keep the tools the integration suite passed
        id: any
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" --jq '.jobs[] | "\(.name)\t\(.conclusion)"' > /tmp/jobs.tsv
          for meta in /tmp/proof/*/meta.json; do
            [ -f "$meta" ] || continue
            tool=$(jq -r .tool "$meta")
            passed=$(awk -F'\t' -v t="integrate $tool / " 'index($1, t) == 1 && $2 == "success"' /tmp/jobs.tsv | wc -l)
            if [ "$passed" -ne 2 ]; then
              echo "::warning::$tool passed its proof and not the integration suite, so it is left out"
              echo "$tool" >> /tmp/left-out.txt
              rm -rf "$(dirname "$meta")"
            fi
          done
          if compgen -G "/tmp/proof/*/meta.json" > /dev/null; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no tool passed its proof and the integration suite, so there is nothing to propose"
          fi

      - name: Delete the proof branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for ref in $(gh api "repos/$GH_REPO/git/matching-refs/heads/tool-bump/proof/" --jq '.[].ref' | grep -- "-$RUN_ID\$" || true); do
            gh api -X DELETE "repos/$GH_REPO/git/$ref" && echo "deleted $ref"
          done

      # Not GITHUB_TOKEN: GitHub raises no workflow-starting event for anything it did, so a pull
      # request opened with it would sit with no checks having run on it, the integration suite
      # included, which is the half of the proof this pull request exists to get.
      - name: Mint an installation token
        if: steps.any.outputs.any == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Requested by name, so the token holds what this job uses and nothing else the App is
          # granted. Contents pushes the bump branch, and pull requests opens its pull request.
          # The commit stages internal/tools, the command goldens and changelog.d by name, never a
          # workflow file.
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.any.outputs.any == 'true'
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.any.outputs.any == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Move every proven pin
        if: steps.any.outputs.any == 'true'
        id: pins
        run: |
          set -euo pipefail
          : > /tmp/bump.txt
          for meta in /tmp/proof/*/meta.json; do
            tool=$(jq -r .tool "$meta")
            to=$(jq -r .to "$meta")
            from=$(jq -r .from "$meta")
            # The version the proof ran, named, so an upstream that published again in the
            # meantime cannot put an unproven build in this pull request.
            go run ./internal/tools/cmd/pinbump "$tool" "$to" | tee -a /tmp/bump.txt
            ./scripts/changelog.sh add changed <<EOF
          - **\`draugr tools install\` fetches $tool $to**, which was pinned at $from.
          EOF
          done
          go test ./internal/cli -run TestCommandGolden -update >/dev/null
          echo "tools=$(jq -r -s 'map("\(.tool) \(.to)") | join(", ")' /tmp/proof/*/meta.json)" >> "$GITHUB_OUTPUT"

      - name: The repository's own gate, with every pin moved
        if: steps.any.outputs.any == 'true'
        run: |
          go install github.com/client9/misspell/cmd/misspell@v0.3.4
          MISSPELL="$(go env GOPATH)/bin/misspell" make gate

      - name: Open the pull request
        if: steps.any.outputs.any == 'true'
        env:
          TOOLS: ${{ steps.pins.outputs.tools }}
          FAILED: ${{ needs.propose.result }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="bump/scanners-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          git checkout -b "$branch"
          git add internal/tools internal/cli/testdata/golden changelog.d
          git commit -m "Move scanner pins: $TOOLS" -m "$(cat /tmp/bump.txt)"
          git push -u origin "$branch"
          {
            echo "Moves each pinned tool below to the release its upstream publishes. Every hash is of"
            echo "the bytes at the URL beside it."
            echo
            echo "Each tool was proven on its own first, in [this run]($RUN_URL), with its pin alone:"
            echo "\`make gate\`, three scans of the demo against a cold cache, and the integration suite"
            echo "(the kind cluster and the sealed scenarios). This pull request's checks run that suite"
            echo "again with every new pin installed together."
            if [ "$FAILED" != "success" ] || grep -q . /tmp/left-out.txt 2>/dev/null; then
              echo
              echo "At least one tool failed its proof or the integration suite and is not here. Each has an issue labeled"
              echo "\`tool-bump\` on a scheduled run, and the run's log says why."
            fi
            echo
            echo "A difference in the findings is not automatically wrong, since a scanner release changes"
            echo "what it reports. A control dropping to zero is, and fails the proof rather than reaching here."
            echo "Only linux/amd64 was exercised. The other platforms are pinned by hash and unrun."
            for section in /tmp/proof/*/section.md; do
              echo
              cat "$section"
            done
          } > /tmp/body.md
          gh pr create --title "Move scanner pins: $TOOLS" --body-file /tmp/body.md

  # A scheduled run that fails tells nobody: the workflow belongs to no pull request, and a red
  # row in the Actions tab is read by whoever happens to open it. So a failure raises an issue,
  # one per tool, and the next run that proves that tool closes it. A bump that fails its proof is
  # a scanner release Draugr cannot take yet, and that is worth knowing as much as a broken job.
  notify:
    name: A failed proposal raises an issue
    needs: [behind, propose, stage, integrate, assemble]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the issues
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout, so `gh` has no clone to infer the repository from.
          GH_REPO: ${{ github.repository }}
          BEHIND: ${{ needs.behind.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          label="tool-bump"
          gh label create "$label" --description "A scheduled scanner bump failed" --color B60205 2>/dev/null || true

          # The job names are the matrix values, which are the tool names, plus the one that asks
          # what is behind. A failure there means no tool was tried at all, so it is a tool of its own.
          jobs=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name != "A failed proposal raises an issue") | "\(.name)\t\(.conclusion)"' \
            | awk -F'\t' '
                # A tool'"'"'s integration jobs are named "integrate <tool> / <job>", and they count
                # toward that tool'"'"'s issue: one failure in any of its jobs is a failure.
                { n = $1; sub(/^integrate /, "", n); sub(/ \/ .*$/, "", n)
                  if ($2 == "failure") c[n] = "failure"
                  else if ($2 == "success" && c[n] != "failure") c[n] = "success"
                  else if (!(n in c)) c[n] = $2 }
                END { for (n in c) print n "\t" c[n] }')

          # A tool's issue is any open one under the label whose title is the one below or starts with
          # the tool's name, as `gosec 2.30.0: …` does. A person who reads a failed run's diff files
          # what it means under the tool's name, and matching only this run's own title would open a
          # second issue beside theirs on the next failure. The oldest takes the comment, and a
          # proven run closes all of them.
          open=$(gh issue list --label "$label" --state open --limit 200 --json number,title)
          issues_for() {
            jq -r --arg t "Scheduled bump failed: $1" --arg p "$1 " \
              'sort_by(.number) | .[] | select(.title == $t or (.title | startswith($p))) | .number' <<<"$open"
          }

          while IFS=$'\t' read -r name conclusion; do
            [ -n "$name" ] || continue
            title="Scheduled bump failed: $name"
            existing=$(issues_for "$name")
            case "$conclusion" in
              failure)
                if [ -n "$existing" ]; then
                  gh issue comment "$(head -1 <<<"$existing")" --body "Still failing: [run]($RUN_URL)."
                else
                  gh issue create --label "$label" --title "$title" --body "$(cat <<BODY
          The weekly scanner bump for \`$name\` failed: [run]($RUN_URL).

          Either the new release did not pass the proof (\`make gate\`, three cold scans of the demo, no control newly erroring, no control dropping to zero, then the integration suite with its pin alone), or the job itself broke before it reached the proof. The run's log says which.

          Where the sealed scenarios failed, the run's \`sealed-golden-diff-$name\` artifact holds what the new release reports beside the goldens. Accepting it is running \`-update-sealed\` on a branch, once the difference reads as the release's intended change rather than a regression.

          This issue closes itself when a scheduled run proves \`$name\` again.
          BODY
          )"
                fi
                ;;
              success)
                for n in $existing; do
                  gh issue comment "$n" --body "Proven again: [run]($RUN_URL). Closing."
                  gh issue close "$n"
                done
                ;;
            esac
          done <<<"$jobs"

          # Nothing behind skips the matrix entirely, which is also a pass for every open issue.
          if [ "$BEHIND" = "success" ] && [ -z "$(grep -v '^What is behind' <<<"$jobs" || true)" ]; then
            for n in $(gh issue list --label "$label" --state open --json number --jq '.[].number'); do
              gh issue comment "$n" --body "Nothing is behind as of [this run]($RUN_URL). Closing."
              gh issue close "$n"
            done
          fi
