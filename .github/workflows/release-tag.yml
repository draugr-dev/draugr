# Tag main when the CHANGELOG says a version was released and no tag says so yet.
#
# The state is the file, not a label, a branch name or a commit message. "The newest released
# section has no tag" is a fact anyone can check by reading two things, it survives a squash
# merge renaming the commit, and it is idempotent: a second run finds the tag and does nothing.
# A convention encoded in a commit subject would be none of those.
#
# It also means the manual flow keeps working unchanged. Promoting the CHANGELOG by hand and
# merging it tags the release too — the automation is the same act, not a second path with its
# own rules.
#
# It tags, then calls release.yml rather than waiting for the tag to trigger it.
#
# GitHub starts no workflow from an event created with the built-in GITHUB_TOKEN, so the tag this
# pushes fires nothing on its own — the run would be green, the tag real, and no release would
# exist. A reusable-workflow call is a direct invocation rather than an event and is not subject
# to that rule, which is the same route demo-assets takes instead of listening for
# `release: published`.
#
# release.yml still gates on the self-scan and the integration suite, run against the tag, before
# anything is built or published. So this being wrong costs a tag and not an artifact.
name: Release tag

on:
  push:
    branches: [main]
    # Nothing else can change which version is released, and a scan of every push for a file that
    # changes a few times a month is work nobody needs.
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Tag a promoted release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
    outputs:
      # Empty when the newest released section already had a tag, which is what makes a second run
      # of this workflow do nothing rather than re-release.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to know which versions already have one

      - name: Tag the newest released section, if it has no tag
        id: tag
        run: |
          set -euo pipefail

          version=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          if [ -z "$version" ]; then
            echo "::error::no released section in CHANGELOG.md"; exit 1
          fi
          echo "newest released section: $version"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to do."
            exit 0
          fi

          # The notes have to be non-empty, because they become the release body. A tag whose
          # notes are blank publishes a release nobody can read, and the tag is the part of this
          # that cannot be withdrawn once anyone has fetched it.
          notes=$(./scripts/changelog.sh show "$version")
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::[$version] has no notes — refusing to tag a release nobody can describe."
            exit 1
          fi

          summary=$(printf '%s\n' "$notes" | grep -m1 '^- ' | sed 's/^- //; s/\*\*//g; s/\.$//' | cut -c1-72)

          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          git tag -a "v$version" -m "v$version — ${summary:-see CHANGELOG.md}"
          git push origin "v$version"
          echo "tagged v$version"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

  # Called rather than left to the tag's own push event, which never fires — see the note at the
  # top. Skipped when `tag` is empty, which is how a re-run of this workflow finds the version
  # already tagged and stops instead of releasing it twice.
  release:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    # Everything release.yml's own jobs declare, because a called workflow cannot request more
    # than its caller granted and the shortfall fails the run at startup with no message.
    # TestCallersGrantEveryPermissionTheCalledWorkflowDeclares keeps this in step.
    permissions:
      contents: write
      id-token: write
      attestations: write
      security-events: write
      pull-requests: write
      issues: write
    # Named, not inherited: `secrets: inherit` would pass every secret this repository holds and
    # keep doing so as more are added, which is a widening nobody comes back to review.
    secrets:
      CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      MCP_PUBLISHER_DNS_KEY: ${{ secrets.MCP_PUBLISHER_DNS_KEY }}
