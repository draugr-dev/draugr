# Tag main when the CHANGELOG says a version was released and no tag says so yet.
#
# The state is the file, not a label, a branch name or a commit message. "The newest released
# section has no tag" is a fact anyone can check by reading two things, it survives a squash
# merge renaming the commit, and it is idempotent: a second run finds the tag and does nothing.
# A convention encoded in a commit subject would be none of those.
#
# It also means the manual flow keeps working unchanged. Promoting the CHANGELOG by hand and
# merging it tags the release too — the automation is the same act, not a second path with its
# own rules.
#
# Tagging is all this does, and the tag alone does not publish. That is a constraint rather than
# an oversight, and it has two layers.
#
# GitHub starts no workflow from an event created with the built-in GITHUB_TOKEN, so the tag this
# pushes fires nothing. The obvious way round it is to call release.yml as a reusable workflow —
# an invocation rather than an event, which is how demo-assets escapes the same rule.
#
# That does not work here, and the reason is the whole point of the release. **A called workflow's
# OIDC identity is the caller's ref.** Artifacts signed from a call made on `main` carry
# `release.yml@refs/heads/main`, and `install.sh` and `action.yml` both verify
# `release.yml@refs/tags/v.*` — so the signature would not match the identity every user is told
# to check, and `curl … | sh` would refuse to install the release. Keyless signing tied to a tag
# requires a run triggered by that tag.
#
# So publishing needs a run whose own ref is the tag. Any of:
#
#   - `gh workflow run Release --ref vX.Y.Z -f tag=vX.Y.Z` — one command, no new credential. The
#     run's ref is the tag, so the certificate says so. **`--ref` is the load-bearing part**; a
#     dispatch without it runs on the default branch and signs as `main`.
#   - push the tag from a machine with a personal credential, which is what the release runbook
#     describes.
#   - configure a PAT or GitHub App token on the checkout below, so the tag it pushes is an event
#     GitHub will act on. The only fully automatic option, and the one that costs a secret.
#
# Said here rather than left to be rediscovered, because everything about a run that stops at the
# tag looks successful: green workflow, real tag, no release.
name: Release tag

on:
  push:
    branches: [main]
    # Nothing else can change which version is released, and a scan of every push for a file that
    # changes a few times a month is work nobody needs.
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Tag a promoted release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to know which versions already have one

      - name: Tag the newest released section, if it has no tag
        run: |
          set -euo pipefail

          version=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          if [ -z "$version" ]; then
            echo "::error::no released section in CHANGELOG.md"; exit 1
          fi
          echo "newest released section: $version"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to do."
            exit 0
          fi

          # The notes have to be non-empty, because they become the release body. A tag whose
          # notes are blank publishes a release nobody can read, and the tag is the part of this
          # that cannot be withdrawn once anyone has fetched it.
          notes=$(./scripts/changelog.sh show "$version")
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::[$version] has no notes — refusing to tag a release nobody can describe."
            exit 1
          fi

          summary=$(printf '%s\n' "$notes" | grep -m1 '^- ' | sed 's/^- //; s/\*\*//g; s/\.$//' | cut -c1-72)

          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          git tag -a "v$version" -m "v$version — ${summary:-see CHANGELOG.md}"
          git push origin "v$version"
          echo "tagged v$version"
          echo "::notice::Tagged v$version. It does not publish on its own: run" \
            "\`gh workflow run Release --ref v$version -f tag=v$version\`. The --ref is what makes" \
            "the signature say refs/tags/v$version, which is the identity install.sh verifies."
