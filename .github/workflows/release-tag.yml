# Tag main when the CHANGELOG says a version was released and no tag says so yet.
#
# The state is the file, not a label, a branch name or a commit message. "The newest released
# section has no tag" is a fact anyone can check by reading two things, it survives a squash
# merge renaming the commit, and it is idempotent: a second run finds the tag and does nothing.
# A convention encoded in a commit subject would be none of those.
#
# It also means the manual flow keeps working unchanged. Promoting the CHANGELOG by hand and
# merging it tags the release too — the automation is the same act, not a second path with its
# own rules.
#
# Tagging is all this does, and the tag is what publishes.
#
# The tag is pushed with a GitHub App installation token rather than GITHUB_TOKEN, and that one
# detail is the whole mechanism. GitHub raises no workflow-starting event for anything
# GITHUB_TOKEN did, so a tag pushed with it would sit there while everything reported success.
# Pushed with the App's token it is an ordinary push, release.yml triggers on it, and — the part
# that matters most — the run's own ref is the tag.
#
# That last point is why release.yml is triggered rather than called. A reusable workflow runs
# under its **caller's** ref, so a call made from `main` signs artifacts
# `release.yml@refs/heads/main`, while install.sh and action.yml both verify
# `release.yml@refs/tags/v.*`. Such a release publishes and then refuses to install. Keyless
# signing tied to a tag needs a run triggered by that tag, and there is no way around it.
# TestReleaseIsNotCallable keeps that true.
#
# The state is the file, not a label, a branch name or a commit message. "The newest released
# section has no tag" is a fact anyone can check by reading two things, it survives a squash
# merge renaming the commit, and it is idempotent: a second run finds the tag and does nothing.
#
# release.yml gates on the self-scan and the integration suite, run against the tag, before
# anything is built. So this being wrong costs a tag and not an artifact.
name: Release tag

on:
  push:
    branches: [main]
    # Nothing else can change which version is released, and a scan of every push for a file that
    # changes a few times a month is work nobody needs.
    paths:
      - CHANGELOG.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    name: Tag a promoted release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create and push the tag
    steps:
      # A token that is not GITHUB_TOKEN, because GitHub raises no workflow-starting event for
      # anything GITHUB_TOKEN did and refuses it `gh pr create` unless the repository allows
      # Actions to create *and approve* pull requests — one switch, and approval is not something
      # to grant a workflow in order to fix a papercut.
      #
      # An App rather than a personal token: the installation token lives for an hour, is scoped
      # to this repository, carries no person's identity, and cannot quietly expire between
      # releases the way a PAT does.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every tag, to know which versions already have one
          # The token is what makes the tag below an event GitHub acts on, which is the whole
          # mechanism: release.yml triggers on the tag push, so the run's ref is the tag, so the
          # keyless certificate says `release.yml@refs/tags/vX.Y.Z` — the identity install.sh and
          # action.yml verify. Push it with GITHUB_TOKEN and nothing runs at all.
          token: ${{ steps.app.outputs.token }}

      - name: Tag the newest released section, if it has no tag
        run: |
          set -euo pipefail

          version=$(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | head -1 | tr -d '#[] ')
          if [ -z "$version" ]; then
            echo "::error::no released section in CHANGELOG.md"; exit 1
          fi
          echo "newest released section: $version"

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged — nothing to do."
            exit 0
          fi

          # The notes have to be non-empty, because they become the release body. A tag whose
          # notes are blank publishes a release nobody can read, and the tag is the part of this
          # that cannot be withdrawn once anyone has fetched it.
          notes=$(./scripts/changelog.sh show "$version")
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::[$version] has no notes — refusing to tag a release nobody can describe."
            exit 1
          fi

          # Derived by the script, not here. A pipeline in a workflow cannot be tested, and this
          # one failed silently when a section's entries were written as paragraphs rather than
          # list items: its grep matched nothing, `pipefail` failed the step, and the tag was not
          # pushed with nothing said about why.
          summary=$(./scripts/changelog.sh summary "$version")

          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          git tag -a "v$version" -m "v$version — ${summary:-see CHANGELOG.md}"
          git push origin "v$version"
          echo "tagged v$version"
          echo "::notice::Tagged v$version. The push starts the Release workflow, which gates on" \
            "the self-scan and the integration suite before it publishes anything."
