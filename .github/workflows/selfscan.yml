name: Self-scan

# Dogfood: run the latest released Draugr against this repo (see issue #64).
# Uses a stable release (not a source build) — the way real users consume Draugr.

# A required check, so the job always runs and skips its *steps* on a documentation-only change.
# paths-ignore would skip the job outright, and a required check that never runs leaves the pull
# request waiting forever on a status that will not arrive.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml before anything is built. A release is a claim about the whole
  # artifact, so the tree being tagged has to be acceptable as a whole — and asking that here
  # rather than duplicating the job keeps one definition of the gate.
  #
  # `mode: auto` resolves to a full scan rather than a diff, because a tag push is not a pull
  # request. That is the mode a release wants: a diff answers whether a change made things worse,
  # which is not what shipping an artifact asserts.
  workflow_call:
    inputs:
      ref:
        description: >-
          What to check out. Defaults to the caller's own commit, which is right for every path
          but a release: there the tree being judged is the tag, and "was this exact tree
          acceptable" has one honest answer.
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  # Pinned to an exact patch for the reason ci.yml gives: govulncheck reports stdlib
  # vulnerabilities fixed in a patch release, and a floating minor resolves to whatever
  # setup-go's manifest has today. Keep this in step with ci.yml.
  GO_VERSION: "1.26.6"

jobs:
  # Mirrors ci.yml: one cheap job decides whether there is anything to scan, and the scan job
  # reports either way so the required check always resolves.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # Need the base commit to diff against; a shallow clone has only the tip.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            # A push to main, or anything without a PR base: assume code and scan.
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Anything that is not documentation is treated as code. Erring this way means a new
          # kind of file gets scanned rather than silently skipped — which is the whole point of
          # a gate.
          if git diff --name-only "$base" HEAD \
             | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed — the self-scan will report without running."
          fi

  selfscan:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publish the self-scan SARIF to GitHub code scanning (#64)
      pull-requests: write # the github publisher posts the diff summary as a PR comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
        if: needs.changes.outputs.code == 'true'

      # Which release the action will download, resolved here so the tool cache can be keyed on
      # it. The pinned scanner versions travel with the Draugr build that provisions them, so a
      # new release must re-provision rather than reuse the previous release's binaries.
      - name: Resolve the release under test
        id: release
        if: needs.changes.outputs.code == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo draugr-dev/draugr --json tagName -q .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Provisioning four scanners from their upstreams takes most of a minute on every run, and
      # the binaries are identical until the release changes.
      #
      # Safe to restore because `draugr tools install` does not trust what it finds: it re-hashes
      # each binary against the checksum it recorded when it wrote it, and a mismatch reinstalls.
      # A cache entry cannot smuggle in a modified scanner — it can only save the download.
      - name: Cache the provisioned scanners
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.draugr/bin
          key: draugr-tools-${{ runner.os }}-${{ steps.release.outputs.tag }}

      # Content-hash caching is the thing Draugr offers users so an unchanged component is never
      # re-scanned, and this job was not using it — every run re-scanned a tree that had barely
      # moved. Dogfooding it here is the point of the job.
      #
      # A stale entry cannot outlive the data behind it: a scanner that folds its vulnerability-DB
      # version into the cache key (Trivy does) misses the moment that database changes, so a
      # cached pass cannot hide a CVE published since. The action already refuses to *write* this
      # cache from a fork's pull request, so an untrusted branch cannot decide what the next run
      # on main reads.
      - name: Cache scan results
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .draugr/cache
          key: draugr-selfscan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            draugr-selfscan-${{ runner.os }}-

      # govulncheck is the one analyzer this Saga names that Draugr does not distribute, so the
      # action's `tools: true` step below will never provision it — `draugr doctor` says as much
      # and names this install line instead. Before the scan rather than after, unlike the
      # provisioned scanners: this one does not need Draugr on PATH, and a control whose scanner is
      # missing reports an error, so getting it here keeps the failure about the code.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install govulncheck
        if: needs.changes.outputs.code == 'true'
        # Pinned, like every other tool this pipeline runs. Keep in step with ci.yml.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Draugr self-scan
        if: needs.changes.outputs.code == 'true'
        id: draugr
        # This step blocks, and must keep blocking. `continue-on-error` here would make the
        # check green whatever the scan found, and a gate that cannot fail is indistinguishable
        # from one that passed — the failure mode Draugr exists to prevent. It would hide a
        # reachable CVE in a dependency for as long as nobody read the log.
        #
        # Gating on P1 rather than on any finding: P1 is "high or critical severity, weighted by
        # the component's exposure and criticality", which is the bar we ask users to hold. A
        # gate that trips on every medium gets switched off, and then protects nothing.
        #
        # Dogfood our own first-party action (the local checkout, so PRs test action changes
        # before they ship). The action downloads + cosign-verifies the latest release, provisions
        # the scanners and runs the scan — the whole job, and the whole of what a user gets.
        #
        # The Saga's `github` publisher uploads the SARIF to code scanning as part of the scan
        # — dogfooding the OSS Publisher instead of a separate upload-sarif step (#58). The
        # action forwards GITHUB_TOKEN; the job grants `security-events: write` above.
        uses: ./
        with:
          saga: .draugr/self.saga.yaml
          output: draugr-out
          # Restored and saved by the steps above. Relative to working-directory, and under
          # .draugr/ with everything else a run reads or writes.
          cache-dir: .draugr/cache
          # Draugr provisions its own scanners: `draugr tools install` fetches each pinned,
          # checksum-verified release into a directory it owns, which is what this action offers
          # every user and therefore what this job should be exercising.
          #
          # It has to be the action's step rather than one of ours because the scanners are needed
          # after Draugr is on PATH, and the action is what puts it there — a step above this one
          # calling `draugr tools install` gets `command not found`.
          #
          # A control whose scanner is missing reports an error rather than a pass, which is the
          # design working: if this line is dropped, every control fails and the branch goes red
          # for a reason about the runner rather than about the code.
          tools: true
          # The Saga reads KEV and EPSS from the cache, so they have to be in it. Fetched by the
          # action as its own step, so a feed outage surfaces there rather than inside a scan.
          # A fetch that fails keeps the cached copy and says how old it is — the thing this
          # guards against is a scan ranking everything as though nothing were exploited, and a
          # cached catalog does not do that. With nothing cached there is no answer to keep.
          feeds: true
          # P1 only. The gate blocks on what the risk model says is urgent for this repository,
          # not on every warning a scanner can produce — a required check that fails on
          # everything is one people learn to route around.
          #
          # To accept a P1 that cannot be fixed now, add a `config.exclude` entry with a reason
          # to .draugr/self.saga.yaml in the same pull request. The finding stays in the report
          # marked suppressed, so the decision is visible afterwards rather than invisible.
          fail-on-priority: P1
          # The diff gate, and the reason there are two.
          #
          # `mode: auto` runs a diff on a pull request and a full scan on a push, because those
          # answer different questions. A diff answers "does this change make things worse", which
          # is the only fair question to ask an author who inherited a tree they did not write. A
          # full scan answers "is this tree acceptable", which nothing about a diff can establish.
          #
          # `fail-on-priority` above configures the second and is not read by the first. Without
          # this line the pull-request gate ran, posted its comment, and passed whatever the diff
          # contained — including a new P1 — so the check was green by construction rather than
          # by result.
          #
          # Same band as the full scan's, deliberately: a finding urgent enough to block the
          # branch is urgent enough to block the change that introduces it, and two thresholds
          # would mean a P1 that is allowed in and never allowed out.
          fail-on-new-priority: P1

      - name: Upload evidence
        # always(), not the code filter: the evidence is most wanted when the gate failed, and
        # a step skipped on failure uploads nothing exactly then.
        if: always() && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draugr-selfscan
          path: draugr-out/
          if-no-files-found: warn

  # A failing gate on the default branch has to reach a person.
  #
  # The pull-request gate stops a new P1 being merged and the release gate stops a bad tree
  # shipping, so what is left is the case neither can see: main going red with no change to main.
  # A CVE published against a dependency that was already there, a scanner shipping a new rule, an
  # exclusion reaching its expiry date. Nobody did anything, and the branch is failing.
  #
  # That is a poor fit for blocking merges — the pull request that fixes it would be blocked by
  # the thing it fixes, and every unrelated change waits on somebody else's CVE. It is a good fit
  # for an issue, which is how the rest of the work here is tracked anyway.
  #
  # One issue, reused. Opening a fresh one per red push turns a week of a slow-moving advisory
  # into seven duplicates, which is how a notification becomes something people filter. Closed
  # automatically when the branch is green again, so an open one always means "red right now"
  # rather than "was red once".
  notify:
    name: A red default branch raises an issue
    needs: [changes, selfscan]
    # Pushes to main only. On a pull request the author is already looking at the failing check,
    # and an issue would be telling them what their own screen says.
    if: always() && github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Fetch the evidence
        if: needs.selfscan.result == 'failure'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: draugr-selfscan
          path: draugr-out
        continue-on-error: true

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out — it has no use for the source — so `gh` has
          # no local clone to infer the repository from and every call has to name it. Without
          # this the step fails on its first command with "not a git repository", and the branch
          # is red with nobody told why, which is the one thing this job exists to prevent.
          GH_REPO: ${{ github.repository }}
          RESULT: ${{ needs.selfscan.result }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SECURITY_URL: ${{ github.server_url }}/${{ github.repository }}/security/code-scanning
        run: |
          set -euo pipefail
          label="self-scan"

          # The label is what makes the issue findable next time, so create it if it is missing
          # rather than failing on a repository that has never been red.
          gh label create "$label" --description "The self-scan on main is failing" --color B60205 2>/dev/null || true

          existing=$(gh issue list --label "$label" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ "$RESULT" != "failure" ]; then
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Green again as of \`${SHA:0:8}\`. Closing — an open issue with this label means the branch is red now, not that it was red once."
              gh issue close "$existing"
              echo "closed #$existing"
            else
              echo "green, and nothing open"
            fi
            exit 0
          fi

          # Counts rather than a copy of the report: the SARIF is already in code scanning, where
          # it can be triaged, and a body that restates it goes stale the moment somebody does.
          summary="(the run's log has the detail)"
          if [ -f draugr-out/report.json ]; then
            summary=$(jq -r '
              "P1 \(.priorities.p1 // 0) · P2 \(.priorities.p2 // 0) · P3 \(.priorities.p3 // 0) · P4 \(.priorities.p4 // 0)",
              "",
              "| Control | Verdict | Highest | Findings |",
              "|---|---|---|---|",
              (.controls[] | select(.verdict == "fail")
                | "| `\(.name)` | \(.verdict) | \(.highestPriority // .highest) | \(.total) |")
            ' draugr-out/report.json)
          fi

          body=$(cat <<BODY
          The self-scan gate is failing on \`main\` as of [\`${SHA:0:8}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${SHA}).

          ${summary}

          [The run](${RUN_URL}) · [Code scanning](${SECURITY_URL}) — the SARIF is uploaded there by the scan itself, so triage happens in one place rather than in this issue.

          **This does not necessarily mean somebody broke something.** The pull-request gate blocks a new P1 from being merged, so the usual cause of a red branch is that the world changed underneath an unchanged tree: an advisory published against a dependency that was already here, a scanner shipping a rule it did not have last week, or a \`config.exclude\` entry reaching its expiry date.

          Two ways out, and the choice is the point: fix it, or accept it with a \`config.exclude\` entry in \`.draugr/self.saga.yaml\` carrying a reason and an \`acceptedBy\`. The finding stays in the report marked suppressed either way, so the decision is visible afterwards.

          This issue closes itself when the branch is green again.
          BODY
          )
          body=$(printf '%s\n' "$body" | sed 's/^          //')

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body "$body"
            echo "updated #$existing"
          else
            gh issue create --label "$label" \
              --title "The self-scan on main is failing" --body "$body"
          fi
