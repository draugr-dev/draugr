name: Self-scan

# Dogfood: run the latest released Draugr against this repo (see issue #64).
# Uses a stable release (not a source build) — the way real users consume Draugr.

# A required check, so the job always runs and skips its *steps* on a documentation-only change.
# paths-ignore would skip the job outright, and a required check that never runs leaves the pull
# request waiting forever on a status that will not arrive.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # These versions are the single source of truth's mirror: they MUST match the pinned
  # manifest in internal/tools/install.go (trivy/gitleaks) and internal/tools/tools.go
  # (semgrep). internal/tools TestSelfscanPinsMatchManifest fails CI if they drift — so the
  # tools Draugr ships (`draugr tools install`) are exactly the ones the self-scan validates.
  TRIVY_VERSION: "0.69.3"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  # Pinned Semgrep (pip verifies the PyPI package hash for this exact version).
  SEMGREP_VERSION: "1.169.0"

jobs:
  # Mirrors ci.yml: one cheap job decides whether there is anything to scan, and the scan job
  # reports either way so the required check always resolves.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; a shallow clone has only the tip.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            # A push to main, or anything without a PR base: assume code and scan.
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Anything that is not documentation is treated as code. Erring this way means a new
          # kind of file gets scanned rather than silently skipped — which is the whole point of
          # a gate.
          if git diff --name-only "$base" HEAD \
             | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed — the self-scan will report without running."
          fi

  selfscan:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # publish the self-scan SARIF to GitHub code scanning (#64)
      pull-requests: write # the github publisher posts the diff summary as a PR comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      - name: Install Trivy
        if: needs.changes.outputs.code == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v${{ env.TRIVY_VERSION }}

      - name: Install Gitleaks
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Install Semgrep
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          pipx install "semgrep==${SEMGREP_VERSION}"
          semgrep --version

      - name: Draugr self-scan
        if: needs.changes.outputs.code == 'true'
        id: draugr
        # This step blocks. It used to be continue-on-error, which meant the check was green
        # whatever the scan found — a gate that cannot fail is indistinguishable from one that
        # passed, which is the failure mode Draugr exists to prevent. It was hiding a reachable
        # CVE in a dependency for as long as the advisory had been public.
        #
        # Gating on P1 rather than on any finding: P1 is "high or critical severity, weighted by
        # the component's exposure and criticality", which is the bar we ask users to hold. A
        # gate that trips on every medium gets switched off, and then protects nothing.
        #
        # Dogfood our own first-party action (the local checkout, so PRs test action changes
        # before they ship). The action downloads + cosign-verifies the latest release and
        # runs the scan, replacing the hand-rolled download+verify+run steps above.
        #
        # The Saga's `github` publisher uploads the SARIF to code scanning as part of the scan
        # — dogfooding the OSS Publisher instead of a separate upload-sarif step (#58). The
        # action forwards GITHUB_TOKEN; the job grants `security-events: write` above.
        uses: ./
        with:
          saga: .draugr/self.saga.yaml
          output: draugr-out
          # The Saga reads KEV and EPSS from the cache, so they have to be in it. Fetched by the
          # action as its own step: a feed outage fails there rather than producing a scan that
          # ranked everything as though nothing were exploited.
          feeds: true
          # P1 only. The gate blocks on what the risk model says is urgent for this repository,
          # not on every warning a scanner can produce — a required check that fails on
          # everything is one people learn to route around.
          #
          # To accept a P1 that cannot be fixed now, add a `config.exclude` entry with a reason
          # to .draugr/self.saga.yaml in the same pull request. The finding stays in the report
          # marked suppressed, so the decision is visible afterwards rather than invisible.
          fail-on-priority: P1

      - name: Upload evidence
        if: needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: draugr-selfscan
          path: draugr-out/
          if-no-files-found: warn
