# Cut a release from the CHANGELOG, in the two steps the manual flow already had.
#
# `prepare` reads what is under [Unreleased], derives the version from it, promotes the section
# and opens a pull request. `tag` watches main and tags any released section that has no tag yet.
#
# Two workflows rather than one because this repository does not push to main, and a release has
# to. The promotion is a commit like any other: it goes through a pull request, CI runs on it, and
# a person merges it. What that buys is the last look at the notes a release will publish, at the
# one moment changing them is still free.
#
# The version comes from the notes rather than from commit messages. The notes are written for
# users and reviewed as prose, so the heading an author chose is a decision somebody made on
# purpose — where a `feat:` prefix is a habit, and habits drift. `scripts/changelog.sh next`
# holds the rule, so it is testable without a runner.
#
# Deliberately not on every merge. #144 asked for that: a version per trivial change is noise in
# the tag list and in everyone's dependency updates. Dispatch it when the accumulated notes are
# worth shipping.
name: Release prepare

on:
  workflow_dispatch:
    inputs:
      version:
        description: Override the version instead of deriving it from [Unreleased] (X.Y.Z, e.g. for a major).
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    name: Open the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release branch
      pull-requests: write # open the pull request
    steps:
      # A token that is not GITHUB_TOKEN, because GitHub raises no workflow-starting event for
      # anything GITHUB_TOKEN did and refuses it `gh pr create` unless the repository allows
      # Actions to create *and approve* pull requests — one switch, and approval is not something
      # to grant a workflow in order to fix a papercut.
      #
      # An App rather than a personal token: the installation token lives for an hour, is scoped
      # to this repository, carries no person's identity, and cannot quietly expire between
      # releases the way a PAT does.
      - name: Mint an installation token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below compares against every existing tag
          token: ${{ steps.app.outputs.token }}

      - name: Work out the version
        id: version
        env:
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            # An override is the escape hatch for the one thing the notes cannot say: that an
            # interface is now unsupportable. Validated rather than trusted, because a typo here
            # becomes a tag, and a tag is the one thing in this process that cannot be taken back.
            [[ "$OVERRIDE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "::error::--version must be X.Y.Z, got '$OVERRIDE'"; exit 1; }
            version="$OVERRIDE"
          else
            # Fails when [Unreleased] is empty, which is the case worth failing on: a release
            # nobody can describe is worse than no release.
            version=$(./scripts/changelog.sh next)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "next version: $version"

      - name: Refuse a version that already exists
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION is already tagged. The CHANGELOG's last released section is" \
                 "probably behind — check that a previous release promoted cleanly."
            exit 1
          fi

      - name: Promote the CHANGELOG and open the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh promote "$VERSION"
          ./scripts/changelog.sh check

          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          branch="release-$VERSION"
          git checkout -b "$branch"
          git commit -am "Release $VERSION"
          git push -u origin "$branch"

          # The body is the notes themselves, so the last review of a release is a review of what
          # it will say — the same text the release workflow extracts for the GitHub release.
          {
            echo "Promotes \`[Unreleased]\` to \`## [$VERSION]\`. Merging this tags \`v$VERSION\`,"
            echo "which runs the release workflow — and that refuses to publish unless the"
            echo "self-scan and the integration suite both pass on this exact tree."
            echo
            echo "The notes this will publish, verbatim:"
            echo
            echo "---"
            echo
            ./scripts/changelog.sh show "$VERSION"
          } >/tmp/body.md

          # Fails the run rather than degrading to a notice. A notice is printed into a log
          # nobody opens on a green workflow, so the branch sits pushed and unreviewed while
          # everything reports success — which is the shape of failure this project refuses.
          #
          # The likely cause is named because the error GitHub returns does not name it, and the
          # setting is somewhere nobody looks while debugging a workflow. It is one toggle
          # covering both creating and approving pull requests, which is why it may be off on
          # purpose: a workflow that can approve is a workflow that can bypass review.
          if ! gh pr create --title "Release $VERSION" --body-file /tmp/body.md; then
            echo "::error::Could not open the release pull request. The branch $branch is pushed," \
              "so nothing is lost: open it at" \
              "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/$branch?expand=1" \
              "-- on a permissions error, check that the release App is still installed on this" \
              "repository with Contents and Pull requests write, and that RELEASE_APP_ID and" \
              "RELEASE_APP_PRIVATE_KEY still match it."
            exit 1
          fi
