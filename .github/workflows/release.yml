name: Release

on:
  push:
    tags:
      # Full-semver tags only (vX.Y.Z). This deliberately excludes the moving major tag (v0),
      # which release-post-publish.yml re-points on each release. It moves v0 with an App token,
      # so the push starts any workflow listening for it, and this filter is what stops it
      # starting a release. TestTheMajorTagStartsNoWorkflow holds every workflow to that.
      - "v*.*.*"
  # Deliberately no `workflow_call`. Calling this from a workflow on main would publish, and the
  # artifacts would be signed with the *caller's* ref, `release.yml@refs/heads/main`, while
  # install.sh and action.yml both verify `release.yml@refs/tags/v.*`. The release would exist and
  # refuse to install. Keyless signing tied to a tag needs a run whose own ref is that tag, which
  # is why release-tag.yml pushes a tag with a credential GitHub will act on rather than calling
  # this workflow. TestReleaseIsNotCallable keeps it that way.
  #
  # The dispatch below is the manual path, and it needs the same thing of you:
  #
  #   gh workflow run Release --ref vX.Y.Z -f tag=vX.Y.Z
  #
  # Without `--ref` the run sits on the default branch and signs as main, which is the same
  # failure by a shorter route.
  #
  # Neither path is for a release that is already published. Running goreleaser again publishes
  # again, so a release whose later steps failed is finished by the workflow that holds them,
  # which builds nothing:
  #
  #   gh workflow run "Release post-publish" -f tag=vX.Y.Z
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release. Must match the ref this is dispatched against.
        required: true
        type: string
      dryRun:
        description: Resolve and build without publishing, to prove the wiring.
        required: false
        default: false
        type: boolean

# The tag this run is about, whichever way it started. Every step reads this rather than
# GITHUB_REF_NAME, which is the tag on a push and the calling branch on a call, and a release
# built from `main` while claiming to be a tag is the worst version of this being wrong.
env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The patch ci.yml pins, for the reason given there. Every job here reads it, so a release is
  # built and checked on the toolchain the pull requests were.
  GO_VERSION: "1.26.10"

# Least privilege at the top; the release job opts into the writes it needs.
permissions:
  contents: read

jobs:
  # Nothing is built, signed, published to the MCP Registry or rendered into the demo until the
  # tree being tagged passes its own gate.
  #
  # Run against the tag rather than read off main's last push scan, which is a different commit's
  # answer and goes stale the moment anything merges between the two. "Was this exact tree
  # acceptable" has one honest source.
  #
  # Before goreleaser rather than after: tagging first and checking second publishes the artifact
  # and then reports that it should not have been.
  selfscan:
    uses: ./.github/workflows/selfscan.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    # Every permission any job in that workflow declares, not only the ones a release needs. A
    # called workflow cannot request more than its caller granted, and the shortfall is a startup
    # failure of the whole run, no jobs, no logs, no annotation naming the missing scope. So this
    # list tracks selfscan.yml rather than this workflow's own needs, and
    # TestCallersGrantEveryPermissionTheCalledWorkflowDeclares keeps the two in step.
    permissions:
      contents: read
      security-events: write # the Saga's `github` publisher uploads SARIF to code scanning
      pull-requests: write # unused on a tag push; the reusable workflow declares it for the PR path
      issues: write # the notify job, which opens an issue when the default branch is red

  # The other half of "was this exact tree acceptable". The self-scan asks whether Draugr's own
  # code passes Draugr's policy; this asks whether Draugr still works, against a real Trivy and
  # a real cluster, which is the part unit tests stub out and therefore the part that can be
  # green while the tool is broken. Against a tag it also runs the air-gapped job, which scans the
  # fixture corpus with no network from a home prepared as docs/guides/air-gapped.md says, so a
  # release that no longer works offline is not built.
  #
  # Every pull request has already passed it, and it runs again here because the tag is what gets
  # built, and the air-gapped job runs only on a tag and on the nightly schedule.
  integration:
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read
      # For the notifier that workflow carries, which raises an issue when the suite goes red on
      # main. It cannot fire from here: its own condition is `ref == refs/heads/main`, and a
      # release runs against a tag. A called workflow inherits the caller's grants whatever its
      # jobs do or do not run, though, so withholding this fails the release at startup with no
      # job and no message naming the scope, which is what internal/ciguard exists to catch.
      issues: write
      # For the live cloud job, which signs in to Google Cloud without a key. It runs only on the
      # nightly schedule and a manual dispatch, never from here; the grant is the same startup rule.
      id-token: write

  # The cross-compiled builds, compiled while the gates above run, so goreleaser starts from a warm
  # Go build cache instead of compiling every target cold after them.
  #
  # The cache holds compiled packages, keyed by Go on their sources, the toolchain and the flags;
  # linking, where the version is stamped, is left to goreleaser. Same commit, same toolchain, same
  # .goreleaser.yaml and the same checkout path, so goreleaser finds every package it would compile.
  # Read-only and without secrets, and the archive goes no further than this run.
  #
  # A run artifact rather than an actions/cache entry: the cache is several gigabytes, and one per
  # release would evict the caches every pull request reads.
  warm-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: false
      - name: Compile every target
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --snapshot --clean
      - name: Pack the build cache
        run: tar -C "$(go env GOCACHE)" -cf - . | zstd -T0 -q -o "$RUNNER_TEMP/gocache.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gocache
          path: ${{ runner.temp }}/gocache.tar.zst
          # Already compressed, and read once by the job below.
          compression-level: 0
          retention-days: 1

  # Builds, signs, publishes and attests, and stops there. A step after the publish in this job
  # would be skipped by any failure before it, and it cannot be run again without this job's
  # publish running again, so everything after the publish is in the post-publish job below.
  goreleaser:
    needs: [selfscan, integration, warm-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing via GitHub OIDC
      attestations: write # SLSA build-provenance attestations for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag, not the caller's branch. GoReleaser derives the version from the git state it
          # finds, so a checkout of main would build main and label it with the tag's notes.
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exact patch: the released binary should be built on the toolchain the gate
          # checked, not on whichever one setup-go resolved that morning.
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gocache
          path: ${{ runner.temp }}
      - name: Unpack the build cache
        run: |
          mkdir -p "$(go env GOCACHE)"
          zstd -d -q -c "$RUNNER_TEMP/gocache.tar.zst" | tar -C "$(go env GOCACHE)" -xf -
      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Install cosign (signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prepare user-facing release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](https://github.com/draugr-dev/draugr/blob/main/CHANGELOG.md)." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          # A dry run builds and signs exactly as a real one does and stops before anything
          # leaves the runner, so the wiring can be proved without a release nobody asked for.
          args: >-
            release --clean --release-notes=RELEASE_NOTES.md
            ${{ inputs.dryRun && '--skip=publish,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (SLSA)
        if: ${{ !inputs.dryRun }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # Everything a release does once it is published: the moving major tag, the MCP Bundle, the docs
  # site, the sample report and the MCP Registry listing. Each is its own job in
  # release-post-publish.yml, so one that fails turns this run red and the others still run, and
  # the same workflow can be dispatched alone to finish a published release without building it.
  #
  # Nothing in it signs, so being called from here, under this run's ref, changes no certificate.
  post-publish:
    if: ${{ !inputs.dryRun }}
    needs: goreleaser
    uses: ./.github/workflows/release-post-publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    # By name, so the called workflow receives these and no other secret. MCP_PUBLISHER_DNS_KEY
    # exists only in the `mcp-registry` environment, which this job cannot declare. GitHub still
    # requires the caller to name it, and the called job that declares the environment receives
    # the environment's value.
    secrets:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      CLOUDFLARE_PAGES_DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
      MCP_PUBLISHER_DNS_KEY: ${{ secrets.MCP_PUBLISHER_DNS_KEY }}
    # Every write any job in the called workflow declares; the shortfall would fail this run at
    # startup with nothing naming the scope. TestCallersGrantEveryPermissionTheCalledWorkflowDeclares
    # keeps the two in step.
    permissions:
      contents: write # the bundle and the sample report are uploaded to the release
