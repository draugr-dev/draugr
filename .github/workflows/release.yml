name: Release

on:
  push:
    tags:
      # Full-semver tags only (vX.Y.Z). This deliberately excludes the moving major tag (v0),
      # which this workflow re-points on each release — so that move never re-triggers a release.
      - "v*.*.*"
  # Deliberately no `workflow_call`. Calling this from a workflow on main would publish, and the
  # artifacts would be signed with the *caller's* ref — `release.yml@refs/heads/main` — while
  # install.sh and action.yml both verify `release.yml@refs/tags/v.*`. The release would exist and
  # refuse to install. Keyless signing tied to a tag needs a run whose own ref is that tag, which
  # is why release-tag.yml pushes a tag with a credential GitHub will act on rather than calling
  # this workflow. TestReleaseIsNotCallable keeps it that way.
  #
  # The dispatch below is the manual path, and it needs the same thing of you:
  #
  #   gh workflow run Release --ref vX.Y.Z -f tag=vX.Y.Z
  #
  # Without `--ref` the run sits on the default branch and signs as main, which is the same
  # failure by a shorter route.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release. Must match the ref this is dispatched against.
        required: true
        type: string
      dryRun:
        description: Resolve and build without publishing, to prove the wiring.
        required: false
        default: false
        type: boolean

# The tag this run is about, whichever way it started. Every step reads this rather than
# GITHUB_REF_NAME, which is the tag on a push and the calling branch on a call — and a release
# built from `main` while claiming to be a tag is the worst version of this being wrong.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

# Least privilege at the top; the release job opts into the writes it needs.
permissions:
  contents: read

jobs:
  # Nothing is built, signed, published to the MCP Registry or rendered into the demo until the
  # tree being tagged passes its own gate.
  #
  # Run against the tag rather than read off main's last push scan, which is a different commit's
  # answer and goes stale the moment anything merges between the two. "Was this exact tree
  # acceptable" has one honest source.
  #
  # Before goreleaser rather than after: tagging first and checking second publishes the artifact
  # and then reports that it should not have been.
  selfscan:
    uses: ./.github/workflows/selfscan.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    # Every permission any job in that workflow declares, not only the ones a release needs. A
    # called workflow cannot request more than its caller granted, and the shortfall is a startup
    # failure of the whole run — no jobs, no logs, no annotation naming the missing scope. So this
    # list tracks selfscan.yml rather than this workflow's own needs, and
    # TestCallersGrantEveryPermissionTheCalledWorkflowDeclares keeps the two in step.
    permissions:
      contents: read
      security-events: write # the Saga's `github` publisher uploads SARIF to code scanning
      pull-requests: write # unused on a tag push; the reusable workflow declares it for the PR path
      issues: write # the notify job, which opens an issue when the default branch is red

  # The other half of "was this exact tree acceptable". The self-scan asks whether Draugr's own
  # code passes Draugr's policy; this asks whether Draugr still works — against a real Trivy and
  # a real cluster, which is the part unit tests stub out and therefore the part that can be
  # green while the tool is broken.
  #
  # Advisory on a pull request and binding here, deliberately. Requiring it on every change would
  # make most of them wait on a kind cluster to learn what a unit test already said. A release is
  # the moment that cost is obviously worth paying.
  integration:
    uses: ./.github/workflows/integration.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  goreleaser:
    needs: [selfscan, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and upload assets
      id-token: write # keyless cosign signing via GitHub OIDC
      attestations: write # SLSA build-provenance attestations for the release artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The tag, not the caller's branch. GoReleaser derives the version from the git state it
          # finds, so a checkout of main would build main and label it with the tag's notes.
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          check-latest: true
      - name: Install syft (SBOM generation)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Install cosign (signing)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Prepare user-facing release notes from CHANGELOG
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {f=1; next}
            f && /^## \[/ {exit}
            f {print}
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "See [CHANGELOG.md](https://github.com/draugr-dev/draugr/blob/main/CHANGELOG.md)." > RELEASE_NOTES.md
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          # A dry run builds and signs exactly as a real one does and stops before anything
          # leaves the runner, so the wiring can be proved without a release nobody asked for.
          args: >-
            release --clean --release-notes=RELEASE_NOTES.md
            ${{ inputs.dryRun && '--skip=publish,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance (SLSA)
        if: ${{ !inputs.dryRun }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # Maintain a moving major tag (e.g. v0) pointing at this release, so docs and users can
      # reference draugr-dev/draugr@v0 and always get the newest v0.x.y without editing a pin.
      # The trigger above is vX.Y.Z-only, so moving v0 here never re-triggers a release; pushes
      # made with GITHUB_TOKEN also don't trigger workflows (belt and suspenders).
      - name: Update moving major tag
        if: ${{ !inputs.dryRun }}
        run: |
          tag="${TAG}"   # e.g. v0.29.0
          major="${tag%%.*}"         # e.g. v0
          git tag -f "$major" "$tag"
          git push -f origin "refs/tags/$major"
          echo "moved $major -> $tag"

      # Rebuild the docs site (draugr.dev) so its versioned docs pick up this release: the site's
      # Build the MCP Bundle and attach it to the release. It has to run after GoReleaser,
      # because it assembles the published archives rather than rebuilding — so the binaries in
      # the bundle are bit-for-bit the ones people already verify against checksums.txt.
      #
      # Non-fatal on purpose: a bundle is packaging for one distribution channel, and a failure
      # here should not leave a tagged release half-published. If it fails, run
      # `contrib/mcpb/build.sh <version>` afterwards and upload the result.
      - name: Build and attach the MCP Bundle
        if: ${{ !inputs.dryRun }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          ./contrib/mcpb/build.sh "$version" "$RUNNER_TEMP"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/draugr-$version.mcpb" \
            "$RUNNER_TEMP/draugr-$version.mcpb.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

      # This covers the docs, which come from the tag. It does *not* cover the demo assets: the
      # render job below runs after this, and its pull request waits for a human, so the block
      # the home page shows is still the previous release's when this fires. site-rebuild.yml
      # triggers again when those assets land.
      #
      # `latest` is sourced from the newest release tag, so a fresh release needs a rebuild. This
      # POSTs a Cloudflare Pages Deploy Hook. Configure it once: create the hook in Cloudflare and
      # add its URL as the CLOUDFLARE_PAGES_DEPLOY_HOOK repo secret. The step no-ops (never fails
      # the release) when the secret is absent, so forks and pre-setup releases stay green.
      - name: Trigger docs site rebuild
        if: ${{ !inputs.dryRun }}
        env:
          HOOK: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "docs rebuild triggered"
          else
            echo "CLOUDFLARE_PAGES_DEPLOY_HOOK not set; skipping docs rebuild"
          fi

  # Publish the server to the MCP Registry once the release exists, so the listing always names a
  # bundle that is actually downloadable.
  #
  # Gated behind the `mcp-registry` environment for one reason: the DNS key below is what proves
  # anything published under `dev.draugr` is ours, and an environment secret is readable only by a
  # job that declares the environment — a repository secret is readable by every workflow in the
  # repo. Add required reviewers to that environment and each publish waits for a click.
  #
  # DNS namespaces have no keyless option. The registry's own CI guide only documents
  # `login github-oidc` and a PAT, and both authenticate `io.github.*` namespaces, not a domain.
  publish-mcp:
    if: ${{ !inputs.dryRun }}
    needs: goreleaser
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Publish to the MCP Registry
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PUBLISHER_DNS_KEY: ${{ secrets.MCP_PUBLISHER_DNS_KEY }}
        run: |
          set -euo pipefail
          # Absent on a fork, and before the secret is configured. Skipping keeps those green:
          # the release itself succeeded, and a listing is one distribution channel.
          if [ -z "${MCP_PUBLISHER_DNS_KEY:-}" ]; then
            echo "MCP_PUBLISHER_DNS_KEY not set; skipping the registry publish"
            exit 0
          fi
          version="${TAG#v}"

          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" \
            | tar xz mcp-publisher

          # Renders version, bundle URL and SHA-256 from the release that just published. The
          # hash comes from the release's own .mcpb.sha256, so the listing cannot advertise a
          # digest that differs from the artifact.
          ./contrib/mcpb/render-server-json.sh "$version"

          cd contrib/mcpb
          # mcp-publisher takes the key as a flag and offers no env-var form, so it is briefly
          # visible to `ps` on this runner. Acceptable here — the runner is ephemeral and
          # single-tenant — but it is why the secret is environment-scoped rather than
          # repo-wide, and why it should be rotated if a job on this runner is ever suspect.
          "$GITHUB_WORKSPACE/mcp-publisher" login dns \
            --domain draugr.dev --private-key "$MCP_PUBLISHER_DNS_KEY"

          # A version already in the registry is the state this step exists to reach, so reaching
          # it twice is not a failure. The registry refuses a duplicate with a 400, which would
          # otherwise redden a release whose artifacts published perfectly — and a red release run
          # that is actually fine is worse than no signal, because the next real failure looks the
          # same.
          #
          # Narrow on purpose: only "duplicate version" is forgiven, and it is reported. Every
          # other 400 still fails, because those mean the listing did not reach the registry.
          if ! out=$("$GITHUB_WORKSPACE/mcp-publisher" publish 2>&1); then
            printf '%s\n' "$out"
            if printf '%s' "$out" | grep -q 'cannot publish duplicate version'; then
              echo "::notice::Version $version is already in the MCP Registry; nothing to publish."
            else
              exit 1
            fi
          else
            printf '%s\n' "$out"
          fi

  # Regenerate the demo assets against the release that was just published. Invoked here
  # rather than triggered by `release: published` in demo-assets.yml, because GoReleaser publishes the
  # release using GITHUB_TOKEN, and GitHub does not raise workflow-starting events for anything
  # GITHUB_TOKEN did — so a `release` trigger would never fire. A reusable-workflow call is a
  # direct invocation rather than an event, and is not subject to that rule.
  #
  # It opens a pull request rather than committing, so a bad render is caught before it reaches
  # the README, and it no-ops when the image is byte-identical.
  demo-assets:
    if: ${{ !inputs.dryRun }}
    needs: goreleaser
    permissions:
      contents: write # push the assets branch
      pull-requests: write # open the PR
    uses: ./.github/workflows/demo-assets.yml
    # Not the screenshot. It is the slow, fragile half — ttyd, ffmpeg, vhs, a viewport sized to
    # the output — and its subject is the console layout, which a release does not necessarily
    # change. It re-renders when pkg/report does, or on demand.
    with:
      screenshot: false
