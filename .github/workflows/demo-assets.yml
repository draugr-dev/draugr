# Regenerate the demo assets from a real scan of the sandbox, and open a pull request with them.
#
# Two assets, deliberately on different schedules.
#
# The **terminal fragment** the home page carries is cheap: capture a scan through a PTY, convert
# the escape codes, done in seconds. It runs every release, so the page always quotes the version
# a reader would install.
#
# The **README screenshot** is not cheap. It needs ttyd, ffmpeg and vhs installed, a headless
# terminal driven through a tape, a viewport sized to the output, and a palette pass — and its
# failure modes are slow and opaque (a Wait that times out on a line pushed below the fold). It
# runs when the console layout changes or when someone asks, not on every release.
#
# What that trades: between layout changes the screenshot's numbers drift behind the fragment's,
# because advisories move. The layout is what the screenshot is for, and the layout is what
# triggers it. Dispatch this workflow with `screenshot=true` to refresh it anyway.
#
# Runs after every release, and on demand from the Actions tab. Release is the right moment
# rather than a push to main: the job captures the *latest release*, which is what a reader who
# follows the README will install, so rendering on merge would produce an image of the previous
# version — stale the moment it landed. Anything that changes the output therefore reaches the
# screenshot one release later, which is also when it reaches users.
#
# Called by release.yml rather than triggered by `release: published`. GoReleaser creates the
# release with GITHUB_TOKEN, and GitHub deliberately does not start workflow runs from events
# raised by GITHUB_TOKEN — so a `release` trigger here would never fire. `workflow_call` is a
# direct invocation, not an event, so it is not subject to that rule.
#
# The console layout is pinned separately by pkg/report/golden_test.go, and the numbers quoted
# in the docs are refreshed with `make examples`.
name: Demo assets

on:
  workflow_call:
    inputs:
      screenshot:
        description: Also re-render the README screenshot (slow).
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      screenshot:
        description: Also re-render the README screenshot (slow).
        type: boolean
        default: true
  # The console layout is the screenshot's whole subject, so a change to it is the one event
  # that always warrants the expensive path.
  push:
    branches: [main]
    paths:
      - pkg/report/**
      - contrib/demo/scan.tape

permissions:
  contents: read

# One render at a time. Two releases close together would otherwise open two PRs whose branches
# both claim to hold the current assets.
concurrency:
  group: demo-assets
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the screenshot branch
      pull-requests: write # open the PR
    env:
      # These steps capture what a reader gets when they run the same command themselves, and a
      # reader runs it at a terminal. `scan` prints a tip in CI about a report that exists only
      # in the log, which is true here and irrelevant to what the screenshot is demonstrating —
      # and every line it adds is a line closer to the viewport height the tape declares.
      CI: ""
    steps:
      # main, not the release tag: the branch this pushes has to merge into main, and the tape
      # to render is the current one. Only the *binary* being captured comes from the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # For contrib/demo/ansi2html, which turns the captured scan into the home page's fragment.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Install Draugr (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download --repo draugr-dev/draugr \
            --pattern 'draugr_*_linux_amd64.tar.gz' \
            --pattern 'checksums.txt' --pattern 'checksums.txt.sigstore.json'
          tar -xzf draugr_*_linux_amd64.tar.gz draugr
          sudo mv draugr /usr/local/bin/
          draugr version

      - name: Provision scanners
        run: |
          set -euo pipefail
          draugr tools install -y           # Trivy, Gitleaks (into ~/.draugr/bin, on Draugr's PATH)
          pipx install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Clone the demo sandbox
        run: git clone --depth 1 https://github.com/draugr-dev/draugr-demo draugr-demo

      # Off-camera, and before vhs starts. Trivy downloads its vulnerability database on first
      # use; on a cold runner that download takes longer than the scan, and a progress bar left
      # on screen is what the shot would catch. Every scan after a machine's first looks like the
      # one we capture.
      - name: Warm the scanner databases
        working-directory: draugr-demo
        run: draugr scan . >/dev/null 2>&1 || true

      # vhs renders a fixed viewport, so output taller than it is never captured — including the
      # line the tape's Wait matches on, which turns a too-short frame into a 120-second timeout
      # for text that was never going to appear. Anything that adds rows to the report does that:
      # a second component, another control, one more note under the verdict.
      #
      # Measured here instead, in a second, against the tape's own declared height.
      - name: The output still fits the viewport
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        working-directory: draugr-demo
        run: |
          set -uo pipefail
          set +e
          draugr scan . 2>/dev/null > /tmp/scan.txt
          set -e
          rows=$(( $(wc -l < /tmp/scan.txt) + 2 ))   # + the prompt line and the one after it
          height=$(grep -oP 'Set Height \K[0-9]+' "$GITHUB_WORKSPACE/contrib/demo/scan.tape")
          needed=$(( rows * 22 + 40 ))               # ~22px a row at font size 18, plus padding
          echo "output is $rows rows (~${needed}px); tape declares ${height}px"
          [ "$needed" -le "$height" ] || {
            echo "::error::the scan output needs ~${needed}px and contrib/demo/scan.tape declares" \
                 "${height}px — raise Set Height, or the Wait will time out on a line that never" \
                 "appears"; exit 1; }

      - name: Install vhs and its dependencies
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y ffmpeg
          # ttyd (pinned)
          sudo curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
            -o /usr/local/bin/ttyd && sudo chmod +x /usr/local/bin/ttyd
          # vhs (pinned) — the binary lives under a versioned dir in the tarball
          curl -fsSL https://github.com/charmbracelet/vhs/releases/download/v0.11.0/vhs_0.11.0_Linux_x86_64.tar.gz \
            | tar -xz --strip-components=1 vhs_0.11.0_Linux_x86_64/vhs && sudo mv vhs /usr/local/bin/
          vhs --version && ttyd --version && ffmpeg -version | head -1

      # vhs exits 0 whether or not it wrote the screenshot, so the render is only as good as the
      # check after it. Without one, an upstream regression in `Screenshot` would show up as a
      # green run that opened no PR — indistinguishable from "the output didn't change".
      # Every scan above leaves the sandbox dirty: its Saga writes reports into a committed
      # draugr-out/, so each one modifies three tracked files. Both the warm-up and the viewport
      # measurement run a scan, so this sits immediately before the render — the only step whose
      # output is published — rather than beside whichever step dirtied the tree first.
      #
      # A scan of a repository with uncommitted work says so, correctly. Left alone that warning
      # becomes the first line of the README's hero image, telling every reader the demo is
      # looking at something other than what it shows.
      #
      # Reset rather than gitignore: those files are the demo's own committed evidence, and the
      # warning is right. What is wrong is capturing a tree our own setup disturbed.
      - name: Put the sandbox back as it was cloned
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        working-directory: draugr-demo
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fdq
          # Nothing should remain. A still-dirty tree means the capture is about to include a
          # warning about it, and finding that out from the published image is finding out late.
          if [ -n "$(git status --porcelain)" ]; then
            echo "sandbox still dirty after reset:" >&2
            git status --porcelain >&2
            exit 1
          fi

      - name: Render the tape
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          rm -f contrib/demo/scan.png
          vhs contrib/demo/scan.tape
          test -s contrib/demo/scan.png \
            || { echo "::error::vhs produced no screenshot at contrib/demo/scan.png"; exit 1; }
          file contrib/demo/scan.png

      # Terminal output is flat colour — a few dozen distinct values across the whole frame — so
      # a palette costs nothing visible and roughly halves the file. This image is the first
      # thing the README and the home page load.
      - name: Reduce the palette
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          before=$(stat -c%s contrib/demo/scan.png)
          ffmpeg -loglevel error -y -i contrib/demo/scan.png -vf palettegen=max_colors=64 /tmp/palette.png
          ffmpeg -loglevel error -y -i contrib/demo/scan.png -i /tmp/palette.png \
            -lavfi paletteuse=dither=none -pix_fmt pal8 /tmp/scan.png
          # Only keep it if it actually helped; a palette can lose to the original.
          after=$(stat -c%s /tmp/scan.png)
          if [ "$after" -lt "$before" ]; then
            mv /tmp/scan.png contrib/demo/scan.png
          fi
          echo "$before -> $(stat -c%s contrib/demo/scan.png) bytes"

      # The home page shows a short terminal block rather than the whole screenshot: a visitor
      # gives it three seconds, and the shape of the answer — one command, five controls, one
      # verdict, a non-zero exit — is what has to land in them. As text it stays crisp at any
      # zoom, can be selected and indexed, and costs a kilobyte instead of two hundred.
      #
      # Generated, not written. The block it replaces was maintained by hand and drifted until it
      # showed a different scan from the image beside it; nothing catches that but a person
      # noticing. A PTY is needed because Draugr colours output only for a terminal — piping the
      # scan straight to a file would capture it plain, and the fragment would be grey.
      # Again, because rendering the tape ran a scan of its own and that scan disturbs the tree.
      # The earlier cleanup happens before the render, so by here the sandbox is dirty and the
      # fragment would report uncommitted files the screenshot beside it does not — the two
      # assets disagreeing about one scan, which is the drift this whole job exists to prevent.
      - name: Put the sandbox back, again, before capturing
        if: ${{ inputs.screenshot || github.event_name == 'push' }}
        working-directory: draugr-demo
        run: |
          set -euo pipefail
          git checkout -- .
          git clean -fdq
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the sandbox is still dirty; the fragment would describe a tree the" \
                 "screenshot does not"; exit 1
          fi

      - name: Capture the terminal fragment
        working-directory: draugr-demo
        run: |
          set -uo pipefail
          # The scan is expected to exit non-zero — the sandbox fails its gate, which is the
          # point of the block. `set +e` is load-bearing: the runner's default shell is
          # `bash -e`, so without it the step dies on that exit code before reading it.
          set +e
          script -qec "draugr scan . 2>/dev/null" /dev/null > /tmp/scan.ansi
          code=$?
          set -e
          echo "scan exited $code, captured $(wc -c < /tmp/scan.ansi) bytes"
          head -3 /tmp/scan.ansi | cat -v
          cd "$GITHUB_WORKSPACE"
          go run ./contrib/demo/ansi2html \
            -command "draugr scan ." -stop-at "Fix first" -exit "$code" \
            < /tmp/scan.ansi > contrib/demo/scan.html
          # The cut is a line prefix, so rewording that heading would stop it happening and the
          # fragment would quietly grow into the wall of findings it exists to avoid.
          size=$(stat -c%s contrib/demo/scan.html)
          echo "fragment is $size bytes"
          [ "$size" -gt 200 ] && [ "$size" -lt 4000 ] || {
            echo "::error::fragment is $size bytes — expected the verdict and control table only." \
                 "Did the 'Fix first' heading change?"; exit 1; }

      - name: Open a PR with the regenerated assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add contrib/demo/scan.png contrib/demo/scan.html
          if git diff --cached --quiet; then
            echo "Assets unchanged — nothing to do."
            exit 0
          fi
          git config user.name "Wilson Santos"
          git config user.email "wilson@draugr.dev"
          branch="demo-assets-$(git rev-parse --short HEAD)"
          git checkout -B "$branch"
          git commit -m "docs: regenerate the demo assets"
          # Force, because the branch name is derived from the commit being rendered and a second
          # run at the same commit is normal — a transient download failure, or asking for the
          # screenshot after a fragment-only pass. The branch is this workflow's own throwaway and
          # nothing else writes to it, so the newest render simply supersedes the last. Without
          # this the push is rejected and a successful render is thrown away at the final step.
          git push -u --force origin "$branch"

          # Discard superseded renders. Each run names its branch after the commit it rendered,
          # so an earlier one is a picture of older output that nobody merged — and keeping them
          # means the branch list grows by one per release until the dead ones outnumber the
          # live one. A superseded render has no value: the newest is the only candidate.
          #
          # Closing its pull request is the point rather than a side effect. Two open PRs both
          # offering to replace the same image is a choice nobody should have to make.
          for old in $(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' \
                        | grep '^demo-assets-' | grep -vx "$branch" || true); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$old" \
              && echo "discarded superseded render $old"
          done

          # Best-effort: creating a PR needs the org's "Allow GitHub Actions to create pull
          # requests" setting. If it's off, just print the compare link — the branch is pushed.
          gh pr create --title "docs: regenerate the demo assets" \
            --body "Auto-rendered by the Demo assets workflow: \`scan.png\` from \`contrib/demo/scan.tape\` for the README, and \`scan.html\` — the verdict and control table as text — for the home page, which pulls it at build time." \
            || echo "::notice::Branch $branch pushed. Open a PR: https://github.com/draugr-dev/draugr/compare/$branch?expand=1"
