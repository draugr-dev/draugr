name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default; jobs opt into more if needed.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  # Does this change touch anything that Go tooling could have an opinion about?
  #
  # The three jobs below are required by branch protection, so they cannot simply be skipped
  # with paths-ignore: a required check that never reports leaves the PR unmergeable forever.
  # Instead they always run and report, and skip their expensive steps when only prose changed.
  # A docs PR then costs seconds rather than three minutes.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; a shallow clone has only the tip.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            # A push to main, or anything without a PR base: assume code and run everything.
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Anything that isn't documentation is treated as code. Erring this way means a new
          # kind of file gets tested rather than silently skipped.
          if git diff --name-only "$base" HEAD \
             | grep -qvE '^(docs/|LICENSE$|.*\.md$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation changed — the Go jobs will report without running."
          fi

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Verify formatting
        if: needs.changes.outputs.code == 'true'
        run: |
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then
            echo "These files are not gofmt-formatted:"; echo "$fmtout"; exit 1
          fi
      - name: go vet
        if: needs.changes.outputs.code == 'true'
        run: go vet ./...
      - name: Test (race + coverage)
        if: needs.changes.outputs.code == 'true'
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: go build ./...
      - name: Verify go.mod is tidy
        if: needs.changes.outputs.code == 'true'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  lint:
    name: Lint (golangci-lint + gosec)
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        if: needs.changes.outputs.code == 'true'
        with:
          version: v2.12.2

  govulncheck:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
      - name: Install govulncheck
        if: needs.changes.outputs.code == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        if: needs.changes.outputs.code == 'true'
        run: govulncheck ./...
