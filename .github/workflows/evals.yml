name: Evals

# Runs the Claude Code plugin's eval suite (contrib/claude-plugin/evals): real prompts a user would
# type, answered by a model with the plugin loaded and the real MCP server behind it, graded on
# which tools it reached for and what it told the user.
#
# The unit tests prove each MCP tool returns the right answer. They cannot prove a model picks the
# tool, reads its answer correctly, or stops at the approval the server asks for, and a reworded
# tool description can break all three while every Go test still passes. That is what this suite
# measures.
#
# It runs by hand, at a commit somebody names, until a run is stable enough to gate a pull request
# on. A single run per case cannot tell a flaky case from a broken one, and three runs on every pull
# request that touches the server cost more than an unstable signal is worth.
#
#   gh workflow run Evals -f ref=<commit>
#
# Every run is billed to an API key, so what one can cost is bounded here:
#
# - Dispatch only. A run executes the named commit's code with the key, so for a pull request from a
#   fork, name the head commit you read, and a later push cannot ride on the review.
# - Three runs per case by default, about US$6.30 for the suite; one run is about US$2.10.
# - A fixed suite. The case count, each case's turn limit and the cost ceiling below are all in this
#   repository, so nothing in a pull request's description or title changes what a run spends.
# - One run per commit. A second dispatch for the same commit cancels the run in flight.
#
# The key comes from a workspace of its own with a monthly spend limit, so a runaway run is capped
# by the account as well as by --max-cost-usd.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The commit to evaluate. For a pull request from a fork, the head commit you reviewed:
          the run executes that commit's code with the API key.
        required: true
        type: string
      runs:
        description: Runs per case. The cost ceiling is US$3 for each run of the suite.
        required: false
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: evals-${{ inputs.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.10"
  EVAL_MODEL: claude-sonnet-5-5
  JUDGE_MODEL: claude-haiku-5-5

jobs:
  evals:
    name: Plugin evals
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # The server the plugin starts is the draugr first on PATH, so it is this commit's build rather
      # than a release. Each run gets a temporary home, which hides ~/.draugr/bin from Draugr's own
      # lookup, so the scanners go on PATH too.
      #
      # The cases scan with gitleaks and semgrep. Given their descriptor, check_tools also lists
      # gosec, which can serve sast, and syft as required, and reports the machine not ready
      # without them, which stops a model before it scans. Both are installed so that a score
      # measures the model and the plugin.
      - name: Build draugr and provision the scanners the cases use
        run: |
          set -euo pipefail
          make build
          ./bin/draugr tools install -y gitleaks semgrep gosec syft
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
          echo "$HOME/.draugr/bin" >> "$GITHUB_PATH"

      # The release is pinned by hash in .github/evals-harness/package-lock.json, so a score moves
      # because the plugin or the model changed, never because the harness did.
      - name: Install Claude Code
        run: |
          set -euo pipefail
          npm ci --prefix .github/evals-harness --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/.github/evals-harness/node_modules/.bin" >> "$GITHUB_PATH"

      # --ablation none runs the plugin arm only: the gate is whether the plugin does its job, and a
      # no-plugin baseline would double the cost to report a delta the exit code ignores.
      #
      # --keep-temp leaves each run's sandbox in place, so each run's trace.jsonl, the session the
      # graders read, is uploaded with the results. The transcript shows why a run failed.
      - name: Run the suite
        working-directory: contrib/claude-plugin
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNS: ${{ inputs.runs }}
          # survey-no-cluster asks for a namespace's images with no cluster to read them from.
          KUBECONFIG: /nonexistent/kubeconfig
        run: |
          set -euo pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY secret is not set." >&2
            exit 1
          fi
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --mocks off \
            --allow-tools "mcp__plugin_draugr_draugr__*" Write \
            --ablation none \
            --model "$EVAL_MODEL" \
            --judge-model "$JUDGE_MODEL" \
            --threshold 0.8 \
            --runs "$RUNS" \
            --max-cost-usd "$((RUNS * 3))" \
            --no-publish \
            --keep-temp \
            --json "$RUNNER_TEMP/results.json" \
            -j 4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-results
          path: |
            ${{ runner.temp }}/results.json
            contrib/claude-plugin/evals/results/
            /tmp/claude-eval-*/out/trace.jsonl
          if-no-files-found: ignore
