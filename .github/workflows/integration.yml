name: Integration

# Integration tests exercise real external dependencies — a real Trivy binary and an
# ephemeral kind cluster — that the unit tests stub out (see issue #39). They are heavier and
# slower than unit tests, so they do NOT run on every PR: they run on main, on a nightly
# schedule, on demand, and on a PR that either carries the `ci-integration` label or changes the
# suite itself.
#
# That second condition is not a convenience. A pull request adding an integration test would
# otherwise merge without the job that runs it ever having run — the test looks reviewed, is
# green, and has never executed. Nothing about that is visible in the checks: a skipped job reads
# much like a passing one.
#
# Advisory on a pull request, and binding on a release. A required check on every PR would make
# most changes wait several minutes on a kind cluster to learn something a unit test already
# said; a release is the one moment the cost is obviously worth it, because it is the moment the
# artifact reaches people. So release.yml calls this and refuses to publish without it.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *" # nightly at 06:23 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  # Called by release.yml against the tag. The `if:` below resolves to "run" because the caller's
  # event is a push, which is what a tag is — the label opt-in only applies to pull requests.
  workflow_call:
    inputs:
      ref:
        description: >-
          What to check out. Defaults to the caller's own commit, which is right for every path
          but a release: there the tree being judged is the tag, and "was this exact tree
          acceptable" has one honest answer.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # An exact patch, not "1.26". govulncheck fails the build on stdlib vulnerabilities fixed in a
  # patch release, and setup-go's version manifest lags go.dev by a day or two — so the floating
  # minor resolves to yesterday's patch and every pull request goes red for something no pull
  # request did. Bump this when govulncheck names a newer one.
  GO_VERSION: "1.26.6"
  # The kube-bench release whose benchmark definitions the CIS catalog is checked against.
  # Keep in sync with defaultKubeBenchImage in internal/scanners/kube_bench_job.go, so that
  # bumping the image is when a benchmark revision is discovered rather than later.
  KUBE_BENCH_VERSION: "v0.15.6"
  KUBE_BENCH_COMMIT: "92e522b9ac82d4253e8b7582de1e75f5dae1f4b5"

jobs:
  # Whether this pull request changes the suite itself. A job cannot look at the diff from an
  # `if:`, so the answer has to be computed first and handed over.
  suite:
    name: Detect suite changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the base commit to diff against; a shallow clone has only the tip.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The suite is the tests, the tag they hide behind, and the workflow that runs them.
          # A change to any of the three is a change nobody can review by reading a green tick.
          #
          # pkg/report is in the list because several of these tests assert on what a real scan
          # printed — that a spec-driven scan named the operations it was not allowed to send,
          # that a repository scan named the revision it read. Those assertions are the only
          # place a coverage statement is checked against a real run rather than a fixture, so
          # they break on a rendering change, and every other job stays green while they do.
          # The next thing to run them would be the release tag, which is the most expensive
          # moment to learn it.
          #
          # pkg/skald for the same reason, one directory over: it writes the two artifacts those
          # tests then read back — the SARIF they parse to name the tools a scan really ran, and
          # the JSON evidence document. "Rendering" is not only what a terminal shows, and a
          # filter that names the renderer but not the writer covers the half with the loudest
          # failure rather than the half a pipeline consumes.
          if git diff --name-only "$base" HEAD \
             | grep -qE '^(test/integration/|pkg/report/|pkg/skald/|\.github/workflows/integration\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  integration:
    name: Integration (kind + real scanners)
    needs: suite
    # Always off a pull request, unless somebody opted in — or unless the pull request changes the
    # suite, in which case running it is not optional: merging a test the job never ran is how a
    # suite quietly stops meaning anything.
    # No always(): if the detection job fails, this one is skipped and the workflow is red, which
    # is visible. Running anyway on an empty output would put the decision back where it started —
    # a suite-changing pull request merging without the suite having run, and nothing saying so.
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci-integration') ||
      needs.suite.outputs.changed == 'true' 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Fetch kube-bench's benchmark definitions
        # Read, never executed — these are the YAML files the CIS catalog is diffed against.
        # The tag is verified against a commit because a tag can be repushed, and a benchmark
        # that changed under a stable tag is exactly what this checkout exists to detect.
        run: |
          git clone --quiet --depth 1 --branch "$KUBE_BENCH_VERSION" \
            https://github.com/aquasecurity/kube-bench "$RUNNER_TEMP/kube-bench"
          actual=$(git -C "$RUNNER_TEMP/kube-bench" rev-parse HEAD)
          if [ "$actual" != "$KUBE_BENCH_COMMIT" ]; then
            echo "::error::$KUBE_BENCH_VERSION resolves to $actual, expected $KUBE_BENCH_COMMIT" >&2
            exit 1
          fi
          echo "KUBE_BENCH_CFG=$RUNNER_TEMP/kube-bench/cfg" >> "$GITHUB_ENV"

      - name: Build draugr
        run: make build

      - name: Provision the scanners with draugr
        # The tools come from the same pinned, verified manifest users get, so what these tests
        # prove Draugr's argv and parsing against is the build everybody runs — and the installer
        # itself gets exercised by the job whose premise is real tools.
        #
        # Onto PATH explicitly. Draugr prepends its own bin directory when it execs a scanner, so
        # a scan would find them regardless; these tests look the binaries up themselves to decide
        # whether they can run, and a tool only Draugr can see leaves them skipping.
        run: |
          set -euo pipefail
          ./bin/draugr tools install -y
          echo "$HOME/.draugr/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        env:
          # Exercise the real built binary in the end-to-end scan test.
          DRAUGR_BIN: ${{ github.workspace }}/bin/draugr
          # This job provisions the scanners above, so a test that cannot find one is the
          # provisioning being wrong rather than the test being unrunnable. Without this they skip
          # themselves and the job reports success for having run nothing — which is the failure
          # Draugr exists to catch, in Draugr's own pipeline.
          DRAUGR_INTEGRATION_STRICT: "1"
        # internal/scanners carries the CIS catalog drift check, which needs the definitions
        # fetched above. It is listed explicitly because ./test/integration/... would not reach it,
        # and a drift guard that never runs is the failure it was written to prevent.
        run: go test -tags integration -v -timeout 15m ./test/integration/... ./internal/scanners/...
