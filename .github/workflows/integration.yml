name: Integration

# Integration tests exercise real external dependencies, a real Trivy binary and an
# ephemeral kind cluster, that the unit tests stub out (see issue #39). They run on every pull
# request, on main, on a nightly schedule, on demand, and against a release tag.
#
# Being required is what makes running unconditionally part of the same decision. A required check
# that never runs is never reported, and a pull request waiting on a report that will not arrive
# cannot merge at all.
#
# This suite is the only place several behaviors are checked against real tools, real registries
# and a real cluster rather than against fixtures, so it is the only place their failure is visible
# before a release tag.
#
# The job always runs and always reports. What it decides first is whether it has anything to
# judge: a pull request whose diff is nothing but prose, pictures and release notes reports in
# seconds instead of spending several minutes on a kind cluster. scripts/integration-needed.sh
# holds that decision, and it names what cannot reach the suite rather than what can, so anything
# new runs by default and the list is only ever wrong about how long a pull request waits.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *" # nightly at 06:23 UTC
  workflow_dispatch:
  pull_request:
  # Called by release.yml against the tag.
  workflow_call:
    inputs:
      ref:
        description: >-
          What to check out. Defaults to the caller's own commit, which is right for every path
          but a release: there the tree being judged is the tag, and "was this exact tree
          acceptable" has one honest answer.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # An exact patch, not "1.26". govulncheck fails the build on stdlib vulnerabilities fixed in a
  # patch release, and setup-go's version manifest lags go.dev by a day or two, so the floating
  # minor resolves to yesterday's patch and every pull request goes red for something no pull
  # request did. Bump this when govulncheck names a newer one.
  GO_VERSION: "1.26.6"
  # The kube-bench release whose benchmark definitions the CIS catalog is checked against.
  # Keep in sync with defaultKubeBenchImage in internal/scanners/kube_bench_job.go, so that
  # bumping the image is when a benchmark revision is discovered rather than later.
  KUBE_BENCH_VERSION: "v0.15.6"
  KUBE_BENCH_COMMIT: "92e522b9ac82d4253e8b7582de1e75f5dae1f4b5"

jobs:
  integration:
    name: Integration (kind + real scanners)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The whole history, because the step below diffs this branch against the commit it
          # branched from, and a shallow clone holds neither end of that.
          fetch-depth: 0

      # Whether this run has anything to judge. Only a pull request has a diff to narrow; a push, a
      # schedule, a dispatch and a release tag all run the suite, because the question they answer
      # is about a tree rather than about a change.
      - name: Decide whether the diff needs the suite
        id: needed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running: $GITHUB_EVENT_NAME judges a tree, not a change." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          run=$(printf '%s\n' "$changed" | ./scripts/integration-needed.sh)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [ "$run" = "true" ]; then
            echo "Running the suite." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "Nothing to run. Every changed path is prose, a picture or release notes, none"
              echo "of which a Go test, a scanner or a build reads:"
              echo
              printf '%s\n' "$changed" | sed 's/^/    /'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.needed.outputs.run == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Create kind cluster
        if: steps.needed.outputs.run == 'true'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Fetch kube-bench's benchmark definitions
        if: steps.needed.outputs.run == 'true'
        # Read, never executed, these are the YAML files the CIS catalog is diffed against.
        # The tag is verified against a commit because a tag can be repushed, and a benchmark
        # that changed under a stable tag is exactly what this checkout exists to detect.
        run: |
          git clone --quiet --depth 1 --branch "$KUBE_BENCH_VERSION" \
            https://github.com/aquasecurity/kube-bench "$RUNNER_TEMP/kube-bench"
          actual=$(git -C "$RUNNER_TEMP/kube-bench" rev-parse HEAD)
          if [ "$actual" != "$KUBE_BENCH_COMMIT" ]; then
            echo "::error::$KUBE_BENCH_VERSION resolves to $actual, expected $KUBE_BENCH_COMMIT" >&2
            exit 1
          fi
          echo "KUBE_BENCH_CFG=$RUNNER_TEMP/kube-bench/cfg" >> "$GITHUB_ENV"

      - name: Build draugr
        if: steps.needed.outputs.run == 'true'
        run: make build

      # The week this run belongs to, so the template cache is written once a week and read the
      # rest of the time. A key that changes every run writes an entry every run and evicts
      # everything else in the process.
      - name: Name the week
        if: steps.needed.outputs.run == 'true'
        id: week
        run: echo "stamp=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # The one piece of scanner data this job fetches from a host it does not control, from a
      # runner on a shared IP pool, against a repository republished daily.
      #
      # Restored before the tools are provisioned, so the set is on disk when the first scan warms
      # it. A warm that cannot reach GitHub then scans with what is here and says so, rather than
      # failing the control.
      #
      # A week-old copy is the right trade for this suite and not for a user: these tests point
      # Nuclei at a server they start themselves and assert which requests arrive, so they need
      # templates rather than today's templates. The stamp rolls so the set cannot drift forever.
      - name: Restore the Nuclei template set
        if: steps.needed.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/nuclei-templates
          key: nuclei-templates-${{ runner.os }}-${{ steps.week.outputs.stamp }}
          restore-keys: |
            nuclei-templates-${{ runner.os }}-

      - name: Provision the scanners with draugr
        if: steps.needed.outputs.run == 'true'
        # The tools come from the same pinned, verified manifest users get, so what these tests
        # prove Draugr's argv and parsing against is the build everybody runs, and the installer
        # itself gets exercised by the job whose premise is real tools.
        #
        # Onto PATH explicitly. Draugr prepends its own bin directory when it execs a scanner, so
        # a scan would find them regardless; these tests look the binaries up themselves to decide
        # whether they can run, and a tool only Draugr can see leaves them skipping.
        run: |
          set -euo pipefail
          # --all rather than the default: this suite exercises every scanner, not the few
          # a descriptor here would name.
          ./bin/draugr tools install -y --all
          echo "$HOME/.draugr/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        if: steps.needed.outputs.run == 'true'
        env:
          # Exercise the real built binary in the end-to-end scan test.
          DRAUGR_BIN: ${{ github.workspace }}/bin/draugr
          # This job provisions the scanners above, so a test that cannot find one is the
          # provisioning being wrong rather than the test being unrunnable. Without this they skip
          # themselves and the job reports success for having run nothing, which is the failure
          # Draugr exists to catch, in Draugr's own pipeline.
          DRAUGR_INTEGRATION_STRICT: "1"
        # internal/scanners carries the CIS catalog drift check, which needs the definitions
        # fetched above. It is listed explicitly because ./test/integration/... would not reach it,
        # and a drift guard that never runs is the failure it was written to prevent.
        run: go test -tags integration -v -timeout 15m ./test/integration/... ./internal/scanners/...

  # A red suite on main has to reach a person.
  #
  # Requiring it on pull requests narrows how main goes red without closing it: two pull requests
  # each green against their own base can be red together, the nightly run judges a tree nobody
  # pushed that day, and this suite depends on registries and images that move on their own
  # schedule. In all three the failure arrives when nobody is looking at a checks page. The site's
  # own scan carries this same job for the same reason: a check that is only a color on a page
  # somebody has already closed is not a signal.
  #
  # One issue, reused, closed when the suite is green again. A fresh issue per red run turns one
  # slow-moving break into a week of duplicates, and closing on green is what makes an open one
  # mean "red now" rather than "was red once".
  notify:
    name: A red suite on main raises an issue
    needs: integration
    # Not on pull requests: the author is looking at the failing check already, and an issue would
    # be telling them what their own screen says.
    if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT: ${{ needs.integration.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            // Through the API rather than the `gh` binary, so the notifier does not depend on what
            // happens to be installed on the machine it lands on. It exists to speak up when the
            // suite cannot, and one that dies with "command not found" is a silence with a red
            // tick on it.
            const label = "integration-red";
            const { owner, repo } = context.repo;
            const sha = context.sha.slice(0, 8);
            const commit = `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/commit/${context.sha}`;

            await github.rest.issues.createLabel({
              owner, repo, name: label, color: "B60205",
              description: "The integration suite is failing on main",
            }).catch(() => {}); // already there

            const open = await github.rest.issues.listForRepo({
              owner, repo, labels: label, state: "open", per_page: 1,
            });
            const existing = open.data[0];

            if (process.env.RESULT !== "failure") {
              if (!existing) return console.log("green, and nothing open");
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Green again as of \`${sha}\`. Closing, because an open issue with this label means the suite is failing now rather than that it failed once.`,
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed" });
              return console.log(`closed #${existing.number}`);
            }

            const body = [
              `The integration suite is failing on main as of [\`${sha}\`](${commit}).`,
              "",
              `[The run](${process.env.RUN_URL}) has the log.`,
              "",
              "**This suite is the only place several behaviors are checked against real tools, real registries and a real cluster rather than against fixtures.** Every pull request runs it and it is required to pass, so main going red means something reached it that the gate on each branch did not catch: a merge race, a nightly run against an upstream image that moved, or a registry answering differently than it did an hour ago.",
              "",
              "This issue closes itself when the suite is green again.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              return console.log(`updated #${existing.number}`);
            }
            const made = await github.rest.issues.create({
              owner, repo, labels: [label], body,
              title: "The integration suite is failing on main",
            });
            console.log(`opened #${made.data.number}`);
