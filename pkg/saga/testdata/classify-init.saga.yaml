# yaml-language-server: $schema=https://draugr.dev/schema/v0.176.1/draugr.saga.schema.json
# Generated by `draugr init`. Edit to taste, then: draugr scan draugr.saga.yaml
project: draugr-demo
config:
  reachability:
    analyzers: [govulncheck]   # ranks a Go finding down when no code calls it · checkout/go.mod
  controls:
    sca:
      enabled: true       # dependency vulnerabilities (Trivy)
      retirejs:
        enabled: true     # copied JavaScript, outside any lockfile · app/static/js/jquery.min.js · web/static/js/jquery.min.js
    secrets:
      enabled: true       # leaked credentials (Gitleaks)
    sast:
      enabled: true       # code security (Semgrep)
      gosec:
        enabled: true     # Go-specific checks · checkout/go.mod
    iac:
      enabled: true       # IaC misconfiguration (Trivy config) · deploy/pod.yaml · app/Dockerfile
    # images:
    #   enabled: true     # container CVEs (Trivy). Add your built image below
components:
  - name: draugr-demo
    repositories:
      - url: .
    # Directories with their own dependency files: app · checkout · web
    # `draugr init --per-directory` writes a component for each.
    # images:
    #   - image: myorg/draugr-demo:latest
    # hosts:            # for the headers/DAST controls
    #   - name: api
    #     url: https://api.example.com
    #     type: api
